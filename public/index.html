async function _instaDraftSaveEdit(id) {
  const caption = document.getElementById('edit-caption')?.value || '';
  const hashtagsRaw = document.getElementById('edit-hashtags')?.value || '';
  const hashtags = hashtagsRaw.split(',').map(h => h.trim()).filter(Boolean).map(h => h.startsWith('#') ? h : '#' + h);
  try {
    await apiFetch('/api/instagram/drafts/' + encodeURIComponent(id), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ caption, hashtags })
    });

    _instaDraftsCache = null;
    loadInstagram();
    _toast('Draft gespeichert');
  } catch (e) {
    _toast('Fehler: ' + netzFehlerText(e));
  }

        <code style="flex:1;background:var(--surface);padding:8px 10px;border-radius:6px;font-size:13px;border:1px solid var(--border);word-break:break-all;color:var(--accent)">${esc(hashtags)}</code>

function _fmtFileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

      return `<tr>

        <td style="font-size:13px;color:var(--muted)">${fmtDT(f.mtime)}</td>
      </tr>`;
    }).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:20px">Keine Dateien</td></tr>';
    wrap.innerHTML = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <button class="btn" style="font-size:13px;padding:4px 10px;background:var(--surface);border:1px solid var(--border);color:var(--muted)" onclick="_rawDetailSession=null;_instaLoadRaw()">← Zurück</button>

        <div style="font-size:13px;color:var(--muted)">${fmtDT(s.created_at)}</div>
      </div>
      ${_instaStatusBadge(s.status)}
    </div>
    <div style="display:flex;gap:6px;margin-bottom:16px">
      <button class="btn btn-primary" style="font-size:13px;padding:5px 12px" onclick="_instaRawUpload('${esc(s.id)}')">📤 Upload</button>
      <button class="btn" style="font-size:13px;padding:5px 12px;background:var(--surface);border:1px solid var(--border);color:var(--text)" onclick="instaRawScanKopieren('${esc(s.id)}')">🔍 Prüflauf-Befehl kopieren</button>
    </div>
    <div class="card card-pad">
      <div style="font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:12px">Dateien (${files.length})</div>
      <table><thead><tr><th>Name</th><th>Typ</th><th>Größe</th><th>Geändert</th></tr></thead><tbody>${fileRows}</tbody></table>
    </div>`;
  } catch (e) {
    wrap.innerHTML = `<div class="card card-pad" style="color:var(--red)">Fehler: ${esc(netzFehlerText(e))}</div>`;
  }
}

    <h3 style="margin-bottom:16px">Neue Raw Session</h3>
    <div style="margin-bottom:12px">
      <label style="font-size:13px;color:var(--muted);display:block;margin-bottom:4px">Kontext/Name (optional)</label>
      <input id="rawCtx" class="inp" placeholder="z.B. drohne-barcelona" style="width:100%;box-sizing:border-box">

    <div class="modal-actions">

  `);
}

async function _instaCreateRawSession() {
  const ctx = document.getElementById('rawCtx')?.value?.trim() || '';
  try {
    await apiFetch('/api/instagram/raw', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ context: ctx || undefined }) });
    closeModal();
    _rawDetailSession = null;
    loadInstagram();
  } catch (e) {
    dialogMeldung('Session konnte nicht angelegt werden: ' + netzFehlerText(e));
  }
}

function _instaRawUpload(sessionId) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.multiple = true;
  inp.accept = 'image/*,video/*';
  inp.onchange = async () => {
    const files = Array.from(inp.files || []);
    if (!files.length) return;
    const wrap = document.getElementById('rawContent');
    for (let i = 0; i < files.length; i++) {
      if (wrap) {
        const prog = wrap.querySelector('#rawUploadProg');
        if (prog) prog.textContent = `Uploading ${i + 1}/${files.length}…`;
        else wrap.insertAdjacentHTML('afterbegin', `<div id="rawUploadProg" class="badge badge-yellow" style="margin-bottom:10px">Uploading ${i + 1}/${files.length}…</div>`);
      }
      const fd = new FormData();
      fd.append('file', files[i]);
      await apiFetch('/api/instagram/raw/' + encodeURIComponent(sessionId) + '/upload', { method: 'POST', body: fd });
    }
    _rawDetailSession = sessionId;
    loadInstagram();
  };
  inp.click();
}

async function _instaRawDelete(sessionId) {
  try {
    await apiFetch('/api/instagram/raw/' + encodeURIComponent(sessionId), { method: 'DELETE' });
    _rawDetailSession = null;
    loadInstagram();
  } catch (e) {
    meldung('Session konnte nicht gelöscht werden: ' + netzFehlerText(e), 'error');
  }
}

function _toast(msg) {
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--text);padding:8px 16px;border-radius:8px;font-size:13px;border:1px solid var(--border);z-index:10000;box-shadow:var(--shadow-lift)';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

/* ── Trading ── */
let _tradingRefresh = null;
function fmtUsd(n) { return n != null ? Number(n).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '\u00a0$' : '–'; }
function pnlColor(n) { return n > 0 ? 'var(--green)' : n < 0 ? 'var(--red)' : 'var(--muted)'; }
function pnlPrefix(n) { return n > 0 ? '+' : ''; }

async function loadTrading() {
  const c = document.getElementById('content');
  if (_tradingRefresh) { clearInterval(_tradingRefresh); _tradingRefresh = null; }

  async function render() {
    let status, watchlist, strategies, universe, universeConfig, universeTop;
    try {
      [status, watchlist, strategies, universe, universeConfig, universeTop] = await Promise.all([
        apiFetch('/api/trading/status'),
        apiFetch('/api/trading/watchlist'),
        apiFetch('/api/trading/strategies'),
        apiFetch('/api/trading/universe').catch(() => null),
        apiFetch('/api/trading/universe/config').catch(() => null),
        apiFetch('/api/trading/universe/top').catch(() => null),
      ]);
    } catch { status = null; watchlist = []; strategies = {}; universe = null; universeConfig = null; universeTop = null; }

    if (!status || status.error) {
      c.innerHTML = `<div class="empty" style="text-align:center;padding:60px 20px">
        <div style="font-size:48px;margin-bottom:16px">📈</div>
        <h2 style="margin-bottom:8px;color:var(--fg)">Trading</h2>
        <p style="color:var(--muted);font-size:14px">Service nicht verbunden.</p>
        <p style="color:var(--muted);font-size:13px;margin-top:8px">${esc(status?.error || 'Trading-Agent ist nicht erreichbar.')}</p>
      </div>`;
      stamp();
      setDatenstand([{ quelle: 'Trading-Agent', zustand: 'getrennt', stand: null, abgleich: null,
        hinweis: 'Kein Zustand abrufbar — die Angaben unten fehlen, sie sind nicht „in Ordnung".' }]);
      return;
    }

    const modeLabel = status.mode === 1 ? 'Monitoring' : status.mode === 2 ? 'Semi-Auto' : 'Full-Auto';
    const modeBadge = status.mode === 1 ? 'badge-blue' : status.mode === 2 ? 'badge-yellow' : 'badge-red';
    /* Gleiches Zustandsvokabular wie im Status-Bereich (Spec §4 B). Vorher
       stand hier "Verbunden", waehrend der Status-Bereich gleichzeitig
       "IB Gateway down" meldete — ohne dass die Begriffe vergleichbar waren. */
    const connCode = status.connected === true ? 'erreichbar'
      : status.connected === false ? 'getrennt' : 'unbekannt';
    /* Paper- oder Echtgeldkonto muss eindeutig sein (Spec §4 B, §7). */
    const kontoArt = status.paperMode === true ? 'Paper Trading (kein echtes Geld)'
      : status.paperMode === false ? 'ECHTGELD-KONTO'
      : 'Kontoart unbekannt';
    const kontoFarbe = status.paperMode === true ? 'var(--muted)'
      : status.paperMode === false ? 'var(--red)' : 'var(--yellow)';

    // KPI cards
    const kpiHtml = `<div class="summary-grid">
      <div class="s-card"><div class="lbl">Modus</div><div class="val" style="font-size:18px"><span class="badge ${modeBadge}">${modeLabel}</span></div></div>
      <div class="s-card"><div class="lbl">Verbindung zum Broker</div><div class="val" style="font-size:18px">${zustandsBadge(connCode)}</div><div class="sub" style="color:${kontoFarbe};font-weight:600">${esc(kontoArt)}${status.account ? ' · ' + esc(status.account) : ''}</div></div>
      <div class="s-card"><div class="lbl">Tages-P&amp;L</div><div class="val" style="font-size:22px;color:${pnlColor(status.dailyPnl)}">${pnlPrefix(status.dailyPnl)}${fmtUsd(status.dailyPnl)}</div></div>
      <div class="s-card"><div class="lbl">Unrealisiert P&amp;L</div><div class="val" style="font-size:22px;color:${pnlColor(status.unrealizedPnl)}">${pnlPrefix(status.unrealizedPnl)}${fmtUsd(status.unrealizedPnl)}</div></div>
      <div class="s-card"><div class="lbl">Net Liquidation</div><div class="val" style="font-size:22px">${fmtUsd(status.netLiquidation)}</div></div>
      <div class="s-card"><div class="lbl">Cash</div><div class="val" style="font-size:22px">${fmtUsd(status.cashBalance)}</div></div>
    </div>`;

    // Positions table
    let posHtml = '';
    if (status.positions && status.positions.length > 0) {
      const rows = status.positions.map(p => `<tr>
        <td><strong>${esc(p.symbol)}</strong></td>
        <td>${esc(p.exchange)}</td>
        <td style="text-align:right">${p.quantity}</td>
        <td style="text-align:right">${fmtUsd(p.avgCost)}</td>
        <td style="text-align:right">${fmtUsd(p.marketPrice)}</td>
        <td style="text-align:right">${fmtUsd(p.marketValue)}</td>
        <td style="text-align:right;color:${pnlColor(p.unrealizedPnl)}">${pnlPrefix(p.unrealizedPnl)}${fmtUsd(p.unrealizedPnl)}</td>
      </tr>`).join('');
      posHtml = `<h3 style="margin:20px 0 10px">Positionen</h3>
      <div style="overflow-x:auto"><table class="data-table" style="width:100%" data-tabelle="karten">
        <thead><tr><th>Symbol</th><th>Börse</th><th style="text-align:right">Menge</th><th style="text-align:right">Ø Kaufkurs</th><th style="text-align:right">Marktpreis</th><th style="text-align:right">Marktwert</th><th style="text-align:right">Gewinn/Verlust</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
    } else {
      posHtml = `<div style="margin:20px 0">${zustandBlock('keine_daten', 'Im Depot ist derzeit keine Position offen.')}</div>`;
    }

    // Watchlist
    const wlRows = (watchlist || []).map(w => `<tr>
      <td><strong>${esc(w.symbol)}</strong></td>
      <td>${esc(w.exchange)}</td>
      <td>${esc(w.currency)}</td>
      <td style="text-align:right">${w.lastPrice ? fmtUsd(w.lastPrice) : '–'}</td>
      <td><button class="btn btn-sm" onclick="tradingRemoveWatch('${esc(w.symbol)}')" style="padding:2px 8px;font-size:13px">Entfernen</button></td>
    </tr>`).join('');

    const wlHtml = `<h3 style="margin:20px 0 10px">Beobachtungsliste</h3>
    <!-- P2-8: flex-wrap, damit die Zeile schmal umbricht statt die
         Schaltflaeche abzuschneiden. Die Felder sind seit P2-8 44 px hoch
         und breiter als zuvor; bei 360 px passen sie nicht mehr in eine Zeile. -->
    <div style="margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <!-- P2-8: drei Felder von 29 px Hoehe mit englischen Platzhaltern.
           Jetzt 44 px hoch, deutsche Beschriftung und zugaenglicher Name.
           Die Breiten bleiben: es sind Kuerzel, keine Fliesstexte. -->
      <input id="wl-symbol" placeholder="Symbol" aria-label="Symbol" style="width:90px;min-height:44px;box-sizing:border-box;padding:10px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);color:var(--fg);font-size:13px">
      <input id="wl-exchange" placeholder="Börse" aria-label="Börse" value="SMART" style="width:90px;min-height:44px;box-sizing:border-box;padding:10px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);color:var(--fg);font-size:13px">
      <input id="wl-currency" placeholder="Währung" aria-label="Währung" value="USD" style="width:90px;min-height:44px;box-sizing:border-box;padding:10px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);color:var(--fg);font-size:13px">
      <button class="btn btn-primary" onclick="tradingAddWatch()" style="padding:10px 14px;font-size:13px;min-height:44px;white-space:nowrap">+ Hinzufügen</button>
    </div>
    ${wlRows ? `<div style="overflow-x:auto"><table class="data-table" style="width:100%">
      <thead><tr><th>Symbol</th><th>Börse</th><th>Währung</th><th style="text-align:right">Letzter Kurs</th><th></th></tr></thead>
      <tbody>${wlRows}</tbody>
    </table></div>` : zustandBlock('keine_daten', 'Es ist kein Symbol in der Beobachtungsliste. '
      + 'Symbole werden oben hinzugefügt.')}`;

    // Strategy cards
    const strats = strategies || {};
    const stratCards = [
      { key: 'momentum', label: 'Momentum', icon: '🚀' },
      { key: 'meanReversion', label: 'Mean Reversion', icon: '🔄' },
      { key: 'newsTrading', label: 'News Trading', icon: '📰' },
    ].map(s => {
      const cfg = strats[s.key] || { enabled: false };
      const badge = cfg.enabled ? '<span class="badge badge-green">Aktiv</span>' : '<span class="badge badge-muted">Inaktiv</span>';
      return `<div class="s-card"><div class="lbl">${s.icon} ${s.label}</div><div class="val" style="font-size:16px;margin-top:8px">${badge}</div></div>`;
    }).join('');

    const stratHtml = `<h3 style="margin:20px 0 10px">Strategien</h3><div class="summary-grid">${stratCards}</div>`;

    // Universe section
    let uniHtml = '';
    if (universe || universeConfig) {
      const uniSymbols = universe?.symbols || [];
      const byIndex = {};
      for (const s of uniSymbols) { byIndex[s.index] = (byIndex[s.index] || 0) + 1; }
      const indexStats = Object.entries(byIndex).map(([idx, cnt]) =>
        `<span class="badge badge-blue" style="margin:2px">${esc(idx)}: ${cnt}</span>`
      ).join(' ');

      // Index toggles
      const indices = universeConfig?.indices || {};
      const indexToggles = Object.entries(indices).map(([name, cfg]) => {
        const cls = cfg.enabled ? 'badge-green' : 'badge-muted';
        return `<button class="badge ${cls}" style="cursor:pointer;margin:2px;border:none;padding:4px 10px" onclick="toggleUniverseIndex('${esc(name)}',${!cfg.enabled})">${esc(name)}</button>`;
      }).join(' ');

      // Top candidates table
      const topItems = universeTop || [];
      let topHtml = '';
      if (topItems.length > 0) {
        const topRows = topItems.map(r => `<tr>
          <td><strong>${esc(r.symbol)}</strong></td>
          <td>${esc(r.signal)}</td>
          <td style="text-align:right">${Number(r.strength).toFixed(1)}</td>
          <td>${r.timestamp ? r.timestamp.slice(11, 19) : ''}</td>
        </tr>`).join('');
        topHtml = `<div style="overflow-x:auto;margin-top:12px"><table class="data-table" style="width:100%">
          <thead><tr><th>Symbol</th><th>Signal</th><th style="text-align:right">Stärke</th><th>Zeit</th></tr></thead>
          <tbody>${topRows}</tbody>
        </table></div>`;
      } else {
        topHtml = '<div style="color:var(--muted);font-size:13px;margin-top:8px">Keine aktuellen Kandidaten (letzte 2h)</div>';
      }

      /* P2-8: stand als rohes ISO-Datum in UTC da, waehrend alle anderen
         Zeitangaben im Dashboard Europe/Berlin sind. */
      const lastBuild = universe?.lastBuild ? fmtDT(universe.lastBuild) : '—';

      uniHtml = `<h3 style="margin:20px 0 10px">Universum</h3>
      <div class="summary-grid">
        <div class="s-card"><div class="lbl">Symbole</div><div class="val" style="font-size:22px">${uniSymbols.length}</div></div>
        <div class="s-card"><div class="lbl">Indizes</div><div class="val" style="font-size:14px;margin-top:6px">${indexStats || '—'}</div></div>
        <div class="s-card"><div class="lbl">Letzter Build</div><div class="val" style="font-size:13px;margin-top:6px">${lastBuild}</div></div>
        <div class="s-card"><div class="lbl">Suchlauf</div><div class="val" style="margin-top:6px"><button class="btn btn-primary" onclick="triggerUniverseScan()" style="padding:10px 14px;font-size:13px;min-height:44px" id="uni-scan-btn">Suchlauf starten</button></div></div>
      </div>
      <div style="margin:12px 0">
        <span style="font-size:13px;color:var(--muted);margin-right:8px">Indizes:</span>${indexToggles}
      </div>
      <h4 style="margin:16px 0 8px;font-size:13px;color:var(--muted)">Top-Kandidaten</h4>
      ${topHtml}`;
    }

    c.innerHTML = kpiHtml + posHtml + uniHtml + wlHtml + stratHtml;
    stamp();
    setDatenstand([{
      quelle: 'Trading-Agent (IBKR)',
      live: true,
      zustand: connCode === 'erreichbar' ? 'aktuell' : connCode === 'getrennt' ? 'getrennt' : 'unbekannt',
      stand: status.timestamp || new Date().toISOString(),
      abgleich: status.timestamp || null,
      hinweis: kontoArt + '. Aktualisierung alle 30 Sekunden.',
    }]);
  }

  await render();
  _tradingRefresh = setInterval(() => { if (currentTab === 'trading') render(); }, 30000);
}

async function tradingAddWatch() {
  const symbol = document.getElementById('wl-symbol').value.trim().toUpperCase();
  const exchange = document.getElementById('wl-exchange').value.trim() || 'SMART';
  const currency = document.getElementById('wl-currency').value.trim() || 'USD';
  if (!symbol) return;
  try {
    await apiFetch('/api/trading/watchlist', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ symbol, exchange, currency }) });
    loadTrading();
  } catch (e) { meldung('Watchlist-Eintrag konnte nicht angelegt werden: ' + netzFehlerText(e), 'error'); }
}

async function tradingRemoveWatch(symbol) {
  try {
    await apiFetch('/api/trading/watchlist/' + encodeURIComponent(symbol), { method: 'DELETE' });
    loadTrading();
  } catch (e) { meldung('Watchlist-Eintrag konnte nicht entfernt werden: ' + netzFehlerText(e), 'error'); }
}

async function toggleUniverseIndex(name, enabled) {
  try {
    await apiFetch('/api/trading/universe/config', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ indices: { [name]: { enabled } } }),
    });
    loadTrading();
  } catch (e) { meldung('Index konnte nicht umgeschaltet werden: ' + netzFehlerText(e), 'error'); }
}

async function triggerUniverseScan() {
  const btn = document.getElementById('uni-scan-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Scannt...'; }
  try {
    const result = await apiFetch('/api/trading/universe/scan', { method: 'POST' });
    if (result) meldung(`Suchlauf fertig: ${result.universe} Symbole, ${result.momentum} nach Momentum, ${result.meanReversion} nach Rückkehr zum Mittel.`, 'success');
    loadTrading();
  } catch (e) {
    meldung('Suchlauf fehlgeschlagen: ' + netzFehlerText(e), 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Suchlauf starten'; }
  }
}

/* ── Private Equity ── */
let _peCache = [];

/* ── Agents Tab ── */
/* ── Automatisierung (P2-10, Owner-Entscheidung Nr. 5) ──────────────────────
   Vorher war das eine statische Karte mit einem einzigen Link auf n8n: keine
   Daten, kein Datenstand, kein Abruf.

   Jetzt eine LESENDE Übersicht über `GET /api/agents/workflows`. Der
   n8n-Schlüssel bleibt serverseitig; die Route liefert nur aufbereitete
   Felder. Es wird nichts aktiviert und nichts ausgeführt — der bestehende
   n8n-Link bleibt der Weg dorthin.

   Wo keine Daten vorliegen, steht das ausdrücklich da. n8n hat derzeit KEINE
   Laufhistorie; „keine Ausführungen aufgezeichnet" ist deshalb die richtige
   Aussage — nicht „alles in Ordnung". */
async function loadAgents() {
  const c = document.getElementById('content');
  let d = null;
  let fehler = null;
  try { d = await apiFetch('/api/agents/workflows'); } catch (e) { fehler = netzFehlerText(e); }

  if (fehler) {
    c.innerHTML = zustandBlock('fehler',
      'Die Agentenübersicht ist nicht abrufbar: ' + fehler + '. '
      + 'Der n8n-Dienst läuft auf diesem Server; ist er gestoppt, fehlt diese Anzeige.');
    stamp();
    setDatenstand([{ quelle: 'n8n (Automatisierung)', zustand: 'getrennt', stand: null,
      abgleich: null, hinweis: 'Abruf fehlgeschlagen: ' + fehler }]);
    return;
  }

  const wf = d.workflows;
  const laeufe = d.ausfuehrungen;

  /* ── Workflows ── */
  let wfHtml;
  if (!wf) {
    wfHtml = zustandBlock('fehler',
      'Die Workflow-Liste ist nicht abrufbar: ' + (d.workflows_fehler || 'unbekannter Grund')
      + '. Das heißt NICHT, dass keine Workflows vorhanden sind.');
  } else if (!wf.length) {
    wfHtml = zustandBlock('keine_daten', 'In n8n ist kein Workflow angelegt.');
  } else {
    const aktiv = wf.filter(w => w.aktiv).length;
    const zeilen = wf.map(w => {
      /* Ein inaktiver Workflow ist NICHT grün: er läuft nicht. */
      const zustand = w.aktiv
        ? '<span class="badge badge-green">Aktiv</span>'
        : '<span class="badge badge-muted">Inaktiv — läuft nicht</span>';
      const archiv = w.archiviert ? ' <span class="badge badge-muted">Archiviert</span>' : '';
      const letzte = laeufe
        ? laeufe.filter(a => String(a.workflow_id) === String(w.id))
            .sort((a, b) => String(b.gestartet || '').localeCompare(String(a.gestartet || '')))[0]
        : null;
      const laufText = !laeufe
        ? 'Laufhistorie nicht abrufbar'
        : letzte
          ? (letzte.status === 'success' ? 'Erfolgreich ' : 'Ergebnis „' + esc(letzte.status || 'unbekannt') + '" ')
            + fmtDT(letzte.gestartet)
          : 'Keine Ausführung aufgezeichnet';
      const plan = w.zeitplan
        ? (w.aktiv ? 'Nächster Lauf: ' + esc(w.zeitplan) : 'Zeitplan hinterlegt (' + esc(w.zeitplan) + '), wird nicht ausgeführt')
        : 'Kein Zeitplan hinterlegt';
      return `<tr>
        <td><div class="agent-name">${esc(w.name)}</div><div class="agent-sub">${esc(w.knoten != null ? w.knoten + ' Schritte' : '')}</div></td>
        <td>${zustand}${archiv}</td>
        <td>${esc(fmtDate(w.geaendert))}</td>
        <td>${esc(laufText)}</td>
        <td>${plan}</td>
      </tr>`;
    }).join('');
    wfHtml = `<div class="treffer-zeile">${esc(wf.length + (wf.length === 1 ? ' Workflow' : ' Workflows')
        + ' · ' + aktiv + ' aktiv, ' + (wf.length - aktiv) + ' inaktiv')}</div>
      <table class="data-table" data-tabelle="karten">
        <thead><tr><th>Workflow</th><th>Zustand</th><th>Geändert</th><th>Letzter Lauf</th><th>Zeitplan</th></tr></thead>
        <tbody>${zeilen}</tbody>
      </table>`;
  }

  c.innerHTML = `

      ${wfHtml}

async function loadPrivateEquity() {
  const c = document.getElementById('content');
  try {
    const investments = await apiFetch('/api/pe');
    _peCache = investments;

    if (!investments.length) {
      c.innerHTML = `<div class="empty">Keine Private-Equity-Beteiligungen vorhanden.<br>
        <button class="btn btn-primary" style="margin-top:12px" onclick="peNewModal()">+ Neue Beteiligung</button></div>`;
      return;
    }

    const totalInvested = investments.reduce((s, i) => s + (i.investedAmount || 0), 0);
    const totalValuation = investments.reduce((s, i) => s + (i.currentValuation || 0), 0);
    const active = investments.filter(i => i.status === 'active').length;
    const totalIRR = totalInvested > 0 ? ((totalValuation / totalInvested - 1) * 100) : 0;

    const summaryHtml = `<div class="summary-grid">
      <div class="s-card"><div class="lbl">Total investiert</div><div class="val" style="font-size:20px">${fmtEur(totalInvested)}</div></div>
      <div class="s-card"><div class="lbl">Aktuelle Bewertung</div><div class="val" style="font-size:20px">${fmtEur(totalValuation)}</div></div>
      <div class="s-card"><div class="lbl">Gesamt-IRR</div><div class="val" style="font-size:20px;color:${totalIRR >= 0 ? 'var(--green)' : 'var(--red)'}">${totalIRR.toFixed(1)}%</div></div>
      <div class="s-card"><div class="lbl">Beteiligungen</div><div class="val">${investments.length}</div><div class="sub">${active} aktiv</div></div>
    </div>`;

    const cards = investments.map(inv => {
      const irr = peCalcIRR(inv);
      const statusBadge = inv.status === 'active' ? '<span class="badge badge-green">Aktiv</span>'
        : inv.status === 'exited' ? '<span class="badge badge-blue">Exited</span>'
        : '<span class="badge badge-red">Written-off</span>';
      return `<div class="card card-pad" style="cursor:pointer" onclick="peShowDetail('${esc(inv.id)}')">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
          <div>
            <div style="font-weight:700;font-size:15px">${esc(inv.company)}</div>
            <div style="font-size:13px;color:var(--muted)">${esc(inv.sector)}</div>
          </div>

        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;margin-top:12px">
          <div><span class="fl">Anteil</span> ${inv.ownershipPct}%</div>
          <div><span class="fl">Investiert</span> ${fmtEur(inv.investedAmount)}</div>
          <div><span class="fl">Bewertung</span> ${fmtEur(inv.currentValuation)}</div>
          <div><span class="fl">IRR</span> <span style="color:${irr >= 0 ? 'var(--green)' : 'var(--red)'}">${irr.toFixed(1)}%</span></div>
        </div>
        <div style="font-size:13px;color:var(--muted);margin-top:8px">ID: ${esc(inv.id)} | Bewertung: ${inv.valuationDate || '–'}</div>
      </div>`;
    }).join('');

    c.innerHTML = summaryHtml +
      `<div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 12px">
        <h3 style="margin:0;font-size:16px">Beteiligungen</h3>
        <button class="btn btn-primary" onclick="peNewModal()">+ Neue Beteiligung</button>
      </div>
      <div class="grid">${cards}</div>`;
    stamp();
  } catch (e) {
    c.innerHTML = `<div class="empty">Fehler beim Laden: ${esc(netzFehlerText(e))}</div>`;
  }
}

function peCalcIRR(inv) {
  if (!inv.investmentDate || !inv.valuationDate || !inv.investedAmount || inv.investedAmount <= 0) return 0;
  const start = new Date(inv.investmentDate), end = new Date(inv.valuationDate);
  const years = (end - start) / (365.25 * 86400000);
  if (years <= 0) return 0;
  const ratio = inv.currentValuation / inv.investedAmount;
  if (ratio <= 0) return -100;
  return (Math.pow(ratio, 1 / years) - 1) * 100;
}

let _statusRefresh = null;

function fmtUptime(sec) {
  if (!sec || sec <= 0) return '–';
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  if (d > 0) return d + 'd ' + h + 'h';
  const m = Math.floor((sec % 3600) / 60);
  return h > 0 ? h + 'h ' + m + 'm' : m + 'm';
}

   BEFUND CHECKPOINT 2: Im Nutzerfluss standen Paketnummern ("P2-7"),

    + '<div class="diag-text">' + esc(text) + '</div></div>';

    x.name + ': ' + (x.source === 'live' ? 'Live-Prüfung' : 'gespeicherter Zustand')

  return '<details class="diag">'
    + '<summary>Diagnose — technische Angaben zur Fehlersuche</summary>'

    + zeile('Automatischer Abgleich',

    + zeile('Änderungen seit dem letzten Besuch',
        'Nicht umgesetzt. Es gibt weder eine Tabelle noch einen anderen Mechanismus, der '
        + 'Besuche oder Unterschiede festhält; jede Umsetzung wäre eine neue Speicherung '
        + 'und bedarf einer Entscheidung.')
    + zeile('§556-Fristen',
        'Die Tabelle nk_period_obligations ist leer, und der Core legt dort nichts '
        + 'selbsttätig an (nur SELECT und UPDATE). Ein fehlender Eintrag ist deshalb kein '
        + 'Nachweis, dass keine Abrechnungspflicht besteht.')
    + zeile('Zeitzone', 'Alle Datums- und Uhrzeitangaben in Europe/Berlin.')
    + '</div></details>';
}

async function loadStatus() {
  if (_statusRefresh) { clearInterval(_statusRefresh); _statusRefresh = null; }
  const c = document.getElementById('content');
  try {
    const d = await apiFetch('/api/dashboard/status');

    // Services — Zustandsvokabular statt roher Statuswoerter (Spec §4 B).
    // Jede Zeile nennt zusaetzlich Herkunft (Live-Pruefung oder gespeicherter
    // Zustand) und Pruefzeitpunkt. Ein unbekannter Zustand erscheint nie als
    // Erfolg.
    /* ── A7 (Phase 3): gespeicherter Zustand ist kein Erfolg ──────────────────
       BEFUND: "Heute" meldete „Live-Abruf, 6 Dienste laufen", die Statusseite
       zeigte Core, Dashboard, Trading und n8n aber mit gespeicherten Zuständen
       aus Mai bzw. Juli 2026; nur Postgres und IB Gateway werden live geprüft.
       Ein gespeicherter Zustand erschien grün als „erreichbar".
       JETZT: live geprüft → erreichbar/getrennt. Gespeichert → „unbekannt",
       mit dem eingetragenen Wert und dem Prüfzeitpunkt im Klartext. Die
       Zusammenfassung über der Tabelle nennt die Verteilung. */
    const svcOrder = ['Core','Dashboard','Trading','n8n','Postgres','IB Gateway'];
    const svcMap = {};
    (d.services || []).forEach(s => { svcMap[s.name] = s; });
    const svcListe = svcOrder.map(n => svcMap[n]).filter(Boolean);
    const svcLive = svcListe.filter(s => s.source === 'live');
    const svcGespeichert = svcListe.filter(s => s.source !== 'live');
    const svcPruefzeiten = svcGespeichert.map(s => s.checked_at).filter(Boolean).sort();
    const svcAeltesterPruefzeitpunkt = svcPruefzeiten[0] || null;
    const svcZusammenfassung = [
      svcLive.length + (svcLive.length === 1 ? ' Dienst live geprüft' : ' Dienste live geprüft'),
      svcGespeichert.length
        ? svcGespeichert.length
          + (svcGespeichert.length === 1 ? ' gespeicherter Zustand' : ' gespeicherte Zustände')
          + (svcAeltesterPruefzeitpunkt ? ' (ältester vom ' + fmtDate(svcAeltesterPruefzeitpunkt) + ')' : '')
        : null,
    ].filter(Boolean).join(', ') + '.'
      + (svcGespeichert.length
          ? ' Ein gespeicherter Zustand ist nicht nachgeprüft.'
          : '');

    const svcStatusWort = { up: 'läuft', down: 'nicht erreichbar' };
    const svcHtml = svcOrder.map(name => {
      const s = svcMap[name];
      if (!s) {
        return `<tr>
          <td style="padding:6px 12px;white-space:nowrap">${esc(name)}</td>
          <td style="padding:6px 12px">${zustandsBadge('unbekannt')}</td>
          <td style="padding:6px 12px;color:var(--muted);font-size:13px">kein Statuseintrag vorhanden</td>
        </tr>`;
      }
      const live = s.source === 'live';
      /* Ohne Live-Prüfung ist der Zustand unbekannt — nicht „erreichbar". */
      const code = live
        ? (s.status === 'up' ? 'erreichbar' : s.status === 'down' ? 'getrennt' : 'unbekannt')
        : 'unbekannt';
      const herkunft = live
        ? 'live geprüft ' + (s.checked_at ? fmtDT(s.checked_at) : 'ohne Zeitangabe')
          + (s.status === 'up' && s.uptime_seconds > 0 ? ' · Laufzeit ' + fmtUptime(s.uptime_seconds) : '')
        : 'gespeicherter Zustand „' + (svcStatusWort[s.status] || String(s.status || 'unbekannt')) + '“'
          + (s.checked_at ? ', eingetragen ' + fmtDT(s.checked_at) + ' (' + altersText(s.checked_at) + ')' : '')
          + ' — seither nicht nachgeprüft';
      return `<tr>
        <td style="padding:6px 12px;white-space:nowrap">${esc(name)}</td>
        <td style="padding:6px 12px">${zustandsBadge(code)}</td>
        <td style="padding:6px 12px;color:var(--muted);font-size:13px">${esc(herkunft)}</td>
      </tr>`;
    }).join('');

    // Backup
    const backupTime = d.backup?.last ? fmtDT(d.backup.last) : '–';
    const backupIsToday = d.backup?.last && new Date(d.backup.last).toDateString() === new Date().toDateString();
    const backupDot = d.backup?.last ? (backupIsToday ? '🟢' : '🟡') : '🔴';

    // Tokens
    const tokenListe = d.tokens || [];
    const tokenHtml = tokenListe.length
      ? tokenListe.map(t => {
          const dot = t.days_remaining > 14 ? '🟢' : t.days_remaining > 7 ? '🟡' : '🔴';
          return `${dot} ${esc(t.name)} ${t.days_remaining} Tage`;
        }).join(', ')
      : zustandsBadge('unbekannt', 'kein Token-Eintrag gefunden');

    // Workflows: die Tabelle `workflows` ist derzeit leer. "0" ist deshalb keine
    // Aussage ueber n8n — das wird hier ausdruecklich gesagt statt gruen gemeldet.
    const wfCount = d.workflows?.pending || 0;
    const wfTypes = (d.workflows?.types || []).join(', ');

    c.innerHTML = `
      <div class="card card-pad" style="margin-bottom:16px">
        <div style="font-weight:600;margin-bottom:4px;font-size:14px">Dienste</div>
        <div class="status-herkunft">${esc(svcZusammenfassung)}</div>
        <div class="status-abrufzeit">${esc('Abrufzeit der Statusquelle: ' + (d.timestamp ? fmtDT(d.timestamp) : 'unbekannt')
          + ' \u00b7 Prüfzeitpunkt steht je Dienst in der letzten Spalte.')}</div>
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead><tr><th style="padding:6px 12px">Dienst</th><th style="padding:6px 12px">Zustand</th><th style="padding:6px 12px">Herkunft und Prüfzeitpunkt</th></tr></thead>
          <tbody>${svcHtml}</tbody>
        </table>
      </div>
      <div class="summary-grid">
        <div class="s-card">
          <div class="lbl">Letzter Backup</div>
          <div class="val" style="font-size:16px">${backupDot} ${backupTime}</div>
          <div class="sub">${backupIsToday ? 'heute' : d.backup?.last ? 'nicht heute' : 'kein Backup'}</div>
        </div>
        <div class="s-card">
          <div class="lbl">Token-Laufzeit</div>
          <div class="val" style="font-size:16px">${tokenHtml}</div>
          <div class="sub">Zugang zu Instagram über Meta</div>
        </div>
        <div class="s-card">
          <div class="lbl">Offene Vorgänge</div>
          <div class="val" style="font-size:16px">${wfCount}</div>
          <div class="sub">${wfTypes || 'keine offenen Vorgänge erfasst — das sagt nichts über den Zustand der Automatisierung'}</div>
        </div>
      </div>
      ${d._stale
        ? '<div class="ds-leerzustand" style="margin-top:12px"><span class="ds-leer-symbol" aria-hidden="true">⚠️</span><div>'
          + '<div class="ds-leer-titel">Statusquelle nicht erreichbar</div>'
          + '<div class="ds-leer-sub">Angezeigt wird ein zwischengespeicherter Stand von vor '
          + esc(String(d._cache_alter_s ?? '?')) + ' Sekunden. Die Zustände sind nicht bestätigt.</div></div></div>'
        : ''}
      ${diagnoseAbschnitt(d)}
    `;
    stamp();
    /* A7 (Phase 3): Die Leiste meldete "Live-Abruf" fuer die ganze Seite,
       obwohl vier von sechs Diensten gespeicherte Zustaende sind. Jetzt
       dieselbe Aussage wie in der Tagesuebersicht, und Abrufzeit und
       Pruefzeitpunkt sind getrennt beschriftet. */
    setDatenstand([{
      quelle: 'Systemstatus (Core)',
      live: false,
      zustand: d._stale ? 'degradiert' : (svcGespeichert.length ? 'degradiert' : 'aktuell'),
      stand: d.timestamp || new Date().toISOString(),
      abgleich: svcAeltesterPruefzeitpunkt,
      standLabel: 'Abrufzeit',
      abgleichLabel: 'ältester Prüfzeitpunkt',
      hinweis: (d._stale
        ? 'Core nicht erreichbar — Anzeige aus dem Zwischenspeicher. '
        : 'Zwischenspeicher ' + (d._cache_alter_s ?? 0) + ' s alt (Höchstalter 30 s). ')
        + svcZusammenfassung,
    }]);

    _statusRefresh = setInterval(() => {
      if (currentTab === 'status') loadStatus();
    }, 60_000);
  } catch (e) {
    c.innerHTML = '<div class="empty">Fehler: ' + esc(netzFehlerText(e)) + '</div>';
  }
}

</script>
</body>
</html>
