<!DOCTYPE html>
<html lang="de">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Executive Dashboard</title>
<link rel="apple-touch-icon" href="/dashboard/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hans Dampf">
<meta name="csrf-token" content="">
<link rel="stylesheet" href="/dashboard/css/assets.css">
<link rel="stylesheet" href="/dashboard/css/entity-tile.css">
<link rel="stylesheet" href="/dashboard/css/wiki.css">

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Farb- und Typografiebasis — Paket P2-1 (Spec §2)

   Helles Schema als Standard: heller Seitenhintergrund, weisse
   Inhaltsflaechen, dunkle Schrift, dezente Trennlinien, EIN Akzent.
   Kein Dark Mode, kein Umschalter — bewusst nicht Teil der Anforderung.

   ALLE Farben des Dashboards kommen aus diesem Block. Ausserhalb stehen
   keine Hex- oder rgba()-Rohwerte mehr; neue Farbwuensche bekommen hier eine
   Rolle, statt als Einzelwert verstreut zu werden.

   Jedes Paar aus Text- und Flaechenrolle ist gegen WCGA 2.1 AA geprueft
   (35 Paare, 0 Unterschreitungen; Nachweis im Report zu P2-1):
   Fliesstext >= 4.5:1, Rahmen und Diagrammlinien >= 3:1.

   Zum "Gelb": ein echtes Gelb erreicht auf Weiss physikalisch keine 4.5:1.
   Die Statusrolle --yellow ist deshalb ein dunkles Amber fuer Schrift und
   Symbole; --yellow-weak ist die helle Toenung fuer Flaechen dahinter.
   Warnungen tragen ohnehin Symbol UND Text (Spec §2).
   ═══════════════════════════════════════════════════════════════════════════ */
:root {
  /* Flaechen */
  --bg:            #f5f6f8;  /* Seitenhintergrund */
  --surface:       #ffffff;  /* Karten, Tabellen, Dialoge */
  --surface-2:     #f0f2f5;  /* Flaeche INNERHALB einer Karte */
  --row-hover:     #f3f5f8;  /* Tabellenzeile unter dem Zeiger */

  /* Linien */
  --border:        #e2e5ea;  /* Trennlinien, Kartenrahmen */
  --border-soft:   #eef0f3;  /* noch dezenter, z. B. Listentrenner */
  --border-strong: #7d8594;  /* Rahmen von Formularfeldern (>= 3:1) */

  /* Schrift */
  --text:          #1a1d23;  /* Fliesstext            16.9:1 auf Weiss */
  --text-soft:     #4a5159;  /* zweite Ebene           8.0:1 */
  --muted:         #5a6270;  /* Nebeninformation       6.2:1 */

  /* Akzent — derselbe Blauton wie vorher, auf Hell-Kontrast gebracht */
  --accent:        #1668c7;  /* 5.5:1 auf Weiss */
  --accent-weak:   #e8f1fc;  /* Toenung hinter Akzenttext */
  --on-accent:     #ffffff;  /* Schrift auf Akzentflaeche, 5.5:1 */
  --accent-dark:   #12569f;  /* gedrueckte Primaerschaltflaeche, 7.2:1 */

  /* Status — Schriftfarbe dunkel, Flaeche als helle Toenung */
  --green:         #147235;  --green-weak:  #e6f4ea;
  --yellow:        #8a6100;  --yellow-weak: #fdf3e0;
  --red:           #b42318;  --red-weak:    #fdeceb;
  --orange:        #b54708;  --orange-weak: #fdeee2;

  /* Diagramme */
  --violet:        #6d28d9;  /* HRV-Linie, 7.1:1 */

  /* Ueberlagerung und Schatten — zurueckhaltend (Spec §2) */
  --overlay:       rgba(16, 20, 28, .45);
  --shadow:        0 1px 2px rgba(16, 20, 28, .06), 0 1px 3px rgba(16, 20, 28, .05);
  --shadow-lift:   0 4px 12px rgba(16, 20, 28, .10);

  --r:       8px;
  --font:    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
/* Teilt dem Browser das helle Schema mit, damit auch von ihm gezeichnete
   Teile (Bildlaufleisten, Datums- und Zeitwaehler, Auswahlpfeile) hell
   erscheinen. Ohne diese Angabe bleiben sie bei dunkel eingestelltem System
   dunkel — ein sichtbarer Rest, den die eigene Palette nicht erreicht. */
:root { color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.45; }

/* ── Sichtbarer Tastaturfokus ──────────────────────────────────────────────
   Acht Stellen setzten `outline: none`, ohne Ersatz — der Fokus war beim
   Durchtabben unsichtbar (Spec §6 "Sichtbarer Tastaturfokus"). Ein globaler
   :focus-visible-Ring in der Akzentfarbe (5.5:1 auf Weiss) ersetzt das.
   :focus-visible statt :focus, damit ein Mausklick keinen Ring hinterlaesst. */
:where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ── Login ── */
#login { display: none; align-items: center; justify-content: center; min-height: 100vh; }
.login-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 40px 36px; width: 340px; box-shadow: var(--shadow); }
.login-box h2 { font-size: 20px; margin-bottom: 6px; }
.login-box p  { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
.login-box input { width: 100%; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px; padding: 10px 12px; color: var(--text); font-size: 14px; margin-bottom: 12px; }
.login-box input:focus { border-color: var(--accent); }
.login-err { color: var(--red); font-size: 13px; margin-top: 8px; min-height: 18px; }

/* ── App shell ─────────────────────────────────────────────────────────────
   P2-2: mobile-first. Die Grundregeln gelten fuer schmale Geraete, die beiden
   Haltepunkte weiter unten (ab 640 px und ab 1024 px) bauen darauf auf.

   html/body bekommen overflow-x: hidden nur als LETZTE Sicherung. Die
   Ursache — die nicht umbrechende Navigationszeile — ist behoben, nicht
   verdeckt: die Leiste scrollt jetzt innerhalb ihres eigenen Containers. */
html, body { overflow-x: hidden; max-width: 100%; }
#app { display: none; min-height: 100vh; }

/* Kopfzeile stapelt schmal: Titel ueber Abrufzeitpunkt und Abmelden. */
/* C2 (Phase 3): Schmal eine Zeile. Gemessen 360/390 px: Kopf 55 px,
   Navigation 45 px, zusammen 100 px (vorher rund 190 px). */
header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 5px 10px; display: flex; flex-direction: row; align-items: center;
  justify-content: space-between; gap: 10px;
  position: sticky; top: 0; z-index: 10;
}
header h1 {
  font-size: 15px; font-weight: 600; color: var(--accent); letter-spacing: .3px;
  /* Einzeilig: lieber abgeschnitten als zweizeilig. */
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.kopf-lang { display: none; }
.kopf-kurz { display: inline; }
.kopf-name { display: none; color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
.header-meta { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; flex-wrap: nowrap; }
.header-meta span { color: var(--muted); font-size: 12px; white-space: nowrap; }
.btn-logout {
  background: var(--surface); border: 1px solid var(--border-strong); color: var(--text-soft);
  border-radius: 6px; cursor: pointer; font-size: 13px; font-family: var(--font);
  /* Beruehrungsziel nach Spec §6, auch als Symbol. */
  min-width: 44px; min-height: 44px; padding: 0 10px;
  display: inline-flex; align-items: center; justify-content: center;
}
.abm-lang { display: none; }
.abm-kurz { display: inline; font-size: 17px; line-height: 1; }
.kopf-zeit-lang { display: none; }
.kopf-zeit-kurz { display: inline; }
.btn-logout:hover { border-color: var(--red); color: var(--red); background: var(--red-weak); }

/* ── Hauptnavigation ───────────────────────────────────────────────────────
   Waagerecht scrollbar INNERHALB des eigenen Containers. Dadurch bleibt das
   Dokument schmal; vorher zog die Zeile es auf rund 1.260 px auf.
   scroll-snap rastet die Schaltflaechen ein, damit kein Eintrag halb
   angeschnitten stehen bleibt. */
nav {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 4px; display: flex; gap: 2px;
  overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x proximity;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;            /* Leiste selbst nicht anzeigen … */
}
nav::-webkit-scrollbar { display: none; }   /* … auch in WebKit nicht */

nav button {
  background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--text-soft); cursor: pointer; font-size: 13px; font-family: var(--font);
  transition: color .12s; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
  /* Touchziel: mindestens 44 px hoch und breit (Spec §6). */
  min-height: 44px; min-width: 44px; padding: 0 12px;
  scroll-snap-align: start; flex: 0 0 auto;
}
nav button:hover { color: var(--text); background: var(--row-hover); }
nav button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
/* Schmal die Kurzform, ab 640 px die lange Beschriftung. Der Text entfaellt nie. */
.nav-lang { display: none; }
.nav-kurz { display: inline; }

main { padding: 12px; max-width: 1200px; }

/* ── Utilities ── */
/* Neutrale Schaltflaeche ausdruecklich setzen. Ohne eigene Flaeche zeichnet
   der Browser seine Standardfarbe — die haengt am Systemthema und war damit
   nicht unter Kontrolle der Palette. */
.btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; font-size: 13px; font-family: var(--font); transition: background .12s, border-color .12s; }
.btn:hover { background: var(--row-hover); }
.btn-primary { background: var(--accent); color: var(--on-accent); }
/* Auf hellem Grund wirkt eine abgesenkte Deckkraft ausgewaschen statt
   gedrueckt — deshalb ein echter dunklerer Hintergrund per Mischung. */
.btn-primary:hover { background: var(--accent-dark); }
.btn-ghost { background: var(--surface); color: var(--text-soft); border: 1px solid var(--border-strong); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: var(--font); }
.btn-ghost:hover { background: var(--row-hover); color: var(--text); }
.btn-danger { background: var(--red-weak); color: var(--red); border: 1px solid var(--red); }
.btn-danger:hover { background: var(--red); color: var(--on-accent); }

/* 11 px bleibt: ein Abzeichen ist Beschriftung, kein Fliesstext (Spec §6). */
.badge { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size:13px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
.badge-green  { background: var(--green-weak); color: var(--green); }
.badge-yellow { background: var(--yellow-weak); color: var(--yellow); }
.badge-red    { background: var(--red-weak); color: var(--red); }
.badge-blue   { background: var(--accent-weak);  color: var(--accent); }
.badge-muted  { background: var(--surface-2); color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 16px; box-shadow: var(--shadow); }
.card-pad { padding: 20px; }

table { width: 100%; border-collapse: collapse; }
/* Spaltenkopf: 12 px und dunkler als zuvor; reine Beschriftung, kein Fliesstext. */
th { text-align: left; padding: 10px 14px; background: var(--surface-2); color: var(--text-soft); font-size:13px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--row-hover); }

.spinner { color: var(--muted); padding: 60px; text-align: center; font-size: 15px; }
.empty   { color: var(--muted); padding: 60px; text-align: center; font-size: 14px; }

/* ── Summary cards ── */
.summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
.s-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow); }
/* 12 px statt 11 px: die Kachelbeschriftung traegt die Bedeutung der Zahl. */
.s-card .lbl { color: var(--text-soft); font-size:13px; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px; }
.s-card .val { font-size: 26px; font-weight: 700; line-height: 1; }
.s-card .sub { color: var(--muted); font-size: 13px; margin-top: 5px; }

/* ── Trip cards ── */
.trip-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; margin-bottom: 12px; }
.trip-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.trip-top h3 { font-size: 16px; font-weight: 600; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.trip-dates { color: var(--muted); font-size: 13px; }
.trip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
.trip-grid .mi { font-size: 13px; }
.trip-grid .ml { color: var(--muted); }
.segments { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
.seg-header { font-size:13px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 8px; }
.seg-row { font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--border-soft); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.seg-row:last-child { border-bottom: none; }

/* ── Traveled (past trips collapsible) ── */
.traveled-section { margin-top: 24px; }
.traveled-section summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; padding: 10px 0; border-top: 1px solid var(--border); list-style: none; display: flex; align-items: center; gap: 8px; }
.traveled-section summary::before { content: '▶'; font-size:13px; transition: transform .2s; }
.traveled-section[open] summary::before { transform: rotate(90deg); }
.traveled-section summary::-webkit-details-marker { display: none; }

/* ── Instagram Live Feed Grid ── */
.insta-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
.insta-grid-item { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; cursor: pointer; background: var(--surface-2); border: 1px solid var(--border); }
.insta-grid-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .15s; }
.insta-grid-item:hover img { opacity: .75; }
.insta-grid-item .ig-type { position: absolute; top: 6px; right: 6px; font-size: 14px; text-shadow: 0 1px 3px var(--overlay); }
.insta-grid-item .ig-likes { position: absolute; bottom: 0; left: 0; right: 0; padding: 4px 8px; font-size:13px; font-weight: 600; color: var(--on-accent); background: linear-gradient(transparent, var(--overlay)); }

/* ── Calendar ── */
.day-group { margin-bottom: 22px; }
.day-lbl { font-weight: 600; color: var(--accent); font-size: 14px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
/* P2-2: mobile-first einspaltig; die dreispaltige Zeile ab 640 px. */
.ev-row { display: grid; grid-template-columns: 1fr; gap: 6px; align-items: start; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; }
.ev-row.ev-ganztags { border-left: 3px solid var(--accent); }
.ev-time { color: var(--muted); font-size:13px; padding-top: 1px; }
.ev-zeit-haupt { color: var(--text); font-weight: 600; white-space: nowrap; }
.ev-zeit-sub { color: var(--muted); font-size:13px; margin-top: 2px; }
.ev-body { min-width: 0; }
.ev-title { font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
.ev-sub { color: var(--muted); font-size:13px; margin-top: 3px; overflow-wrap: anywhere; }
/* Lange Beschreibungen liefen ueber die Karte hinaus (Spec §4 F).
   P2-4: schmal zwei Zeilen, breit vier; der Rest ist ueber „mehr…"
   erreichbar, statt hart bei 160 Zeichen abgeschnitten zu werden. */
.ev-beschreibung-block { margin-top: 3px; }
.ev-beschreibung { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ev-beschreibung.ev-beschreibung-offen { -webkit-line-clamp: unset; overflow: visible; }
.ev-mehr {
  background: none; border: none; padding: 4px 0; margin-top: 2px;
  color: var(--accent); font-size: 13px; font-family: var(--font);
  cursor: pointer; text-decoration: underline;
}
@media (min-width: 640px) {
  .ev-beschreibung { -webkit-line-clamp: 4; }
}
.ev-warnung { color: var(--yellow); font-size:13px; margin-top: 4px; }
.ev-aktionen { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.ev-teilnehmen { padding: 4px 10px; font-size:13px; text-decoration: none; white-space: nowrap; }
.cal-tz-hinweis { color: var(--muted); font-size:13px; }
.cal-ist-zustand { color: var(--text-soft); font-size: 13px; margin-bottom: 14px; padding: 8px 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; }
/* Schmal stapelt die Terminkarte; die Aktionen stehen dann links. */
.ev-aktionen { justify-content: flex-start; }
.ev-zeit-haupt { white-space: normal; }

/* ── Draft body ── */
.draft-body-row td { padding: 0 14px 12px; }
.draft-body { background: var(--surface-2); border-radius: 6px; padding: 14px; font-family: monospace; font-size:13px; white-space: pre-wrap; color: var(--muted); border: 1px solid var(--border); }

/* ── Documents ── */
.doc-toolbar { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
.doc-toolbar select { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px; padding: 7px 10px; color: var(--text); font-size: 13px; font-family: var(--font); }
.doc-toolbar select:focus { border-color: var(--accent); }
.drop-zone { border: 2px dashed var(--border); border-radius: var(--r); padding: 32px; text-align: center; color: var(--muted); font-size: 14px; cursor: pointer; transition: border-color .15s, background .15s; margin-bottom: 8px; }
.drop-zone.drag-over { border-color: var(--accent); background: var(--accent-weak); }
.doc-trip-link { color: var(--accent); cursor: pointer; text-decoration: none; }
.doc-trip-link:hover { text-decoration: underline; }

/* ── Modal ── */
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes slideUp { from{transform:translateY(24px);opacity:0} to{transform:translateY(0);opacity:1} }
/* ── Dialoge (P2-4) ────────────────────────────────────────────────────────
   Die Hoehe richtet sich nach `dvh` statt `vh`: auf dem Telefon zaehlt `vh`
   die Adresszeile mit und rechnet die Bildschirmtastatur nicht heraus — der
   Dialog ragte dann unter die Tastatur und die Aktionszeile war nicht mehr
   erreichbar. `vh` bleibt als Rueckfallwert fuer aeltere Browser stehen. */
.modal-overlay { position:fixed; inset:0; background:var(--overlay); z-index:100; display:flex; align-items:center; justify-content:center; padding:12px; animation:fadeIn .15s ease; }
.modal {
  position: relative;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  width:560px; max-width:100%;
  max-height:90vh;
  max-height:90dvh;
  display:flex; flex-direction:column;
  animation:slideUp .2s ease;
}
/* Nur der Inhalt scrollt — die Aktionszeile bleibt dadurch sichtbar. */
.modal-inhalt { overflow-y:auto; overscroll-behavior:contain; padding:18px; }
.modal h3 { font-size:17px; margin-bottom:18px; padding-right:32px; }
.modal label { display:block; color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.4px; margin-bottom:5px; margin-top:14px; }
.modal input, .modal textarea, .modal select { width:100%; background:var(--surface); border:1px solid var(--border-strong); border-radius:6px; padding:10px 12px; color:var(--text); font-size:14px; font-family:var(--font); min-height:44px; }
.modal input:focus, .modal textarea:focus, .modal select:focus { border-color:var(--accent); }
.modal textarea { min-height:120px; resize:vertical; }
/* Die Aktionszeile klebt am unteren Rand des scrollenden Inhalts. */
.modal-actions {
  display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap;
  margin-top:22px; padding-top:16px; border-top:1px solid var(--border);
  position:sticky; bottom:-18px; background:var(--surface);
  padding-bottom:18px; margin-bottom:-18px;
}
/* Sichtbare Schliessen-Schaltflaeche in jedem Dialog, zentral eingesetzt. */
.modal-schliessen {
  position:absolute; top:6px; right:6px; z-index:1;
  width:44px; height:44px; min-height:44px; min-width:44px;
  display:flex; align-items:center; justify-content:center;
  background:var(--surface); border:1px solid transparent; border-radius:8px;
  color:var(--muted); font-size:16px; cursor:pointer; font-family:var(--font);
}
.modal-schliessen:hover { border-color:var(--border-strong); color:var(--text); background:var(--row-hover); }
/* Der Hintergrund darf nicht mitscrollen, solange ein Dialog offen ist. */
body.dialog-offen { overflow:hidden; }
/* Im Dialog gilt das Touchziel auf JEDER Breite: hier wird getippt und
   getroffen, auch auf dem Tablet. P2-2 nimmt die Mindesthoehe ab 640 px
   allgemein zurueck — fuer Dialoge bleibt sie. */
.modal button, .modal .btn, .modal .btn-ghost, .modal a.btn { min-height:44px; }
.modal .modal-actions button { padding-left:16px; padding-right:16px; }

/* ── Formularraster (P2-4) ────────────────────────────────────────────────
   Feldpaare stehen schmal untereinander und erst ab 768 px nebeneinander —
   zwei Datums- oder Zeitfelder nebeneinander lassen bei 360 px je rund
   140 px, was fuer die vom Browser gezeichneten Waehler zu wenig ist. */
/* Erklaerende Zeile unter einem Eingabefeld (P2-8). */
.formular-hinweis { color:var(--muted); font-size:13px; margin-top:5px; line-height:1.45; }
.formular-paar { display:grid; grid-template-columns:1fr; gap:12px; }
@media (min-width: 768px) {
  .formular-paar { grid-template-columns:1fr 1fr; }
}

/* Eine Zeile aus Kontrollkaestchen und Beschriftung — nicht untereinander.
   `.modal label { display:block }` und `.modal input { width:100% }` haben das
   Kaestchen vorher auf volle Breite gezogen und die Beschriftung darunter
   geschoben. Die Beschriftung ist ueber `for`/`id` klickbar. */
.kontrollzeile {
  display:flex !important; align-items:center; gap:10px;
  margin-top:14px; margin-bottom:0;
  text-transform:none; letter-spacing:0; font-size:14px; color:var(--text);
  min-height:44px; cursor:pointer;
}
.kontrollzeile .kontrollzeile-text,
.modal .kontrollzeile label {
  display:inline; margin:0; text-transform:none; letter-spacing:0;
  font-size:14px; color:var(--text); cursor:pointer;
}
.kontrollzeile input[type=checkbox] {
  width:20px !important; min-width:20px; height:20px; min-height:20px;
  margin:0; flex:0 0 auto; accent-color:var(--accent); cursor:pointer;
}

/* ── Meldungen im Formular (P2-4) ─────────────────────────────────────────
   Pruefhinweise und Fehler stehen sichtbar am Feld bzw. im Dialog, nicht in
   einem Systemfenster (alert), das den Bezug zum Feld verliert. */
.feld-fehler { color:var(--red); font-size:13px; margin-top:4px; }
.feld-fehler:empty { display:none; }
input.feld-ungueltig, select.feld-ungueltig, textarea.feld-ungueltig { border-color:var(--red); }
.dialog-meldung {
  display:flex; align-items:flex-start; gap:8px;
  margin-bottom:14px; padding:10px 12px; border-radius:6px;
  font-size:13px; line-height:1.45;
  background:var(--red-weak); border:1px solid var(--red); color:var(--text);
}
.dialog-meldung:empty { display:none; }
.dialog-meldung.meldung-erfolg { background:var(--green-weak); border-color:var(--green); }
.dialog-meldung.meldung-hinweis { background:var(--accent-weak); border-color:var(--accent); }
.btn-ghost { background:none; border:1px solid var(--border); color:var(--muted); padding:7px 16px; border-radius:6px; cursor:pointer; font-size:13px; font-family:var(--font); }
.btn-ghost:hover { border-color:var(--text); color:var(--text); }
.seg-item { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--border-soft); font-size:13px; }
.seg-item:last-child { border-bottom:none; }
.seg-item .seg-rm { background:none; border:none; color:var(--red); cursor:pointer; font-size:15px; padding:2px 4px; }

/* ── Fleet cards ── */
.fleet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.fleet-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; }
.fleet-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.fleet-card-header .fleet-icon { font-size: 28px; }
.fleet-card-header h3 { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; }
.fleet-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 13px; }
.fleet-meta .fl { color: var(--muted); }
.fleet-actions { display: flex; gap: 6px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
.tuev-green  { color: var(--green); }
.tuev-yellow { color: var(--yellow); }
.tuev-red    { color: var(--red); }
.tuev-none   { color: var(--muted); }

/* ── Assets ── */
.asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.asset-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; }
.asset-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.asset-card-header .asset-icon { font-size: 28px; }
.asset-card-header h3 { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; }
.asset-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 13px; }
.asset-meta .al { color: var(--muted); }
.asset-actions { display: flex; gap: 6px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
.unit-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
.unit-row:last-child { border-bottom: none; }
.unit-row:hover { background: var(--row-hover); }
.unit-status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
.unit-status.permanent { background: var(--green); }
.unit-status.temporary { background: var(--yellow); }
.unit-status.vacant    { background: var(--muted); }
.nk-result { background: var(--surface-2); border-radius: 6px; padding: 14px; margin-bottom: 10px; border: 1px solid var(--border); }
.nk-positive { color: var(--green); font-weight: 600; }
.nk-negative { color: var(--red); font-weight: 600; }

/* ── Entity images ── */
.entity-img-wrap { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: var(--r) var(--r) 0 0; overflow: hidden; cursor: pointer; }
.entity-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-placeholder { width: 100%; height: 100%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 32px; transition: background .15s; }
.entity-img-wrap:hover .img-placeholder { background: var(--accent-weak); }
.entity-img-wrap:hover::after { content: '📷'; position: absolute; bottom: 8px; right: 10px; font-size: 18px; background: var(--overlay); border-radius: 6px; padding: 4px 8px; }
.entity-img-wrap input[type=file] { display: none; }
.detail-img-wrap { position: relative; width: 100%; max-width: 400px; aspect-ratio: 16/9; border-radius: var(--r); overflow: hidden; cursor: pointer; margin-bottom: 16px; }
.detail-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.detail-img-wrap .img-placeholder { border-radius: var(--r); }
.detail-img-wrap:hover .img-placeholder { background: var(--accent-weak); }
.detail-img-wrap:hover::after { content: '📷'; position: absolute; bottom: 8px; right: 10px; font-size: 18px; background: var(--overlay); border-radius: 6px; padding: 4px 8px; }
.detail-img-wrap input[type=file] { display: none; }
/* ═══════════════════════════════════════════════════════════════════════════
   Haltepunkte — Paket P2-2

   Drei Stufen, mobile-first:
     unter 640 px   schmale Geraete  (Grundregeln oben)
     ab 640 px      breite Geraete und Tablets hochkant
     ab 1024 px     Desktop — hier gilt wieder das gewohnte Bild

   Geprueft wird bei 360, 390, 768 und 1440 px (Spec §6).
   ═══════════════════════════════════════════════════════════════════════════ */

@media (min-width: 640px) {
  header { flex-direction: row; align-items: center; justify-content: space-between; padding: 12px 16px; gap: 16px; }
  header h1 { font-size: 16px; }
  .kopf-lang { display: inline; }
  .kopf-kurz { display: none; }
  .kopf-name { display: inline; }
  .header-meta { justify-content: flex-end; flex-wrap: nowrap; gap: 12px; }
  .header-meta span { font-size: 13px; }
  .abm-lang { display: inline; }
  .abm-kurz { display: none; }
  .kopf-zeit-lang { display: inline; }
  .kopf-zeit-kurz { display: none; }
  nav { padding: 0 8px; }
  /* Ab hier ist Platz fuer die ausgeschriebene Beschriftung. */
  .nav-lang { display: inline; }
  .nav-kurz { display: none; }
  main { padding: 16px; }
  .ds-leiste { padding: 10px 16px 0; }
  /* Der Innenabstand sitzt am scrollenden Inhalt; die klebende Aktionszeile
     muss ihn mit denselben Werten ausgleichen. */
  .modal-inhalt { padding: 28px; }
  .modal-actions { bottom: -28px; padding-bottom: 28px; margin-bottom: -28px; }
  /* Terminzeile: Zeit | Inhalt | Aktionen */
  .ev-row { grid-template-columns: 130px 1fr auto; gap: 14px; }
  .ev-aktionen { justify-content: flex-end; }
  .ev-zeit-haupt { white-space: nowrap; }
}

@media (min-width: 1024px) {
  header { padding: 14px 24px; }
  nav { padding: 0 20px; }
  main { padding: 24px; }
  .ds-leiste { padding: 10px 24px 0; }
}

/* ── Unterbereichs-Leisten verhalten sich wie die Hauptnavigation ──────────
   Assets-Unterbereiche, Fuhrpark- und Vertragsfilter, Instagram-Unterbereiche:
   waagerecht scrollbar statt das Dokument zu verbreitern. */
.assets-subtabs, .filters-row, .insta-subtabs {
  overflow-x: auto;
  scrollbar-width: none;
  scroll-snap-type: x proximity;
}
.assets-subtabs::-webkit-scrollbar,
.filters-row::-webkit-scrollbar,
.insta-subtabs::-webkit-scrollbar { display: none; }
.assets-subtabs > *, .insta-subtabs > * { flex: 0 0 auto; scroll-snap-align: start; }
.assets-subtabs { flex-wrap: nowrap; }
.insta-subtabs { display: flex; }
/* Die Filterzeile darf umbrechen, wenn Platz ist — nur nicht ueberlaufen. */
.filters-row { flex-wrap: wrap; }

/* ── Touchziele ───────────────────────────────────────────────────────────
   Spec §6 verlangt 44 x 44 px fuer Bedienelemente. Die Regel gilt als
   mobile Grundeinstellung fuer ALLE Schaltflaechen — auch fuer die ohne
   eigene Klasse (Wiki, Instagram, SharePoint) — und wird ab 640 px wieder
   zurueckgenommen, damit das in P2-1 abgenommene Bild auf breiten Geraeten
   unveraendert bleibt.

   Bewusst ohne unsichtbare ::after-Trefferflaechen: bei nebeneinander
   stehenden Schaltflaechen wuerden sich die Flaechen ueberlappen und der
   Fingerdruck landete auf dem Nachbarn. Statt dessen wachsen die
   Schaltflaechen schmal wirklich auf 44 px. */
button, summary, a.btn, a.btn-ghost, .subtab-btn, .drawer-close, select, input[type=file] {
  min-height: 44px;
}
button, .btn, .btn-ghost, .btn-logout, .subtab-btn, .drawer-close {
  min-width: 44px;
}
/* Die Hauptnavigation behaelt ihre 44 px auf jeder Breite. */
nav button { min-height: 44px; min-width: 44px; }

@media (min-width: 640px) {
  button, summary, a.btn, a.btn-ghost, .subtab-btn, .drawer-close, select, input[type=file] {
    min-height: 0;
  }
  button, .btn, .btn-ghost, .btn-logout, .subtab-btn, .drawer-close { min-width: 0; }
  nav button { min-height: 44px; min-width: 44px; }
}

/* ── Banking: Kontozeile, Summe und Umsaetze (P2-9) ───────────────────────── */
.bank-konto-knopf {
  background: none; border: none; padding: 6px 0; margin: 0;
  text-align: left; font-family: var(--font); color: var(--text);
  cursor: pointer; display: flex; flex-direction: column; gap: 2px;
  min-height: 44px; justify-content: center; min-width: 0;
}
.bank-konto-knopf:hover .bank-konto-name { text-decoration: underline; }
.bank-konto-name { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.bank-konto-sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.bank-konto-saldo { font-size: 14px; font-weight: 600; white-space: nowrap; }
.bank-saldo-plus  { color: var(--green); }
.bank-saldo-minus { color: var(--red); }
.bank-saldo-leer  { color: var(--muted); font-weight: 400; font-style: italic; }

.bank-summe { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 12px; }
.bank-summe-zeile { font-size: 15px; font-weight: 700; }
.bank-summe-hinweis { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.5; }

.bank-archiv { margin-top: 14px; border-top: 1px solid var(--border); }
.bank-archiv summary {
  min-height: 44px; display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--muted); cursor: pointer; list-style: none;
}
.bank-archiv summary::-webkit-details-marker { display: none; }
.bank-archiv summary::before { content: '\25B6'; font-size: 11px; transition: transform .2s; }
.bank-archiv[open] summary::before { transform: rotate(90deg); }
.bank-konto-archiv { opacity: .75; }

/* ── A2 (Phase 3): Verbindungsstand und Saldostand ─────────────────────────
   Zwei Zeitpunkte, die der Owner verwechselt hat, weil nur einer sichtbar war. */
.bank-stand { font-size: 13px; line-height: 1.55; }
.bank-stand-institut + .bank-stand-institut { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.bank-stand-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.bank-stand-zeile { color: var(--text); overflow-wrap: anywhere; }
.bank-stand-warn { color: var(--red); font-weight: 600; }
.bank-stand-hinweis { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); color: var(--muted); }

/* A7 (Phase 3): Herkunft der Dienstezustände über der Tabelle. */
.status-herkunft { font-size: 13px; color: var(--text); margin-bottom: 4px; line-height: 1.5; }
/* C3 (Phase 3): Diagnose-Abschnitt — eingeklappt, technische Angaben gebündelt. */
.diag { margin-top: 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
.diag summary {
  list-style: none; cursor: pointer; font-size: 13px; color: var(--muted);
  min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 14px;
}
.diag summary::-webkit-details-marker { display: none; }
.diag summary::before { content: '▶'; font-size: 11px; transition: transform .2s; }
.diag[open] summary::before { transform: rotate(90deg); }
.diag-inhalt { padding: 0 14px 14px; }
.diag-zeile { padding: 8px 0; border-top: 1px solid var(--border); }
.diag-titel { font-size: 13px; font-weight: 600; }
.diag-text { font-size: 13px; color: var(--muted); line-height: 1.55; overflow-wrap: anywhere; }
.status-abrufzeit { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }

.bank-umsaetze { margin-top: 16px; }
.bank-umsaetze:focus { outline: none; }
/* A3 (Phase 3): Detailansicht eines Kontos — als eigener Bereich erkennbar. */
.bank-detail-kopf {
  border: 1px solid var(--border); border-left: 3px solid var(--accent);
  border-radius: 8px; padding: 12px; margin-bottom: 12px; background: var(--surface);
}
.bank-detail-aktionen { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.bank-detail-archiv {
  align-self: flex-start; min-height: 44px; padding: 0 12px;
  background: none; border: 1px solid var(--border); border-radius: 6px;
  color: var(--muted); font-size: 13px; cursor: pointer;
}
.bank-detail-archiv:hover { border-color: var(--red); color: var(--red); background: var(--red-weak); }
.bank-detail-aktion-sub { font-size: 13px; color: var(--muted); line-height: 1.5; }
.bank-konto-pfeil { color: var(--muted); font-size: 18px; padding: 0 2px; }
.bank-umsatz-kopf {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin-bottom: 10px;
}
.bank-umsatz-titel { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.bank-umsatz-kopf .btn { min-height: 44px; }
.bank-umsatz-hinweis { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
.bank-umsatz-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.bank-umsatz-mehr { margin-top: 12px; }
.bank-umsatz-mehr .btn { min-height: 44px; }

/* ── Bankkonten (P2-3) ────────────────────────────────────────────────────
   Schmal stapeln IBAN und Saldo/Aktion untereinander — nebeneinander blieben
   bei 360 px fuer die IBAN kaum 150 px. Ab 640 px wieder eine Zeile. */
.bank-konto-zeile {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.bank-konto-iban { display: flex; align-items: center; gap: 10px; overflow-wrap: anywhere; }
.bank-konto-wert { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
@media (min-width: 640px) {
  .bank-konto-zeile { flex-direction: row; justify-content: space-between; align-items: center; padding: 6px 0; }
  .bank-konto-wert { justify-content: flex-end; }
}

/* ── Kennzahl-Beschriftungen (P2-3) ───────────────────────────────────────
   Schmal die Kurzform, ab 640 px die ausgeschriebene Beschriftung. Der Text
   entfaellt nie, er wird nur kuerzer — wie in der Hauptnavigation. */
.lbl-lang { display: none; }
.lbl-kurz { display: inline; }
@media (min-width: 640px) {
  .lbl-lang { display: inline; }
  .lbl-kurz { display: none; }
}
/* Der Kachelinhalt darf nie abgeschnitten werden. */
.s-card { min-width: 0; overflow-wrap: anywhere; }
.s-card .lbl { overflow-wrap: anywhere; }

/* ── Diagramme (P2-3) ──────────────────────────────────────────────────────
   Der Rahmen gibt die Zeichenbreite vor; das SVG fuellt ihn vollstaendig aus.
   Vorher stand `min-width: 600px` am SVG in einem Scrollbereich — schmal war
   der juengste Wert am rechten Rand damit nicht zu sehen. */
.diagramm-rahmen { position: relative; width: 100%; }
.diagramm-rahmen svg { display: block; width: 100%; height: 220px; }
@media (max-width: 639.98px) {
  /* Schmal flacher, damit Kennzahlen und Diagramm zusammen auf den Schirm
     passen (Vorgabe: hoechstens 220 px). */
  .diagramm-rahmen svg { height: 200px; }
}

/* ── Tabellen: Scrollbereich und Kartenform (P2-3) ─────────────────────────
   Schmal gibt es nur zwei zulaessige Darstellungen: Kartenform oder ein
   erkennbarer eigener Scrollbereich. Welche Tabelle welche bekommt,
   entscheidet public/js/responsiv.js nach der Spaltenzahl.

   .card hatte bisher overflow: hidden — eine breite Tabelle wurde damit
   ABGESCHNITTEN statt scrollbar. */
.card { max-width: 100%; }
.card:has(> table), .card:has(> .assets-table) { overflow-x: auto; overflow-y: visible; }
.card > table, .card > .assets-table { min-width: max-content; }
img, svg, video, canvas { max-width: 100%; }
pre, code { overflow-wrap: anywhere; }
/* Lange Woerter und Adressen sprengen sonst die Karte. */
.ev-title, .ev-sub, .wiki-snippet, .sp-pfad, .entity-tile__title { overflow-wrap: anywhere; }

/* Der Scrollbereich zeigt an BEIDEN Raendern einen Schatten, solange dort
   noch Inhalt folgt — der klassische Scroll-Schatten aus zwei Verlaufspaaren:
   die weissen Flaechen haengen am Inhalt (background-attachment: local), die
   Schatten am Rahmen (scroll). Dadurch verschwindet der Schatten genau dann,
   wenn das Ende erreicht ist. Ohne zusaetzliches Element und ohne Skript. */
.tabelle-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  background-image:
    linear-gradient(to right,  var(--surface), transparent),
    linear-gradient(to left,   var(--surface), transparent),
    linear-gradient(to right,  var(--overlay), transparent),
    linear-gradient(to left,   var(--overlay), transparent);
  background-position: left center, right center, left center, right center;
  background-repeat: no-repeat;
  background-size: 26px 100%, 26px 100%, 10px 100%, 10px 100%;
  background-attachment: local, local, scroll, scroll;
}
/* Textueller Hinweis, solange der Bereich wirklich scrollt. Reine Darstellung
   ueber ::before am Elternelement der Tabelle — kein eigener Knoten, der mit
   Alpine kollidieren koennte. */
/* Die Klasse `scrollt` setzt responsiv.js nur, wenn der Inhalt tatsaechlich
   breiter ist als der sichtbare Bereich — ein Hinweis auf eine Tabelle, die
   ohnehin passt, waere irrefuehrend. */
.tabelle-scroll.scrollt::before {
  content: '⇢ seitlich scrollbar';
  display: block;
  position: sticky;
  left: 0;
  color: var(--muted);
  font-size: 13px;
  padding: 2px 0 6px;
}
@media (min-width: 1024px) {
  /* Breit genuegt der Schatten; der Satz waere dort nur Rauschen. */
  .tabelle-scroll.scrollt::before { display: none; }
}

/* ── Kartenform fuer schmale Geraete ──────────────────────────────────────
   Bewusst als max-width-Abfrage: die Kartenform kehrt die Anzeigeart der
   Tabellenelemente um (table → block). Eine Rueckname ab 640 px muesste jede
   einzelne Eigenschaft exakt zuruecksetzen und wuerde die Spaltenstile aus
   assets.css ueberschreiben. So bleibt das in P2-1/P2-2 abgenommene Bild auf
   breiten Geraeten nachweislich unberuehrt. */
@media (max-width: 639.98px) {
  .tabelle-karten,
  .tabelle-karten tbody,
  .tabelle-karten tr,
  .tabelle-karten td { display: block; width: auto; }

  /* Die Spaltenkoepfe wandern als Beschriftung in die Zellen. */
  .tabelle-karten thead { display: none; }

  .tabelle-karten { border-collapse: separate; border-spacing: 0; }

  /* Die Zeile wird zur Karte und traegt ein zweispaltiges Raster: die
     benennende erste Spalte als Ueberschrift ueber die volle Breite, die
     uebrigen Felder paarweise daneben. Beschriftung ueber dem Wert statt
     davor — sonst bleibt fuer laengere Werte kaum Platz, und die Karte wird
     unnoetig hoch (SharePoint-Dateiliste: 238 px je Eintrag im ersten
     Entwurf, so rund 140 px). */
  .tabelle-karten tbody tr {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .tabelle-karten tbody tr:last-child { margin-bottom: 0; }
  /* Zeilenhervorhebung gilt in der Kartenform der ganzen Karte. */
  .tabelle-karten tbody tr:hover { background: var(--row-hover); }
  .tabelle-karten tbody tr:hover td { background: transparent; }

  .tabelle-karten td {
    display: block;
    min-width: 0;
    padding: 0;
    border-bottom: none;
    white-space: normal;
    overflow-wrap: anywhere;
  }
  .tabelle-karten td::before {
    content: attr(data-label);
    display: block;
    color: var(--muted);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .4px;
    overflow-wrap: anywhere;
  }
  /* Zellen ohne Spaltenkopf (Aktionsspalten, verbundene Zellen) nehmen die
     volle Breite der Karte ein. */
  .tabelle-karten td[data-ohne-label] { grid-column: 1 / -1; }
  .tabelle-karten td[data-ohne-label]::before { content: none; }

  /* Die erste Spalte ist in allen betroffenen Tabellen die benennende
     (Objekt/Einheit, Dateiname, Dienst, Symbol). Sie wird zur Ueberschrift
     der Karte: volle Breite und hervorgehoben. Ihre Beschriftung bleibt
     stehen — die Vorgabe lautet, dass JEDER Spaltenkopf zur Beschriftung
     wird und keine Spalte entfaellt. */
  .tabelle-karten tbody td:first-child {

  /* In der Kartenform gibt es keine Spalten mehr, also auch keine Gruende
     fuer feste Breiten oder nicht umbrechende Zellen. */
  .tabelle-karten td[style*="width"],
  .tabelle-karten td[style*="white-space"] { width: auto !important; white-space: normal !important; }

  /* Eine Karte ist bereits die Zeile — die Umrandung der Karte darum herum
     wuerde doppelt wirken. */
  .card:has(> .tabelle-karten) { border: none; background: none; box-shadow: none; padding: 0; }
  /* P2-2 gibt Tabellen in Karten `min-width: max-content`, damit breite
     Tabellen scrollen statt abgeschnitten zu werden. In der Kartenform gibt
     es keine Spalten mehr — die Regel wuerde den Block auf die Breite des
     laengsten Textes aufziehen. */
  .card > .tabelle-karten,
  .tabelle-karten { min-width: 0; }
}

<script>
'use strict';

/* ── State ── */
let TOKEN = '';
let currentTab = 'heute';
let _tripsCache = [];
let _draftsCache = [];
let _docsCache = [];

/* ── Init ── */
/* Wrapped in DOMContentLoaded so that defer scripts (banking-connect.js,
   alpine.csp.min.js, etc.) are guaranteed to have executed before the
   initial showTab() call.  Without this, deep links like
   ?tab=banking-connect crash because bankingOverviewHtml() is not yet
   defined when the inline script runs during HTML parsing. */
(function init() {
  const p = new URLSearchParams(location.search);
  const urlToken = p.get('token');
  const urlTab = p.get('tab');
  if (urlToken) {
    TOKEN = urlToken;
    localStorage.setItem('token', urlToken);
    /* Den Token aus der Adresse entfernen, aber NUR ihn. Bisher wurde die
       Adresse auf "?tab=<bereich>" neu geschrieben — damit verlor ein Aufruf
       wie ?token=…&tab=wiki&page=amazon den Seitenparameter, und das Wiki
       zeigte die Uebersicht statt der verlinkten Seite (P2-2). */
    const rest = new URLSearchParams(location.search);
    rest.delete('token');
    const abfrage = rest.toString();
    history.replaceState(history.state, '', location.pathname + (abfrage ? '?' + abfrage : ''));
  }
  TOKEN = localStorage.getItem('token') || '';

  function boot() {
    if (TOKEN) {
      showApp();
      /* P2-2: Der erste Bereich ERSETZT den Verlaufseintrag, statt einen
         zweiten anzulegen — sonst braeuchte Zurueck zwei Schritte, um die
         Seite zu verlassen. Ein Neuladen landet dank ?tab= wieder hier.
         Deeplink-Parameter bleiben dabei erhalten. */
      /* P2-5: Startansicht ist die Tagesuebersicht. Die 13 Fachbereiche
         bleiben ueber die Navigation und ueber ?tab=… unveraendert
         erreichbar — sie werden nicht ersetzt (Spec §5, §7). */
      const start = istBekannterTab(urlTab) ? urlTab : 'heute';
      setzeTabAdresse(start, true);
      showTab(start, { verlauf: false });
    } else {
      document.getElementById('login').style.display = 'flex';
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

document.getElementById('tokenInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') submitToken();
});

async function submitToken() {
  const v = document.getElementById('tokenInput').value.trim();
  if (!v) return;
  TOKEN = v;
  try {
    await apiFetch('/api/trips');
    localStorage.setItem('token', TOKEN);
    document.getElementById('login').style.display = 'none';
    showApp();
    setzeTabAdresse('heute', true);
    showTab('heute', { verlauf: false });
  } catch {
    document.getElementById('loginErr').textContent = 'Token ungültig oder Server nicht erreichbar.';
    TOKEN = '';
  }
}

function logout() {
  localStorage.removeItem('token');
  TOKEN = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('tokenInput').value = '';
  document.getElementById('loginErr').textContent = '';
  document.getElementById('login').style.display = 'flex';
}

function showApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

/* ── Tab routing ── */
/* ── Verlauf (P2-2) ─────────────────────────────────────────────────────────
   Vorher kannte die Anwendung keinen Verlauf: Browser-Zurueck verliess das
   Dashboard, weil jeder Bereichswechsel nur den Inhalt austauschte. Jetzt
   schreibt showTab() einen Verlaufseintrag (?tab=…), ein popstate-Handler
   stellt den Bereich wieder her, und ein Neuladen bleibt im Bereich.
   Kein Router, keine Bibliothek — history.pushState genuegt.

   Die bestehenden replaceState-Aufrufe in Fuhrpark und Wiki bleiben
   vertraeglich: sie ERSETZEN den aktuellen Eintrag und ergaenzen nur eigene
   Parameter (fleet_code, page). Damit der Bereich dabei nicht verlorengeht,
   schreibt showTab() ?tab= in die Adresse, bevor die Bereichsfunktion laeuft. */

/* Reihenfolge der Schaltflaechen in der Navigationsleiste. */
const DASHBOARD_TABS = ['heute','health','trips','calendar','fleet','assets','trading','banking','pe','instagram','sharepoint','wiki','agents','status'];

/* Ohne eigene Schaltflaeche, aber gueltige Ziele: 'drafts' und 'documents'
   werden aus dem Code heraus angesprungen, 'banking-connect' ist ein
   Deeplink, den banking-connect.js aus der Adresse liest. */
const WEITERE_ZIELE = ['drafts', 'documents', 'banking-connect'];

function istBekannterTab(tab) {
  return DASHBOARD_TABS.includes(tab) || WEITERE_ZIELE.includes(tab);
}

/* Adresse auf den Bereich setzen.
   `ersetzen = true`  — kein neuer Verlaufseintrag (erster Aufbau, Anmeldung).
                        Vorhandene Deeplink-Parameter bleiben stehen, damit
                        ?tab=assets&assets_subtab=… oder ?fleet_code=… beim
                        Seitenaufruf noch von den Bereichen gelesen werden.
   `ersetzen = false` — der Nutzer hat gewechselt. Dann werden die Parameter
                        des verlassenen Bereichs entfernt, sonst wandert ein
                        Deeplink in den naechsten Bereich mit. */
/* A4 (Phase 3): `assets_prop` und `assets_year` neu. Ohne sie uebergab ein
   Sprung aus „Heute“ nur den Unterbereich; Objekt und Jahr blieben auf den
   Vorgabewerten des Nebenkosten-Speichers stehen (d4/2024) — deshalb oeffnete
   „Nebenkosten 2025 – I83“ die Ansicht D4/2024. */
const BEREICHSPARAMETER = ['fleet_code','fleet_subtab','assets_subtab','assets_entity_id','assets_action','assets_prop','assets_year','page'];

function setzeTabAdresse(tab, ersetzen) {
  const url = new URL(window.location.href);
  url.searchParams.set('tab', tab);
  url.searchParams.delete('token');
  if (!ersetzen) {
    for (const p of BEREICHSPARAMETER) url.searchParams.delete(p);
  }
  const ziel = url.pathname + (url.search || '');
  if (ersetzen) history.replaceState({ tab }, '', ziel);
  else history.pushState({ tab }, '', ziel);
}

/* Browser-Zurueck und -Vorwaerts. { verlauf: false } verhindert, dass der
   Sprung selbst wieder einen Verlaufseintrag anlegt. */
window.addEventListener('popstate', (e) => {
  const ausZustand = e.state && e.state.tab;
  const ausAdresse = new URLSearchParams(location.search).get('tab');
  const tab = istBekannterTab(ausZustand) ? ausZustand
            : istBekannterTab(ausAdresse) ? ausAdresse
            : 'heute';
  if (tab === currentTab) return;
  showTab(tab, { verlauf: false });
});

function showTab(tab, opt) {
  // Handle banking-connect deep link as banking tab
  if (tab === 'banking-connect') tab = 'banking';
  if (!istBekannterTab(tab)) tab = 'heute';
  const verlauf = !opt || opt.verlauf !== false;
  currentTab = tab;
  if (verlauf) setzeTabAdresse(tab, false);
  /* Markierung ueber data-tab statt ueber die Reihenfolge der Schaltflaechen:
     eine umsortierte Leiste markierte sonst den falschen Bereich. */
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  /* Schmal scrollt die Leiste: den aktiven Bereich in den sichtbaren Teil
     holen, sonst steht er außerhalb (Spec §6 "aktiver Bereich erkennbar"). */
  zeigeAktivenTab(tab);
  document.getElementById('lastUpdate').textContent = '';
  leereDatenstand();
  /* Diagramme des verlassenen Bereichs abmelden (P2-3). */
  diagrammeLeeren();
  /* CP1-Nachbesserung: Schubfächer und Dialoge gehören zum verlassenen
     Bereich. Das Objekt-Schubfach der Assets blieb beim Bereichswechsel offen
     und lag dann über dem neuen Inhalt. */
  if (typeof closeDrawer === 'function') closeDrawer();
  closeModal();
  document.getElementById('content').innerHTML = '<div class="spinner">Laden…</div>';
  ({ heute: loadHeute, health: loadHealth, trips: loadTrips, drafts: loadDrafts, calendar: loadCalendar, documents: loadDocuments, sharepoint: loadSharePoint, fleet: loadFleet, assets: loadAssets, instagram: loadInstagram, trading: loadTrading, banking: loadBanking, pe: loadPrivateEquity, wiki: loadWiki, agents: loadAgents, status: loadStatus })[tab]();
}

/* Holt die aktive Schaltflaeche in den sichtbaren Teil der scrollenden
   Leiste. Auf dem Desktop passt ohnehin alles nebeneinander, dann bewirkt
   der Aufruf nichts. */
function zeigeAktivenTab(tab) {
  const nav = document.querySelector('nav');
  const btn = nav && nav.querySelector('button[data-tab="' + tab + '"]');
  if (!nav || !btn) return;
  if (nav.scrollWidth <= nav.clientWidth + 1) return;
  const links = btn.offsetLeft - (nav.clientWidth - btn.offsetWidth) / 2;
  nav.scrollTo({ left: Math.max(0, links), behavior: 'smooth' });
}

/* ── Fetch helper ──
   A1 (Phase 3): Der eigentliche Abruf laeuft ueber netzFetch() — das begrenzt
   gleichzeitige Anfragen und wiederholt einen reinen Netzfehler zweimal.
   Siehe js/netz.js fuer den Befund und die belegte Ursache. */
async function apiFetch(url, opts = {}) {
  const sep = url.includes('?') ? '&' : '?';
  const res = await netzFetch('/dashboard' + url + sep + 'token=' + encodeURIComponent(TOKEN), opts);
  if (res.status === 401) { logout(); throw new Error('401'); }
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

/* ── Helpers ── */
/* P2-3: Kennzahl-Beschriftung mit Kurzform fuer schmale Geraete. Lange
   Beschriftungen wie "Gewicht-Trend 30 T" brachen in der 177 px breiten
   Kachel hart um; die Kurzform vermeidet das, ohne auf dem Desktop etwas
   wegzulassen. Dasselbe Muster wie in der Hauptnavigation (P2-2). */
const kpiLabel = (lang, kurz) =>
  '<span class="lbl-lang">' + lang + '</span><span class="lbl-kurz">' + (kurz || lang) + '</span>';

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtDate = iso => iso ? new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(iso)) : '–';
const fmtDT   = iso => iso ? new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(iso)) : '–';
const fmtTime = iso => iso ? new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(iso)) : '–';


/* ── Image upload helpers ── */
function imgUrl(entityType, entityId) {
  return `/dashboard/api/images/${entityType}-${entityId}.jpg?token=${encodeURIComponent(TOKEN)}&_t=${Date.now()}`;
}

function entityImgHtml(entityType, entityId, cssClass) {
  const cls = cssClass || 'entity-img-wrap';
  const src = imgUrl(entityType, entityId);
  return `<div class="${cls}" onclick="triggerImgUpload(this,'${esc(entityType)}','${esc(entityId)}')">
    <img src="${src}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" style="display:block">
    <div class="img-placeholder" style="display:none">📷</div>
    <input type="file" accept="image/*" onchange="uploadImage(this,'${esc(entityType)}','${esc(entityId)}')">
  </div>`;
}

function triggerImgUpload(wrap, entityType, entityId) {
  wrap.querySelector('input[type=file]').click();
}

function resizeImageBlob(file, maxW, maxH, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.width, h = img.height;
      if (w > maxW || h > maxH) {
        const r = Math.min(maxW / w, maxH / h);
        w = Math.round(w * r);
        h = Math.round(h * r);
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(blob => blob ? resolve(blob) : reject(new Error('Canvas export failed')), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Bild konnte nicht geladen werden')); };
    img.src = url;
  });
}

async function uploadImage(input, entityType, entityId) {
  const file = input.files[0];
  if (!file) return;
  const wrap = input.closest('.entity-img-wrap, .detail-img-wrap, .entity-tile__image');
  const placeholder = wrap.querySelector('.img-placeholder');
  if (placeholder) { placeholder.textContent = '⏳'; placeholder.style.display = 'flex'; }
  const imgEl = wrap.querySelector('img');
  if (imgEl) imgEl.style.display = 'none';
  try {
    const blob = await resizeImageBlob(file, 800, 800, 0.82);
    const fd = new FormData();
    fd.append('image', blob, 'photo.jpg');
    fd.append('entityType', entityType);
    fd.append('entityId', entityId);
    const res = await fetch('/dashboard/api/upload/image?token=' + encodeURIComponent(TOKEN), { method: 'POST', body: fd });
    if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.error || 'Upload fehlgeschlagen'); }
    const data = await res.json();
    if (imgEl) {
      imgEl.src = '/dashboard' + data.imagePath + '?token=' + encodeURIComponent(TOKEN) + '&_t=' + Date.now();
      imgEl.style.display = 'block';
      if (placeholder) placeholder.style.display = 'none';
    }
  } catch (e) {
    meldung('Bild-Upload fehlgeschlagen: ' + netzFehlerText(e), 'error');
    if (placeholder) { placeholder.textContent = '📷'; }
  }
  input.value = '';
}

const DOC_CAT_LABELS = { vertraege: 'Verträge', rechnungen: 'Rechnungen', notizen: 'Notizen', sonstiges: 'Sonstiges' };
function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

/* Kopfzeile: Zeitpunkt des Seitenabrufs. Ausdruecklich NICHT das Alter der
   angezeigten Daten — das steht in der Datenstand-Leiste (datenstand.js). */
/* P2-8: Spec §4 M verlangt, dass die Zeitzone dort genannt wird, wo Uhrzeiten
   stehen. Sie steht jetzt EINMAL im Seitenkopf — und damit in jedem Bereich,
   auch in denen ohne Datenstand-Leiste. In der Leiste ist der Satz dafür
   entfallen; zweimal dasselbe auf einer Seite ist Rauschen (vgl. P2-3). */
function stamp() {
  /* C2 (Phase 3): Schmal nur die Uhrzeit des Seitenabrufs und die Zeitzone —
     das vollstaendige Datum und der Satz "alle Zeiten in …" brauchten am
     Telefon zwei Zeilen. Beide Formen stehen im Markup; die Stilvorlage
     entscheidet, welche sichtbar ist. Der Zeitzonenhinweis bleibt also auch
     schmal sichtbar (Spec §4 M), nur kuerzer. */
  const el = document.getElementById('lastUpdate');
  const lang = seitenabrufText() + ' · alle Zeiten in Europe/Berlin';

    + '<span class="kopf-zeit-kurz">' + esc(kurz) + '</span>';
  el.title = lang;
}

/* ── Modal helpers ── */
/* ── Meldungen (P2-4) ───────────────────────────────────────────────────────
   Bisher liefen Pruefhinweise und Fehler ueber `alert()`. Das Systemfenster
   nimmt den Bezug zum Feld, verdeckt den Dialog und laesst sich am Telefon
   schlecht lesen. Stattdessen drei Wege, je nach Ort:

     feldFehler(id, text)  — Hinweis direkt unter dem betroffenen Feld
     dialogMeldung(text)   — Meldung oben im offenen Dialog
     meldung(text, art)    — kurze Einblendung, wenn kein Dialog offen ist

   Die Einblendung nutzt denselben Behaelter und dieselben Klassen wie die
   Alpine-Bereiche (assets-stores.js), damit es nur eine Darstellung gibt. */

function meldungsBehaelter() {
  let el = document.getElementById('toast-container');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast-container';
    el.className = 'toast-container';
    document.body.appendChild(el);
  }
  return el;
}

function meldung(text, art) {
  const el = document.createElement('div');
  el.className = 'toast toast-' + (art || 'info');
  el.setAttribute('role', art === 'error' ? 'alert' : 'status');
  el.textContent = text;
  meldungsBehaelter().appendChild(el);
  setTimeout(() => {
    el.classList.add('toast-out');
    setTimeout(() => el.remove(), 300);
  }, art === 'error' ? 6000 : 3500);
}

/* Meldung oben im Dialog. Ohne offenen Dialog wird eingeblendet statt
   verschluckt. */
function dialogMeldung(text, art) {
  const inhalt = document.querySelector('.modal-overlay .modal-inhalt');
  if (!inhalt) { meldung(text, art || 'error'); return; }
  let box = inhalt.querySelector('.dialog-meldung');
  if (!box) {
    box = document.createElement('div');
    box.className = 'dialog-meldung';
    box.setAttribute('role', 'alert');
    const titel = inhalt.querySelector('h3');
    if (titel && titel.nextSibling) inhalt.insertBefore(box, titel.nextSibling);
    else inhalt.insertBefore(box, inhalt.firstChild);
  }
  box.className = 'dialog-meldung' + (art === 'erfolg' ? ' meldung-erfolg' : art === 'hinweis' ? ' meldung-hinweis' : '');
  box.textContent = text;
  box.scrollIntoView({ block: 'nearest' });
}

/* Hinweis unter einem Feld. `id` ist die Kennung des Eingabefeldes; der
   Hinweis bekommt die Kennung `<id>-fehler` und haengt per aria-describedby
   am Feld. Ohne Text wird der Hinweis wieder entfernt. */
function feldFehler(id, text) {
  const feld = document.getElementById(id);
  if (!feld) { if (text) dialogMeldung(text); return; }
  const fehlerId = id + '-fehler';
  let hinweis = document.getElementById(fehlerId);
  if (!text) {
    feld.classList.remove('feld-ungueltig');
    feld.removeAttribute('aria-invalid');
    hinweis?.remove();
    return;
  }
  if (!hinweis) {
    hinweis = document.createElement('div');
    hinweis.id = fehlerId;
    hinweis.className = 'feld-fehler';
    feld.insertAdjacentElement('afterend', hinweis);
  }
  hinweis.textContent = text;
  feld.classList.add('feld-ungueltig');
  feld.setAttribute('aria-invalid', 'true');
  feld.setAttribute('aria-describedby', fehlerId);
  feld.focus({ preventScroll: false });
}

/* Alle Hinweise eines Formulars loeschen, bevor erneut geprueft wird. */
function feldFehlerLeeren(ids) {
  for (const id of ids) feldFehler(id, '');
  const box = document.querySelector('.modal-overlay .dialog-meldung');
  if (box) box.remove();
}

/* ── Dialoge (P2-4) ─────────────────────────────────────────────────────────
   Die Dialoge bekommen hier zentral alles, was sie bedienbar macht — damit
   keine der 30 Aufrufstellen dafuer angefasst werden muss:

   - Rolle und Beschriftung fuer Hilfsmittel (role="dialog", aria-modal,
     aria-labelledby auf die Ueberschrift),
   - eine sichtbare Schliessen-Schaltflaeche in der Ecke,
   - Fokus beim Oeffnen in den Dialog, beim Schliessen zurueck auf das
     ausloesende Element,
   - Tabulator bleibt im Dialog,
   - der Hintergrund scrollt nicht mit,
   - Escape schliesst.

   Die Hoehe richtet sich nach `dvh` (sichtbarer Bereich), damit der Dialog
   bei offener Bildschirmtastatur nicht unter sie rutscht; die Aktionszeile
   klebt am unteren Rand und bleibt dadurch immer erreichbar. */

let _modalAusloeser = null;

function openModal(html) {
  closeModal();
  /* Merken, von wo der Dialog geoeffnet wurde — dorthin kehrt der Fokus
     zurueck. document.activeElement ist zu diesem Zeitpunkt noch die
     ausloesende Schaltflaeche. */
  _modalAusloeser = document.activeElement instanceof HTMLElement ? document.activeElement : null;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal" role="dialog" aria-modal="true" tabindex="-1">'
    + '<button type="button" class="modal-schliessen" aria-label="Dialog schließen" onclick="closeModal()">✕</button>'
    + '<div class="modal-inhalt">' + html + '</div>'
    + '</div>';
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);

  const dialog = overlay.querySelector('.modal');
  /* Die Ueberschrift des Dialogs benennt ihn fuer Hilfsmittel. */
  const titel = dialog.querySelector('h3');
  if (titel) {
    if (!titel.id) titel.id = 'modal-titel-' + Date.now();
    dialog.setAttribute('aria-labelledby', titel.id);
  }

  document.body.classList.add('dialog-offen');
  dialog.addEventListener('keydown', modalTabulator);
  /* Fokus bevorzugt auf das erste Eingabefeld — dort faengt die Arbeit an.
     Hat der Dialog keines (reine Bestaetigung), auf das erste Bedienelement,
     sonst auf den Dialog selbst. */
  const ziele = modalFokusziele(dialog);
  const erstesFeld = ziele.find(el => /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName));
  (erstesFeld || ziele[0] || dialog).focus({ preventScroll: true });
}

function closeModal() {
  const overlay = document.querySelector('.modal-overlay');
  if (!overlay) return;
  overlay.remove();
  document.body.classList.remove('dialog-offen');
  /* Fokus zurueck auf die ausloesende Schaltflaeche, sofern sie noch da ist —
     nach einem Neuaufbau der Liste kann sie verschwunden sein. */
  if (_modalAusloeser && document.body.contains(_modalAusloeser)) {
    _modalAusloeser.focus({ preventScroll: true });
  }
  _modalAusloeser = null;
}

/* Bedienbare Elemente im Dialog, in Tabulatorreihenfolge. */
function modalFokusziele(dialog) {
  const auswahl = 'a[href], button:not([disabled]), input:not([disabled]):not([type=hidden]), '
    + 'select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
  return Array.from(dialog.querySelectorAll(auswahl))
    .filter(el => el.offsetWidth > 0 || el.offsetHeight > 0 || el === document.activeElement);
}

/* Tabulator im Dialog halten: am Ende wieder an den Anfang und umgekehrt. */
function modalTabulator(e) {
  if (e.key !== 'Tab') return;
  const dialog = e.currentTarget;
  const ziele = modalFokusziele(dialog);
  if (!ziele.length) { e.preventDefault(); dialog.focus(); return; }
  const erstes = ziele[0], letztes = ziele[ziele.length - 1];
  if (e.shiftKey && (document.activeElement === erstes || document.activeElement === dialog)) {
    e.preventDefault(); letztes.focus();
  } else if (!e.shiftKey && document.activeElement === letztes) {
    e.preventDefault(); erstes.focus();
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ═══════════════════════════════════════════════════════════════════════════
   TRIPS

async function loadTrips() {
  const c = document.getElementById('content');
  try {
    const [trips, docs, allLinks] = await Promise.all([apiFetch('/api/trips'), apiFetch('/api/documents'), apiFetch('/api/links').catch(() => [])]);
    _tripsCache = trips;
    _docsCache = docs;
    if (!trips.length) { c.innerHTML = '<div class="empty">Keine Reisen vorhanden.<br><button class="btn btn-primary" style="margin-top:12px" onclick="newTrip()">+ Neue Reise</button></div>'; return; }
    const today = new Date().toISOString().slice(0,10);

    function renderTripCard(t) {
      const active   = t.start_date <= today && t.end_date >= today;
      const upcoming = !active && t.start_date > today;
      const badge = active
        ? '<span class="badge badge-green">Aktiv</span>'
        : upcoming
          ? '<span class="badge badge-blue">Geplant</span>'
          : '<span class="badge badge-muted">Vergangen</span>';

      const meta = [
        t.currency         && `<div class="mi"><span class="ml">💶 Währung </span>${esc(t.currency)}</div>`,
        t.exchange_rate_eur&& `<div class="mi"><span class="ml">💱 Kurs </span>${esc(t.exchange_rate_eur)}</div>`,
        t.visa_de          && `<div class="mi"><span class="ml">🛂 Visum </span>${esc(t.visa_de)}</div>`,
        t.distance_km      && `<div class="mi"><span class="ml">📏 Luftlinie </span>${t.distance_km} km</div>`,
        t.travel_mode      && `<div class="mi"><span class="ml">🚀 Verkehr </span>${esc(t.travel_mode)}</div>`,
        t.door_to_door_estimate && `<div class="mi"><span class="ml">⏱ Haustür↔Haustür </span>${esc(t.door_to_door_estimate)}</div>`,
        `<div class="mi"><span class="ml">🌡 Klima </span>${esc(t.climate||'–')}</div>`,
        `<div class="mi"><span class="ml">🎯 Aktivitäten </span>${esc((t.activities||[]).join(', '))||'–'}</div>`,
      ].filter(Boolean).join('');

      const segs = t.segments?.length ? `
        <div class="segments">
          <div class="seg-header">Segmente (${t.segments.length})</div>
          ${t.segments.map(s => `<div class="seg-row">
            <span class="badge badge-muted">${esc(s.type)}</span>
            <span>${esc(s.title)}</span>
            <span style="color:var(--muted);font-size:13px">${esc(s.datetime_local)} (${esc(s.timezone)})</span>
            ${s.confirmation ? `<span style="color:var(--green);font-size:13px">✔ ${esc(s.confirmation)}</span>` : ''}
            ${s.calendarEventId
              ? `<a href="${esc(s.calendarWebLink||'')}" target="_blank" title="Kalendereintrag öffnen" style="text-decoration:none;cursor:pointer">📅</a>`
              : `<button aria-label="Segment in den Kalender eintragen" class="btn" style="padding:1px 6px;font-size:13px;background:var(--accent-weak);color:var(--accent);border:1px solid var(--accent)" onclick="event.stopPropagation();syncSegCal('${esc(t.id)}','${esc(s.id)}')" title="Kalendereintrag erstellen">📅+</button>`
            }
          </div>`).join('')}
        </div>` : '';

      const tripDocs = docs.filter(d => d.tripId === t.id);
      const docsSection = tripDocs.length ? `
        <div class="segments">
          <div class="seg-header">📁 Dokumente (${tripDocs.length})</div>
          ${tripDocs.map(d => {
            const dlUrl = '/dashboard/api/documents/download/' + encodeURIComponent(d.path) + '?token=' + encodeURIComponent(TOKEN);
            return `<div class="seg-row">
              <span class="badge badge-blue">${esc(DOC_CAT_LABELS[d.kategorie] || d.kategorie)}</span>
              <a href="${esc(dlUrl)}" style="color:var(--text);text-decoration:none" download>${esc(d.name.replace(/^\d+_/, ''))}</a>
              <span style="color:var(--muted);font-size:13px">${fmtSize(d.size)} · ${fmtDate(d.date)}</span>
            </div>`;
          }).join('')}
        </div>` : '';

      const tripLinks = (allLinks || []).filter(l => l.entityType === 'trip' && l.entityId === t.id);
      const linksSection = tripLinks.length ? `
        <div class="segments">
          <div class="seg-header">📎 Verknüpfte Dokumente (${tripLinks.length})</div>
          ${tripLinks.map(l => {
            const lIcon = l.docType === 'sharepoint' ? '☁️' : '📁';
            const lName = l.docType === 'sharepoint' ? esc(l.spName || '') : esc(l.localName || '');
            const lLink = l.docType === 'sharepoint' && l.spWebUrl
              ? `<a href="${esc(l.spWebUrl)}" target="_blank" style="color:var(--accent);text-decoration:none">${lName}</a>`
              : lName;
            const lShowLabel = l.label && l.label !== (l.docType === 'sharepoint' ? (l.spName || '') : (l.localName || ''));
            return `<div class="seg-row" style="display:flex;align-items:center;gap:8px">
              <span>${lIcon}</span>
              ${lShowLabel ? `<span style="font-weight:500">${esc(l.label)}</span><span style="color:var(--muted);font-size:13px">—</span>` : ''}
              <span style="${lShowLabel ? 'color:var(--muted);font-size:13px' : 'font-weight:500'}">${lLink}</span>
              <button aria-label="Verknüpfung lösen" title="Verknüpfung lösen" class="btn btn-danger" style="padding:2px 8px;font-size:13px;margin-left:auto"
                onclick="event.stopPropagation();unlinkAndReload('${esc(l.id)}')">✕</button>
            </div>`;
          }).join('')}
        </div>` : '';

      return `<div class="trip-card" id="tc-${esc(t.id)}" style="padding:0;overflow:hidden;border-radius:var(--r)">
        ${entityImgHtml('trip', t.id, 'entity-img-wrap')}
        <div style="padding:20px">
        <div class="trip-top">
          <div>
            <h3>${esc(t.name)} ${badge}</h3>
            <!-- P2-8: Hier standen die rohen ISO-Datumsangaben (2026-02-24). -->
            <div class="trip-dates">📅 ${esc(fmtDate(t.start_date))} → ${esc(fmtDate(t.end_date))} &nbsp;|&nbsp; 📍 ${esc(t.destination||'–')} ${t.country_code?`(${esc(t.country_code)})`:''}</div>
          </div>
          <!-- P2-8: flex-wrap, sonst wird die letzte Schaltflaeche bei 360 px
               abgeschnitten statt umzubrechen. -->
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button aria-label="Dokument mit der Reise verknüpfen" title="Dokument mit der Reise verknüpfen" class="btn btn-primary" onclick="linkDocModal('trip','${esc(t.id)}','loadTripsRefresh')">📎</button>
            <button class="btn btn-primary" onclick="syncAllSegCal('${esc(t.id)}')" title="Alle Segmente mit Kalender synchronisieren">📅 Mit Kalender abgleichen</button>
            <button class="btn btn-primary" onclick="editTrip('${esc(t.id)}')">✏️ Bearbeiten</button>
            <button class="btn btn-danger" onclick="deleteTrip('${esc(t.id)}','${esc(t.name)}')">🗑 Löschen</button>
          </div>
        </div>
        <div class="trip-grid">${meta}</div>
        ${segs}
        ${docsSection}
        ${linksSection}
        </div>
      </div>`;
    }

    const current = trips.filter(t => !t.end_date || t.end_date >= today);
    const past    = trips.filter(t => t.end_date && t.end_date < today).reverse();

    let html = '<div style="margin-bottom:16px"><button class="btn btn-primary" onclick="newTrip()">+ Neue Reise</button></div>';
    html += current.map(renderTripCard).join('');
    if (past.length) {
      html += `<details class="traveled-section">
        <summary>Traveled (${past.length})</summary>
        ${past.map(renderTripCard).join('')}
      </details>`;
    }
    c.innerHTML = html;
    stamp();
  } catch(e) { c.innerHTML = `<div class="empty">Fehler: ${esc(netzFehlerText(e))}</div>`; }
}

async function deleteTrip(id, name) {
  if (!confirm(`Reise "${name}" wirklich löschen?`)) return;
  try {
    await apiFetch(`/api/trips/${encodeURIComponent(id)}`, { method: 'DELETE' });
    document.getElementById(`tc-${id}`)?.remove();
    if (!document.querySelector('.trip-card')) {
      document.getElementById('content').innerHTML = '<div class="empty">Keine Reisen.</div>';
    }
  } catch(e) { meldung('Reise konnte nicht gelöscht werden: ' + netzFehlerText(e), 'error'); }
}

async function createTrip() {
  const id         = document.getElementById('mn-id').value.trim();
  const name       = document.getElementById('mn-name').value.trim();
  const destination= document.getElementById('mn-dest').value.trim();
  const start_date = document.getElementById('mn-start').value;
  const end_date   = document.getElementById('mn-end').value;
  const climate    = document.getElementById('mn-climate').value.trim();
  const activities = document.getElementById('mn-activities').value.split(',').map(s=>s.trim()).filter(Boolean);
  feldFehlerLeeren(['mn-id', 'mn-name', 'mn-start', 'mn-end']);
  if (!name)       return feldFehler('mn-name', 'Der Name ist ein Pflichtfeld.');
  if (!start_date) return feldFehler('mn-start', 'Das Startdatum ist ein Pflichtfeld.');
  if (!end_date)   return feldFehler('mn-end', 'Das Enddatum ist ein Pflichtfeld.');
  try {
    await apiFetch('/api/trips', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      /* Ohne `id` erzeugt der Server die Kennung nach Konvention. */
      body: JSON.stringify({ id: id || undefined, name, destination, start_date, end_date, climate, activities })
    });
    closeModal();
    /* P2-8: landete vorher im Health-Bereich — jetzt dort, wo die neue Reise steht. */
    showTab('trips');
  } catch(e) { dialogMeldung('Die Reise konnte nicht angelegt werden: ' + netzFehlerText(e)); }
}

/* ── Trip editing ── */
function editTrip(id) {
  const t = _tripsCache.find(x => x.id === id);
  if (!t) return meldung('Reise nicht gefunden.', 'error');
  window._editSegments = (t.segments || []).map(s => ({ ...s }));
  const segList = () => {
    if (!window._editSegments.length) {
      return '<span style="color:var(--muted)">Keine Segmente vorhanden.</span>';
    }
    return window._editSegments.map((s, i) =>
      `<div class="seg-item">
        <span class="badge badge-muted">${esc(s.type)}</span>
        <span>${esc(s.title)}</span>
        <span style="color:var(--muted);font-size:13px">${esc(s.datetime_local)} ${esc(s.timezone)}</span>
        ${s.confirmation ? `<span style="color:var(--green);font-size:13px">✔ ${esc(s.confirmation)}</span>` : ''}
        <button aria-label="Segment entfernen" class="seg-rm" onclick="removeSegment(${i},'${esc(id)}')" title="Entfernen">✕</button>
      </div>`).join('');
  };
  openModal(`
    <h3>✏️ Reise bearbeiten</h3>
    <label>Titel</label>
    <input id="m-name" value="${esc(t.name||'')}">
    <label>Ziel</label>
    <input id="m-dest" value="${esc(t.destination||'')}">
    <div class="formular-paar">
      <div><label>Startdatum</label><input id="m-start" type="date" value="${esc(t.start_date||'')}"></div>
      <div><label>Enddatum</label><input id="m-end" type="date" value="${esc(t.end_date||'')}"></div>
    </div>
    <label>Klima</label>
    <input id="m-climate" value="${esc(t.climate||'')}">
    <label>Aktivitäten (kommagetrennt)</label>
    <input id="m-activities" value="${esc((t.activities||[]).join(', '))}">
    <label>Segmente</label>
    <div id="m-seglist">${segList()}</div>
    <button class="btn btn-primary" style="margin-top:8px" onclick="addSegmentModal('${esc(id)}')">+ Segment hinzufügen</button>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-primary" onclick="saveTrip('${esc(id)}')">💾 Speichern</button>
    </div>
  `);
}

async function saveTrip(id) {
  const name       = document.getElementById('m-name').value.trim();
  const destination= document.getElementById('m-dest').value.trim();
  const start_date = document.getElementById('m-start').value;
  const end_date   = document.getElementById('m-end').value;
  const climate    = document.getElementById('m-climate').value.trim();
  const activities = document.getElementById('m-activities').value.split(',').map(s=>s.trim()).filter(Boolean);

    await apiFetch(`/api/trips/${encodeURIComponent(id)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, destination, start_date, end_date, climate, activities, segments })
    });
    closeModal();
    showTab('health');
  } catch(e) { dialogMeldung('Reise konnte nicht gespeichert werden: ' + netzFehlerText(e)); }
}
