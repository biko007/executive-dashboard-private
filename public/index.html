      <button class="btn-ghost" onclick="editTrip('${esc(tripId)}')">← Zurück zur Reise</button>
      <button class="btn btn-primary" onclick="confirmAddSegment('${esc(tripId)}')">Hinzufügen</button>
    </div>
  `);
}

function confirmAddSegment(tripId) {
  const type  = document.getElementById('ms-type').value;
  const title = document.getElementById('ms-title').value.trim();
  const date  = document.getElementById('ms-date').value;
  const time  = document.getElementById('ms-time').value;
  const tz    = document.getElementById('ms-tz').value.trim() || 'Europe/Berlin';
  feldFehlerLeeren(['ms-title']);
  if (!title) return feldFehler('ms-title', 'Der Titel ist ein Pflichtfeld.');
  const datetime_local = date && time ? `${date}T${time}` : date || '';
  window._editSegments.push({ type, title, datetime_local, timezone: tz });
  editTrip(tripId);
}

async function removeSegment(index, tripId) {
  const seg = window._editSegments[index];
  if (seg && seg.calendarEventId) {
    try {
      await apiFetch(`/api/calendar/${encodeURIComponent(seg.calendarEventId)}`, { method: 'DELETE' });
    } catch (e) { console.warn('Calendar delete failed:', e); }
  }
  window._editSegments.splice(index, 1);
  editTrip(tripId);
}

/* ── Trip Segment Calendar Sync ── */

  try {

  } catch (e) { meldung('Kalender-Abgleich fehlgeschlagen: ' + netzFehlerText(e), 'error'); }
}

async function syncAllSegCal(tripId) {
  try {

    meldung(`Kalender-Abgleich: ${result.created} erstellt, ${result.skipped} vorhanden, ${result.failed} fehlgeschlagen.`,

  } catch (e) { meldung('Kalender-Abgleich fehlgeschlagen: ' + netzFehlerText(e), 'error'); }
}

    }

    const st = trends.sleep;
    let sleepTrendHtml = '';
    if (st) {
      sleepTrendHtml = `<div class="s-card"><div class="lbl">${kpiLabel('Schlaf-Trend 30 T', 'Trend Schlaf')}</div><div class="val" style="font-size:22px">Ø ${st.avgDuration}h</div><div class="sub">${st.minDuration}–${st.maxDuration}h${st.avgQuality ? ' | Score '+st.avgQuality+'%' : ''}</div></div>`;
    }

    const hr = trends.heartrate;
    let hrHtml = '';

        <div class="diagramm-rahmen">

        </div>

    if (hrvData.length >= 2) {

    if (weightData.length >= 2) diagrammZeichnen('weightChart', () => renderWeightChart(weightData));

function renderWeightChart(data) {
  const svg = document.getElementById('weightChart');
  if (!svg) return;
  /* P2-3: Breite aus dem Container statt fester 600 px. Vorher lag das
     Diagramm in einem Scrollbereich, der links begann — die juengsten Werte
     am rechten Rand waren ohne Scrollen nicht sichtbar (Spec §6). */
  const W = diagrammBreite(svg), H = 200;
  const pad = diagrammRand(W);
  const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
  const vals = data.map(d => d.value);
  const vMin = Math.floor(Math.min(...vals) - 0.5);
  const vMax = Math.ceil(Math.max(...vals) + 0.5);
  const xScale = i => pad.l + (i / (data.length - 1)) * cw;
  const yScale = v => pad.t + ch - ((v - vMin) / (vMax - vMin)) * ch;

  // Grid lines
  let svgContent = '';
  const steps = 5;
  for (let i = 0; i <= steps; i++) {
    const v = vMin + (vMax - vMin) * (i / steps);
    const y = yScale(v);
    svgContent += `<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    svgContent += `<text x="${pad.l-6}" y="${y+4}" fill="var(--muted)" font-size="11" text-anchor="end">${v.toFixed(1)}</text>`;
  }

  /* Beschriftung nach verfuegbarem Platz, vom juengsten Wert aus gezaehlt —
     damit das aktuelle Datum immer beschriftet ist. */
  for (const i of achsenIndizes(data.length, cw)) {
    const x = xScale(i);
    const anker = i === 0 ? 'start' : i === data.length - 1 ? 'end' : 'middle';
    svgContent += `<text x="${x}" y="${H-5}" fill="var(--muted)" font-size="11" text-anchor="${anker}">${data[i].date.slice(5)}</text>`;
  }

  // Line
  const points = data.map((d, i) => `${xScale(i).toFixed(1)},${yScale(d.value).toFixed(1)}`).join(' ');
  svgContent += `<polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;

  // Trend line (linear regression)
  const n = data.length;
  const xMean = (n - 1) / 2;
  const yMean = vals.reduce((a, b) => a + b, 0) / n;
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) { num += (i - xMean) * (vals[i] - yMean); den += (i - xMean) ** 2; }
  const slope = den ? num / den : 0;
  const intercept = yMean - slope * xMean;
  const ty0 = yScale(intercept);
  const ty1 = yScale(slope * (n - 1) + intercept);
  svgContent += `<line x1="${pad.l}" y1="${ty0}" x2="${W-pad.r}" y2="${ty1}" stroke="var(--yellow)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.7"/>`;

  // Dots
  data.forEach((d, i) => {
    svgContent += `<circle cx="${xScale(i).toFixed(1)}" cy="${yScale(d.value).toFixed(1)}" r="3" fill="var(--accent)" opacity="0.8"><title>${esc(fmtDate(d.date))}: ${d.value} kg</title></circle>`;
  });

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = svgContent;
}

function renderSleepChart(data) {
  const svg = document.getElementById('sleepChart');
  if (!svg) return;
  /* P2-3: Breite aus dem Container statt fester 600 px. Vorher lag das
     Diagramm in einem Scrollbereich, der links begann — die juengsten Werte
     am rechten Rand waren ohne Scrollen nicht sichtbar (Spec §6). */
  const W = diagrammBreite(svg), H = 200;
  const pad = diagrammRand(W);
  const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
  const maxH = Math.ceil(Math.max(...data.map(d => d.duration)) + 0.5);
  const barW = Math.max(4, Math.min(20, cw / data.length - 2));
  const xScale = i => pad.l + (i + 0.5) * (cw / data.length);
  const yScale = v => pad.t + ch - (v / maxH) * ch;

  let svgContent = '';

  // Grid lines
  for (let h = 0; h <= maxH; h += 2) {
    const y = yScale(h);
    svgContent += `<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    svgContent += `<text x="${pad.l-6}" y="${y+4}" fill="var(--muted)" font-size="11" text-anchor="end">${h}h</text>`;
  }

  // Bars
  data.forEach((d, i) => {
    const x = xScale(i) - barW / 2;
    const barH = (d.duration / maxH) * ch;
    const y = pad.t + ch - barH;
    const color = d.duration < 6 ? 'var(--red)' : d.duration < 7 ? 'var(--yellow)' : 'var(--green)';
    svgContent += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" fill="${color}" opacity="0.9" rx="2"><title>${esc(fmtDate(d.date))}: ${d.duration} h${d.quality ? ' (Schlafscore ' + d.quality + ' %)' : ''}</title></rect>`;
  });

  /* Beschriftung nach verfuegbarem Platz, der juengste Wert immer dabei. */
  for (const i of achsenIndizes(data.length, cw)) {
    const x = xScale(i);
    const anker = i === 0 ? 'start' : i === data.length - 1 ? 'end' : 'middle';
    svgContent += `<text x="${x}" y="${H-5}" fill="var(--muted)" font-size="11" text-anchor="${anker}">${data[i].date.slice(5)}</text>`;
  }

  // 6h reference line
  const y6 = yScale(6);
  svgContent += `<line x1="${pad.l}" y1="${y6}" x2="${W-pad.r}" y2="${y6}" stroke="var(--red)" stroke-width="1" stroke-dasharray="4,4" opacity="0.8"/>`;
  /* Die Beschriftung sass rechts NEBEN dem Zeichenbereich und wurde schmal
     abgeschnitten. Jetzt steht sie innen am rechten Rand — links wäre sie
     direkt neben der gleichnamigen Achsenbeschriftung gelandet. */
  svgContent += `<text x="${W - pad.r - 2}" y="${y6 - 4}" fill="var(--red)" font-size="11" text-anchor="end">6h</text>`;

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = svgContent;
}

async function loadDrafts() {
  const c = document.getElementById('content');
  try {
    const [drafts, draftLinks] = await Promise.all([apiFetch('/api/drafts'), apiFetch('/api/links').catch(() => [])]);
    _draftsCache = drafts;
    if (!drafts.length) { c.innerHTML = '<div class="empty">Keine Drafts vorhanden.</div>'; return; }
    const statusBadge = s => ({'draft':'badge-yellow','approved':'badge-blue','sent':'badge-green'}[s]||'badge-muted');
    const rows = drafts.map(d => {
      const dLinks = (draftLinks || []).filter(l => l.entityType === 'draft' && l.entityId === d.id);
      const dLinksHtml = dLinks.length ? dLinks.map(l => {
        const li = l.docType === 'sharepoint' ? '☁️' : '📁';

          ? `<a href="${esc(l.spWebUrl)}" target="_blank" style="color:var(--accent)">${esc(l.spName||'')}</a>`

        <td><span class="badge badge-blue">${esc(d.account||'–')}</span></td>
        <td><span class="badge ${statusBadge(d.status)}">${esc(d.status||'–')}</span></td>

/* ═══════════════════════════════════════════════════════════════════════════
   CALENDAR
═══════════════════════════════════════════════════════════════════════════ */
let _calCache = [];

/* ── Kalender (P1-5) ──────────────────────────────────────────────────────────
   Die frueheren Helfer calDatePart()/calTimePart() haben den Graph-Zeitstempel
   per String-Ausschnitt zerlegt und damit die mitgelieferte Zone ignoriert.
   Die gesamte Zeitlogik liegt jetzt in public/js/zeit.js — dieselbe Logik
   nutzt das Telegram-Briefing im executive-agent. */

async function loadCalendar() {
  const c = document.getElementById('content');
  try {
    const [events, calLinks] = await Promise.all([apiFetch('/api/calendar'), apiFetch('/api/links').catch(() => [])]);
    _calCache = events;

    const toolbar = '<div style="margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">'
      + '<button class="btn btn-primary" onclick="newEventModal()">+ Neuer Termin</button>'
      /* C2 (Phase 3): Der Zeitzonenhinweis steht im Seitenkopf und gilt
         fuer alle Bereiche. Zweimal derselbe Satz auf einer Seite kostete
         schmal eine ganze Zeile. */
      + '</div>';

    if (!events.length) { c.innerHTML = toolbar + '<div class="empty">Keine Termine in den nächsten 7 Tagen.</div>'; return; }

    /* Gruppierung nach dem Berliner Kalendertag des Beginns — bei
       Ganztagsterminen nach dem woertlichen Datum aus der Graph-Antwort. */
    const groups = {};
    for (const ev of events) {
      const z = kalenderZeitraum(ev);
      const k = z.tagesSchluessel || 'unbekannt';
      (groups[k] = groups[k] || []).push({ ev, z });
    }

    const html = Object.keys(groups).sort().map(k => {
      const eintraege = groups[k].sort((a, b) => {
        // Ganztagstermine zuerst, danach nach Beginn
        if (a.z.ganztags !== b.z.ganztags) return a.z.ganztags ? -1 : 1;
        const sa = graphZeitpunkt(a.ev.start), sb = graphZeitpunkt(b.ev.start);
        return (sa ? sa.getTime() : 0) - (sb ? sb.getTime() : 0);
      });
      return `<div class="day-group">
        <div class="day-lbl">📅 ${esc(k === 'unbekannt' ? 'Datum unbekannt' : zeitTagLang(k))}</div>
        ${eintraege.map(({ ev, z }) => {
          const evId = ev.id || '';
          const ortText = ev.location?.displayName || '';
          const meetingUrl = kalenderMeetingUrl(ev);
          /* Steht im Ortsfeld nur die Meeting-Adresse, waere sie doppelt —
             dann zeigt die Karte nur die Aktion "Teilnehmen". */
          const ortIstLink = !!meetingUrl && ortText.trim() === meetingUrl;
          const evLinks = (calLinks || []).filter(l => l.entityType === 'calendar' && l.entityId === evId);
          const evLinksHtml = evLinks.length ? `<div class="ev-sub" style="margin-top:4px">${evLinks.map(l => {
            const li = l.docType === 'sharepoint' ? '☁️' : '📁';
            const ln = l.docType === 'sharepoint' && l.spWebUrl
              ? `<a href="${esc(l.spWebUrl)}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(l.spName||'')}</a>`
              : esc(l.localName||'');
            return `${li} ${esc(l.label)}: ${ln} <button aria-label="Verknüpfung lösen" title="Verknüpfung lösen" class="btn btn-danger" style="padding:1px 5px;font-size:13px" onclick="event.stopPropagation();unlinkAndReload('${esc(l.id)}')">✕</button>`;
          }).join(' &nbsp; ')}</div>` : '';

          return `<div class="ev-row${z.ganztags ? ' ev-ganztags' : ''}">
            <div class="ev-time">
              <div class="ev-zeit-haupt">${esc(z.zeitText)}</div>
              ${z.dauerText ? `<div class="ev-zeit-sub">${esc(z.dauerText)}</div>` : ''}
              ${z.mehrtaegig ? `<div class="ev-zeit-sub">${esc(z.spanneText)}</div>` : ''}
            </div>
            <div class="ev-body">
              <div class="ev-title">${esc(ev.subject||'(kein Titel)')}</div>
              ${z.unplausibel ? '<div class="ev-warnung">⚠️ Das hinterlegte Ende liegt vor dem Beginn. Der Termin wird unverändert angezeigt.</div>' : ''}
              ${ortText && !ortIstLink ? `<div class="ev-sub">📍 ${esc(ortText)}</div>` : ''}
              ${kalenderBeschreibungHtml(ev)}
              ${evLinksHtml}
            </div>
            <div class="ev-aktionen">
              ${kalenderMeetingLink(ev)}
              <button class="btn btn-primary" style="padding:4px 8px;font-size:13px" aria-label="Dokument verknüpfen" title="Dokument verknüpfen" onclick="linkDocModal('calendar','${esc(evId)}','loadCalendarRefresh')">📎</button>
              <button class="btn btn-primary" style="padding:4px 8px;font-size:13px" aria-label="Termin bearbeiten" title="Termin bearbeiten" onclick="editEventModal('${esc(evId)}')">✏️</button>
              <button class="btn btn-danger" style="padding:4px 8px;font-size:13px" aria-label="Termin löschen" title="Termin löschen" onclick="deleteEvent('${esc(evId)}','${esc(ev.subject||'')}')">🗑</button>
            </div>
          </div>`;
        }).join('')}
      </div>`;
    }).join('');

    c.innerHTML = toolbar + html;
    /* Erst nach dem Aufbau laesst sich messen, welche Beschreibung gekuerzt
       ist und deshalb eine Aufklapp-Schaltflaeche braucht (P2-4). */
    kalenderBeschreibungenPruefen();
    stamp();
    setDatenstand([{
      quelle: 'Kalender (Microsoft 365)',
      live: true,
      stand: new Date().toISOString(),
      abgleich: new Date().toISOString(),
      /* Der Zeitzonenhinweis steht in der Werkzeugzeile darueber — hier
         und in der Leiste waere er der zweite und dritte Abdruck (P2-3). */
      hinweis: events.length + (events.length === 1 ? ' Termin' : ' Termine') + ' in den nächsten 7 Tagen.',
    }], { zeitzone: false });
  } catch(e) {
    c.innerHTML = `<div class="empty">Kalender konnte nicht geladen werden: ${esc(netzFehlerText(e))}</div>`;
    setDatenstand([{ quelle: 'Kalender (Microsoft 365)', zustand: 'getrennt', stand: null, abgleich: null,
      hinweis: 'Abruf fehlgeschlagen — es fehlen Termine, die Liste ist nicht leer.' }], { zeitzone: false });
  }
}

/* Gemeinsames Formular fuer Anlegen und Bearbeiten: Start- UND Enddatum,
   Ganztags-Option, sichtbare Zeitzone. Vorher gab es nur EIN Datumsfeld und
   das Ende wurde mit dem Startdatum zurueckgeschrieben — bei dem
   INHALE-Termin haette das "22:00 bis 21:30 am selben Tag" gespeichert. */
/* Beschreibung in der Terminliste (P2-4).
   Der Text wird nicht mehr hart nach 160 Zeichen abgeschnitten, sondern auf
   zwei Zeilen gekuerzt (breit auf vier) und laesst sich aufklappen. Die
   Einwahldaten der Online-Besprechung sind schon in kalenderBeschreibung()
   herausgefiltert; der Beitrittslink steht als eigene Schaltflaeche. */
let _kalenderBeschreibungZaehler = 0;

function kalenderBeschreibungHtml(ev) {
  const text = kalenderBeschreibung(ev, 1200);
  if (!text) return '';
  const id = 'ev-besch-' + (++_kalenderBeschreibungZaehler);
  return '<div class="ev-beschreibung-block">'
    + '<div class="ev-sub ev-beschreibung" id="' + id + '">' + esc(text) + '</div>'
    + '<button type="button" class="ev-mehr" hidden'
    + ' aria-controls="' + id + '" aria-expanded="false"'
    + ' onclick="kalenderBeschreibungUmschalten(this)">mehr…</button>'
    + '</div>';
}

function kalenderBeschreibungUmschalten(btn) {
  const block = btn.previousElementSibling;
  if (!block) return;
  const offen = block.classList.toggle('ev-beschreibung-offen');
  btn.textContent = offen ? 'weniger' : 'mehr…';
  btn.setAttribute('aria-expanded', offen ? 'true' : 'false');
}

/* Die Schaltflaeche erscheint nur, wenn der Text wirklich gekuerzt ist.
   Das laesst sich erst nach dem Aufbau messen. */
function kalenderBeschreibungenPruefen() {
  for (const el of document.querySelectorAll('.ev-beschreibung')) {
    const btn = el.nextElementSibling;
    if (!btn || !btn.classList.contains('ev-mehr')) continue;
    btn.hidden = el.scrollHeight <= el.clientHeight + 1;
  }
}

function kalenderFormularHtml(werte, idPrefix) {
  const p = idPrefix;
  /* P2-4: Kaestchen und Beschriftung in EINER Zeile, die Beschriftung ueber
     `for` klickbar. Vorher zog `.modal input { width: 100% }` das Kaestchen
     auf volle Breite und schob den Text darunter. */
  return `
    <div class="kontrollzeile">
      <input type="checkbox" id="${p}-allday" ${werte.ganztags ? 'checked' : ''}
             onchange="kalenderFormularUmschalten('${p}')">
      <label for="${p}-allday" class="kontrollzeile-text">Ganztägig</label>
    </div>
    <div class="formular-paar">
      <div><label for="${p}-sdate">Startdatum</label><input id="${p}-sdate" type="date" value="${esc(werte.startDatum)}"></div>
      <div><label for="${p}-edate">Enddatum</label><input id="${p}-edate" type="date" value="${esc(werte.endDatum)}"></div>
    </div>
    <div class="formular-paar" id="${p}-zeiten">
      <div><label for="${p}-stime">Startzeit</label><input id="${p}-stime" type="time" value="${esc(werte.startZeit)}"></div>
      <div><label for="${p}-etime">Endzeit</label><input id="${p}-etime" type="time" value="${esc(werte.endZeit)}"></div>
    </div>
    <div class="cal-tz-hinweis" style="margin-top:6px">Angaben in Europe/Berlin. Bei ganztägigen Terminen gilt das Enddatum einschließlich.</div>`;
}

function kalenderFormularUmschalten(p) {
  const an = document.getElementById(p + '-allday')?.checked;
  const zeiten = document.getElementById(p + '-zeiten');
  /* Leerer Wert statt 'grid': die Anzeigeart kommt wieder aus der Stilvorlage
     (.formular-paar), die je nach Breite ein- oder zweispaltig ist. */
  if (zeiten) zeiten.style.display = an ? 'none' : '';
}

function kalenderFormularLesen(p) {
  return {
    ganztags: !!document.getElementById(p + '-allday')?.checked,
    startDatum: document.getElementById(p + '-sdate')?.value || '',
    endDatum: document.getElementById(p + '-edate')?.value || '',
    startZeit: document.getElementById(p + '-stime')?.value || '',
    endZeit: document.getElementById(p + '-etime')?.value || '',
  };
}

function newEventModal() {
  const heute = zeitTagInZone(new Date(), ZEIT_ZONE);
  openModal(`
    <h3>+ Neuer Termin</h3>
    <label>Titel</label>
    <input id="ce-subject" placeholder="Besprechung, Arzttermin, …">
    ${kalenderFormularHtml({ ganztags: false, startDatum: heute, endDatum: heute, startZeit: '09:00', endZeit: '10:00' }, 'ce')}
    <label>Ort (optional)</label>
    <input id="ce-loc" placeholder="z.B. Büro, Zoom">
    <label>Beschreibung (optional)</label>
    <textarea id="ce-body" style="min-height:80px" placeholder="Weitere Details…"></textarea>

      <button class="btn-ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-primary" id="ce-save" onclick="createEvent()">📅 Erstellen</button>
    </div>
  `);
  kalenderFormularUmschalten('ce');

async function createEvent() {
  const subject = document.getElementById('ce-subject').value.trim();
  const loc     = document.getElementById('ce-loc').value.trim();
  const body    = document.getElementById('ce-body').value.trim();
  /* P2-4: Pruefhinweise stehen am Feld, nicht in einem Systemfenster. */
  feldFehlerLeeren(['ce-subject', 'ce-sdate', 'ce-edate']);
  if (!subject) return feldFehler('ce-subject', 'Der Titel ist ein Pflichtfeld.');

  const nutzlast = kalenderNutzlast(kalenderFormularLesen('ce'));
  if (nutzlast.fehler) return feldFehler('ce-edate', nutzlast.fehler);

  const btn = document.getElementById('ce-save');
  btn.disabled = true; btn.textContent = 'Speichern…';
  try {
    await apiFetch('/api/calendar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        subject,
        start: nutzlast.start,
        end: nutzlast.end,
        isAllDay: nutzlast.isAllDay,
        location: loc,
        body: body,
      }),
    });
    closeModal();
    showTab('calendar');
  } catch(e) {
    dialogMeldung('Termin konnte nicht angelegt werden: ' + netzFehlerText(e));
    btn.disabled = false; btn.textContent = '📅 Erstellen';
  }
}

function editEventModal(eventId) {

    <textarea id="ee-body" style="min-height:80px">${esc(ev.bodyPreview||'')}</textarea>

async function saveEvent(eventId) {

async function deleteEvent(eventId, subject) {

/* ═══════════════════════════════════════════════════════════════════════════
   DOCUMENTS
═══════════════════════════════════════════════════════════════════════════ */

const DOC_CATEGORIES = [
  { value: '', label: 'Alle Kategorien' },
  { value: 'vertraege', label: 'Verträge' },
  { value: 'rechnungen', label: 'Rechnungen' },
  { value: 'notizen', label: 'Notizen' },
  { value: 'sonstiges', label: 'Sonstiges' },
];

async function loadDocuments() {
  const c = document.getElementById('content');
  try {
    const [docs, trips] = await Promise.all([
      apiFetch('/api/documents'),
      apiFetch('/api/trips'),
    ]);
    _docsCache = docs;
    _tripsCache = trips;

    // Build filter toolbar
    const catOpts = DOC_CATEGORIES.map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('');
    const tripOpts = `<option value="">Alle Trips</option>` + trips.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('');

    c.innerHTML = `
      <div class="doc-toolbar">
        <select id="doc-cat-filter" onchange="filterDocs()">${catOpts}</select>
        <select id="doc-trip-filter" onchange="filterDocs()">${tripOpts}</select>
        <button class="btn btn-primary" onclick="uploadDocModal()">+ Hochladen</button>
      </div>
      <div class="card" id="doc-table-wrap"></div>`;

    renderDocTable(docs, trips);
    stamp();
  } catch (e) { c.innerHTML = `<div class="empty">Fehler: ${esc(netzFehlerText(e))}</div>`; }
}

function renderDocTable(docs, trips) {
  const wrap = document.getElementById('doc-table-wrap');
  if (!docs.length) { wrap.innerHTML = '<div class="empty">Keine Dokumente vorhanden.</div>'; return; }
  const tripMap = {};
  for (const t of trips) tripMap[t.id] = t.name;

  const rows = docs.map(d => {
    const tripLabel = d.tripId && tripMap[d.tripId]
      ? `<a class="doc-trip-link" onclick="goToTrip('${esc(d.tripId)}')">${esc(tripMap[d.tripId])}</a>`
      : '<span style="color:var(--muted)">–</span>';
    const dlUrl = '/dashboard/api/documents/download/' + encodeURIComponent(d.path) + '?token=' + encodeURIComponent(TOKEN);
    return `<tr>
      <td>${esc(d.name.replace(/^\d+_/, ''))}</td>
      <td><span class="badge badge-blue">${esc(DOC_CAT_LABELS[d.kategorie] || d.kategorie)}</span></td>
      <td>${tripLabel}</td>
      <td style="white-space:nowrap">${fmtSize(d.size)}</td>
      <td style="white-space:nowrap">${fmtDate(d.date)}</td>
      <td style="white-space:nowrap">
        <a href="${esc(dlUrl)}" class="btn btn-primary" style="padding:4px 8px;font-size:13px;text-decoration:none" download>⬇</a>
        <button aria-label="Dokument löschen" title="Dokument löschen" class="btn btn-danger" style="padding:4px 8px;font-size:13px" onclick="deleteDoc('${esc(d.path)}','${esc(d.name)}')">🗑</button>
      </td>
    </tr>`;
  }).join('');

  wrap.innerHTML = `<table>
    <thead><tr><th>Dateiname</th><th>Kategorie</th><th>Trip</th><th>Größe</th><th>Datum</th><th>Aktionen</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function filterDocs() {
  const cat = document.getElementById('doc-cat-filter').value;
  const trip = document.getElementById('doc-trip-filter').value;
  let filtered = _docsCache;
  if (cat) filtered = filtered.filter(d => d.kategorie === cat);
  if (trip) filtered = filtered.filter(d => d.tripId === trip);
  renderDocTable(filtered, _tripsCache);
}

function goToTrip(tripId) {
  showTab('trips');
  setTimeout(() => {
    const el = document.getElementById('tc-' + tripId);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 400);
}

function uploadDocModal() {
  const catOpts = DOC_CATEGORIES.slice(1).map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('');
  const tripOpts = `<option value="">– Kein Trip –</option>` + _tripsCache.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('');
  openModal(`
    <h3>📁 Dokument hochladen</h3>
    <label>Kategorie</label>
    <select id="upl-cat">${catOpts}</select>
    <label>Trip-Verknüpfung (optional)</label>
    <select id="upl-trip">${tripOpts}</select>
    <label>Datei</label>
    <div class="drop-zone" id="upl-drop" onclick="document.getElementById('upl-file').click()">
      Datei hierher ziehen oder klicken
    </div>
    <input type="file" id="upl-file" style="display:none" onchange="showFileName()">
    <div id="upl-fname" style="color:var(--muted);font-size:13px;margin-top:4px"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-primary" id="upl-btn" onclick="uploadDoc()">⬆ Hochladen</button>
    </div>
  `);
  // Drag & drop
  const dz = document.getElementById('upl-drop');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => {
    e.preventDefault(); dz.classList.remove('drag-over');
    if (e.dataTransfer.files.length) {
      document.getElementById('upl-file').files = e.dataTransfer.files;
      showFileName();
    }
  });
}

function showFileName() {
  const f = document.getElementById('upl-file').files[0];
  document.getElementById('upl-fname').textContent = f ? `${f.name} (${fmtSize(f.size)})` : '';
  document.getElementById('upl-drop').textContent = f ? f.name : 'Datei hierher ziehen oder klicken';
}

async function uploadDoc() {
  const fileInput = document.getElementById('upl-file');
  feldFehlerLeeren(['upl-file']);
  if (!fileInput.files.length) return feldFehler('upl-file', 'Bitte eine Datei auswählen.');
  const form = new FormData();
  form.append('file', fileInput.files[0]);
  form.append('kategorie', document.getElementById('upl-cat').value);
  const tripId = document.getElementById('upl-trip').value;
  if (tripId) form.append('tripId', tripId);

  const btn = document.getElementById('upl-btn');
  btn.disabled = true; btn.textContent = 'Uploading…';
  try {
    const sep = '/api/documents/upload'.includes('?') ? '&' : '?';
    const res = await fetch('/dashboard/api/documents/upload' + sep + 'token=' + encodeURIComponent(TOKEN), {
      method: 'POST', body: form,
    });
    if (res.status === 401) { logout(); throw new Error('401'); }
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || `HTTP ${res.status}`); }
    closeModal();
    showTab('documents');
  } catch (e) { dialogMeldung('Hochladen fehlgeschlagen: ' + netzFehlerText(e)); btn.disabled = false; btn.textContent = '⬆ Hochladen'; }
}

async function deleteDoc(docPath, name) {
  if (!confirm(`Dokument "${name.replace(/^\d+_/, '')}" wirklich löschen?`)) return;
  try {
    await apiFetch(`/api/documents/${encodeURIComponent(docPath)}`, { method: 'DELETE' });
    showTab('documents');
  } catch (e) { meldung('Dokument konnte nicht gelöscht werden: ' + netzFehlerText(e), 'error'); }
}

async function spLoadDefault() {

       deshalb null und die Dateiliste nennt nur die Zahl der Eintraege. */
    spOpenDrive(data.drive_id, null, data.drive_name || '');
  } catch (e) {
    if (e.message?.includes('503') || e.message?.includes('no sharepoint')) {
      btn.disabled = true;
      btn.title = 'Keine SharePoint-Sites verfügbar';
      btn.textContent = '📂 Keine Sites verfügbar';

      btn.disabled = true;

      btn.disabled = false;
      btn.textContent = origText;
    }

/* ═══════════════════════════════════════════════════════════════════════════
   SharePoint — Normalisierung der Core-Antworten (P1-4, Befund E)

   Sprint 10 hat die lesenden SharePoint-Wege von der Graph-API auf Postgres
   umgestellt. Der Core liefert seitdem snake_case: site_id, site_name,
   drive_id, drive_name, web_url, last_modified_at, path, size, mime_type.
   Das Frontend las weiter die Graph-Namen (id, displayName, webUrl,
   lastModifiedDateTime, downloadUrl, isFolder). Folgen im Betrieb:

     - href="" bei jedem "Öffnen ↗" — ein leerer href laedt die AKTUELLE
       Seite neu, deshalb erschien ein weiterer Dashboard-Tab statt des
       Dokuments.
     - Site- und Bibliotheksnamen fehlten.
     - Das Aenderungsdatum stand dauerhaft auf "–".
     - Der Ordnerpfad wurde nicht angezeigt, obwohl `path` geliefert wird —
       gleichnamige Dateien waren dadurch nicht unterscheidbar.
     - f.downloadUrl existiert nie, die Download-Schaltflaeche erschien nie.

   Diese drei Funktionen sind ab jetzt die EINZIGE Stelle im Frontend, an der
   Feldnamen der Quelle vorkommen. Aendert der Core sein Format, ist nur hier
   nachzuziehen.
   ═══════════════════════════════════════════════════════════════════════════ */

function spSite(roh) {
  const name = (roh.site_name || '').trim();
  return {
    id: roh.site_id || '',
    name: name,
    nameFehlt: !name,
    dateien: roh.file_count != null ? Number(roh.file_count) : null,
  };
}

function spDrive(roh) {
  const name = (roh.drive_name || '').trim();
  return {
    id: roh.drive_id || '',
    name: name,
    nameFehlt: !name,
    dateien: roh.file_count != null ? Number(roh.file_count) : null,
  };
}

function spDatei(roh) {
  const pfad = roh.path || '';
  const i = pfad.lastIndexOf('/');
  const url = roh.web_url || '';
  return {
    id: roh.id != null ? String(roh.id) : '',
    name: roh.name || '',
    url: url,
    dokumentUrl: spDokumentUrl(url),
    ordnerUrl: spOrdnerUrl(url),
    pfad: pfad,
    ordner: i > 0 ? pfad.slice(0, i) : '',
    geaendertAm: roh.last_modified_at || null,
    groesse: roh.size != null ? Number(roh.size) : null,
    typ: roh.mime_type || '',
    fehltSeit: roh.missing_since || null,
  };
}

/* ── A5 (Phase 3): Dokumentadresse und Ordneradresse ─────────────────────────

   BEFUND CHECKPOINT 2: Beim I83-Mietvertrag landete man im Ordner `12-I83`,
   beim S28-Mietvertrag in `11-S28/Mietverträge` — also im Ordner, nicht im
   Dokument.

   URSACHE: In der CP1-Nachbesserung wurde aus der gespeicherten Dateiadresse
   eine Adresse der Form
     <Site>/_layouts/15/Doc.aspx?sourcedoc=<Pfad>&action=default
   gebaut. Drei Dinge daran sind falsch:
     1. `Doc.aspx` ist der Einstieg der Office-Web-Anwendungen. Von den 12.089
        Dateien im Index sind 5.733 PDF und 4.758 JPEG — fuer die ist er nicht
        zustaendig.
     2. Die 537 Adressen, die SharePoint SELBST als Ansichtsadresse geliefert
        hat, tragen `sourcedoc={GUID}` UND `file=<Name>`. Die gebaute Adresse
        hatte einen Pfad als `sourcedoc` und kein `file` — SharePoint kann das
        Element damit nicht aufloesen und faellt auf den uebergeordneten Ordner
        zurueck. Genau das hat der Owner gesehen.
     3. Eine GUID liesse sich nicht nachbauen: `graph_item_id` ist im Index bei
        12.088 von 12.089 Zeilen leer.
   Die Messung, auf die sich die CP1-Nachbesserung berief, war ein curl-Aufruf
   OHNE Anmeldung. Ein 403 mit `content-type: text/plain` ist dort die
   Fehlerseite und sagt nichts ueber das Verhalten einer angemeldeten Sitzung.

   LOESUNG: Die vom Core gespeicherte `web_url` ist die Adresse, die Microsoft
   Graph fuer DAS ELEMENT geliefert hat. Sie wird nicht mehr umgebaut:
     - traegt sie schon eine Query (die 537 Office-Ansichtsadressen), bleibt sie
       unveraendert;
     - sonst wird `?web=1` angehaengt, der dokumentierte Hinweis „im Browser
       oeffnen". Ignoriert SharePoint ihn, ist das Ergebnis dasselbe wie ohne —
       in keinem Fall der falsche Ordner.
   Zusaetzlich gibt es eine ausdrueckliche Aktion „Ordner oeffnen". */
function spDokumentUrl(webUrl) {
  if (!spIstWebAdresse(webUrl)) return '';
  let u;
  try { u = new URL(String(webUrl)); } catch { return ''; }
  if (u.search) return webUrl;   // bereits eine Ansichtsadresse von SharePoint
  u.searchParams.set('web', '1');
  return u.toString();
}

/* Adresse des Ordners, in dem die Datei liegt: der Dateiname faellt weg.
   Bei einer Ansichtsadresse mit Query ist der Ordner nicht ableitbar — dann
   gibt es hier nichts, und die Aktion entfaellt. */
function spOrdnerUrl(webUrl) {
  if (!spIstWebAdresse(webUrl)) return '';
  let u;
  try { u = new URL(String(webUrl)); } catch { return ''; }
  if (u.search) return '';
  const i = u.pathname.lastIndexOf('/');
  if (i <= 0) return '';
  return u.origin + u.pathname.slice(0, i);
}

/* Nur echte Web-Adressen werden verlinkt. Alles andere — fehlender Wert oder
   ein anderes Schema wie javascript: oder data: — wird als deaktivierte Aktion
   dargestellt. Vorher erzeugte ein fehlender Wert href="" und ein leerer href
   laedt die AKTUELLE Seite neu: genau so entstand der zweite Dashboard-Tab
   statt des Dokuments (Spec §4 E). */
function spIstWebAdresse(url) {
  if (!url) return false;
  try {
    const p = new URL(String(url), window.location.origin).protocol;
    return p === 'http:' || p === 'https:';
  } catch { return false; }
}

/* A5: Zwei getrennte, ausdruecklich benannte Aktionen. „Dokument oeffnen"
   fuehrt auf die von SharePoint gelieferte Adresse DES ELEMENTS, „Ordner
   oeffnen" auf den uebergeordneten Ordner. Was nicht erreichbar ist, wird als
   deaktivierte Aktion mit Grund dargestellt — nie als toter Link. */
function spOeffnenAktion(url) {
  if (!spIstWebAdresse(url)) {
    const grund = url
      ? 'Die im Index gespeicherte Adresse ist keine Web-Adresse.'
      : 'Für diesen Eintrag ist im Index keine SharePoint-Adresse gespeichert.';
    return `<span class="sp-aktion-aus" title="${esc(grund)}">Kein Link verfügbar</span>`;
  }
  const dok = spDokumentUrl(url) || url;
  const ordner = spOrdnerUrl(url);
  return `<div class="sp-aktionen">
    <a href="${esc(dok)}" target="_blank" rel="noopener" onclick="event.stopPropagation()"
       title="Öffnet das Dokument in SharePoint">Dokument öffnen ↗</a>`
    + (ordner
        ? `<a href="${esc(ordner)}" target="_blank" rel="noopener" onclick="event.stopPropagation()"
       class="sp-aktion-zweit" title="Öffnet den Ordner, in dem das Dokument liegt">Ordner öffnen ↗</a>`
        : '')
    + `</div>`;
}

function spNameOderHinweis(eintrag) {
  return eintrag.nameFehlt
    ? '<em style="color:var(--muted)">Name nicht erfasst</em>'
    : `<strong>${esc(eintrag.name)}</strong>`;
}

function spDateienText(n) {
  if (n == null) return '–';
  return n.toLocaleString('de-DE') + (n === 1 ? ' Datei' : ' Dateien');
}

/* ── Sites ────────────────────────────────────────────────────────────────── */

function renderSPSites(sites) {
  const wrap = document.getElementById('sp-main');
  if (!sites.length) { wrap.innerHTML = '<div class="empty">Keine SharePoint-Sites im Index.</div>'; return; }

  const liste = sites.map(spSite);
  /* Mehrere Eintraege koennen dieselbe site_id tragen (Altbestand aus dem
     Einmal-Import vom 16.05.2026). Sie werden angezeigt, nicht bereinigt
     (Owner-Entscheidung Nr. 8). */
  const mehrfach = {};
  liste.forEach(x => { mehrfach[x.id] = (mehrfach[x.id] || 0) + 1; });

  const rows = liste.map(x => `<tr style="cursor:pointer" onclick="spOpenSite('${esc(x.id)}')">
    <td>${spNameOderHinweis(x)}${mehrfach[x.id] > 1 && x.nameFehlt
      ? '<div style="color:var(--muted);font-size:13px;margin-top:3px">Alteintrag mit derselben Site-Kennung</div>' : ''}</td>
    <td style="color:var(--muted);font-size:13px">${esc(spDateienText(x.dateien))}</td>
    <td style="white-space:nowrap">${spOeffnenAktion('')}</td>
  </tr>`).join('');

  wrap.innerHTML = `<table>
    <thead><tr><th>Site</th><th>Umfang im Index</th><th>Aktion</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
  <div class="sp-hinweis">Der Index enthält keine Site-Adresse. Einzelne Dokumente lassen sich
  über „Öffnen ↗" in der Dateiliste direkt in SharePoint aufrufen.</div>`;
}

async function spOpenSite(siteId) {
  _spCurrentSiteId = siteId;
  _spCurrentDriveId = '';
  _spCurrentDriveName = '';
  _spCurrentDriveFiles = null;
  const wrap = document.getElementById('sp-main');
  wrap.innerHTML = '<div class="spinner">Bibliotheken laden…</div>';
  try {
    const drives = await apiFetch(`/api/sharepoint/drives/${encodeURIComponent(siteId)}`);
    _spDrivesCache = drives;
    renderSPDrives(drives);
  } catch (e) { wrap.innerHTML = `<div class="empty">Laden fehlgeschlagen: ${esc(netzFehlerText(e))}</div>`; }
}

/* ── Bibliotheken ─────────────────────────────────────────────────────────── */

function renderSPDrives(drives) {
  const wrap = document.getElementById('sp-main');
  const backBtn = `<div style="padding:12px 14px;border-bottom:1px solid var(--border)">
    <button class="btn-ghost" onclick="loadSharePoint()" style="font-size:13px">← Zurück zu den Sites</button>
  </div>`;
  if (!drives.length) { wrap.innerHTML = backBtn + '<div class="empty">Keine Dokumentbibliotheken im Index.</div>'; return; }

  const liste = drives.map(spDrive);
  const rows = liste.map(x => `<tr style="cursor:pointer"
      onclick="spOpenDrive('${esc(x.id)}', ${x.dateien == null ? 'null' : x.dateien}, '${esc(x.name)}')">
    <td>${spNameOderHinweis(x)}</td>
    <td style="color:var(--muted);font-size:13px">${esc(spDateienText(x.dateien))}</td>
  </tr>`).join('');

  wrap.innerHTML = backBtn + `<table>
    <thead><tr><th>Bibliothek</th><th>Umfang im Index</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

/* ── Dateiliste ───────────────────────────────────────────────────────────── */
//
// Der Core liefert eine FLACHE Dateiliste mit vollem Pfad; eine
// Ordnerhierarchie gibt es in den Daten nicht. Die frueheren
// Ordner-Navigationszweige liefen deshalb nie an (f.isFolder war immer
// undefined). Statt eine Hierarchie zu erfinden, wird der Pfad als Spalte
// angezeigt — damit sind gleichnamige Dateien unterscheidbar.

async function spOpenDrive(driveId, dateienImIndex, driveName) {
  if (driveId) _spCurrentDriveId = driveId;
  if (driveName !== undefined && driveName !== null) _spCurrentDriveName = driveName;
  if (dateienImIndex !== undefined) _spCurrentDriveFiles = dateienImIndex;

  const wrap = document.getElementById('sp-main');
  wrap.innerHTML = '<div class="spinner">Dateien laden…</div>';
  try {
    const url = `/api/sharepoint/files/${encodeURIComponent(_spCurrentSiteId)}/${encodeURIComponent(_spCurrentDriveId)}`;
    const files = await apiFetch(url);
    _spFilesCache = files;
    renderSPFiles(files);
  } catch (e) { wrap.innerHTML = `<div class="empty">Laden fehlgeschlagen: ${esc(netzFehlerText(e))}</div>`; }
}

function spSortIndicator(field) {
  if (_spSortField !== field) return '';
  return _spSortDir === 'asc' ? ' ▲' : ' ▼';
}

function spToggleSort(field, rerender) {
  if (_spSortField === field) {
    _spSortDir = _spSortDir === 'asc' ? 'desc' : 'asc';
  } else {
    _spSortField = field;
    _spSortDir = field === 'geaendertAm' ? 'desc' : 'asc';
  }
  rerender();
}

/* Sortiert die NORMALISIERTEN Eintraege. Vorher wurde nach
   lastModifiedDateTime sortiert — ein Feld, das der Core nicht liefert;
   die Datumssortierung war damit wirkungslos. */
function spSortItems(items) {
  const dir = _spSortDir === 'asc' ? 1 : -1;
  return [...items].sort((a, b) => {
    if (_spSortField === 'name') return dir * a.name.localeCompare(b.name, 'de');
    if (_spSortField === 'ordner') return dir * a.ordner.localeCompare(b.ordner, 'de');
    return dir * String(a.geaendertAm || '').localeCompare(String(b.geaendertAm || ''));
  });
}

function renderSPFiles(files) {
  const wrap = document.getElementById('sp-main');
  const toolbar = `<div style="padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
    <div style="font-size:13px">
      <span style="cursor:pointer;color:var(--accent)" onclick="spOpenSite('${esc(_spCurrentSiteId)}')">← Bibliotheken</span>
      <span style="color:var(--muted)"> › </span>
      <span>${_spCurrentDriveName ? esc(_spCurrentDriveName) : '<em style="color:var(--muted)">Name nicht erfasst</em>'}</span>
    </div>
    <button class="btn btn-primary" style="font-size:13px" onclick="spUploadModal()">⬆ Upload</button>
  </div>`;

  if (!files.length) { wrap.innerHTML = toolbar + '<div class="empty">Keine Dateien im Index dieser Bibliothek.</div>'; return; }

  const liste = spSortItems(files.map(spDatei));

  /* Der Core begrenzt die Antwort (Standard 100). Das wird benannt statt
     stillschweigend eine Teilliste als vollstaendig darzustellen. */
  const begrenzt = _spCurrentDriveFiles != null && _spCurrentDriveFiles > liste.length;
  const umfang = `<div class="treffer-zeile">${liste.length.toLocaleString('de-DE')} Einträge angezeigt${
    begrenzt ? ' von ' + _spCurrentDriveFiles.toLocaleString('de-DE') + ' im Index — die Serverantwort ist begrenzt. Für ein bestimmtes Dokument die Volltextsuche verwenden.' : ''
  }</div>`;

  const rows = liste.map(f => `<tr>
    <td>
      <div>📄 ${esc(f.name)}</div>
      ${f.ordner ? `<div class="sp-pfad" title="${esc(f.pfad)}">${esc(f.ordner)}</div>` : ''}
      ${f.fehltSeit ? `<div class="sp-fehlt">⚠️ seit ${fmtDate(f.fehltSeit)} nicht mehr in SharePoint gefunden</div>` : ''}
    </td>
    <td style="white-space:nowrap;color:var(--muted);font-size:13px">${f.groesse != null ? fmtSize(f.groesse) : '–'}</td>
    <td style="white-space:nowrap;color:var(--muted);font-size:13px">${f.geaendertAm ? fmtDate(f.geaendertAm) : '–'}</td>
    <td style="white-space:nowrap">${spOeffnenAktion(f.url)}</td>
  </tr>`).join('');

  const thStyle = 'cursor:pointer;user-select:none';
  wrap.innerHTML = toolbar + umfang + `<table>
    <thead><tr>
      <th style="${thStyle}" onclick="spToggleSort('name', () => renderSPFiles(_spFilesCache))">Name und Ordner${spSortIndicator('name')}</th>
      <th>Größe</th>
      <th style="${thStyle}" onclick="spToggleSort('geaendertAm', () => renderSPFiles(_spFilesCache))">Geändert${spSortIndicator('geaendertAm')}</th>
      <th>Aktion</th>

let _spSearchHits = [];

async function spSearch() {
  const input = document.getElementById('sp-search-input');
  const q = (input?.value || '').trim();
  if (!q) return;
  const wrap = document.getElementById('sp-main');
  wrap.innerHTML = '<div class="spinner">Suche…</div>';
  try {
    _spSearchHits = await apiFetch(`/api/sharepoint/search?q=${encodeURIComponent(q)}`);
    _spSearchBegriff = q;
    renderSPSearchHits();
  } catch (e) {
    /* P2-8: "Laden fehlgeschlagen" ist ein eigener Zustand — nicht derselbe
       Kasten wie ein leeres Ergebnis. */
    wrap.innerHTML = zustandBlock('fehler', 'Die SharePoint-Suche ist fehlgeschlagen: ' + netzFehlerText(e),
      { aktion: netzWiederholenKnopf('spSearch()') });
  }
}

function renderSPSearchHits() {
  const wrap = document.getElementById('sp-main');
  const kopf = `<div style="padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px">
    Suche nach „${esc(_spSearchBegriff)}"
  </div>`;
  if (!_spSearchHits.length) {
    wrap.innerHTML = kopf + zustandBlock('keine_treffer',
      'Keine Datei im Dokumentenindex enthält „' + _spSearchBegriff + '". '
      + 'Der Index ist so alt wie der letzte Abgleich — siehe Datenstand oben.');
    return;
  }

  const liste = spSortItems(_spSearchHits.map(spDatei));
  const rows = liste.map(f => `<tr>
    <td>
      <div><strong>${esc(f.name)}</strong></div>
      ${f.ordner ? `<div class="sp-pfad" title="${esc(f.pfad)}">${esc(f.ordner)}</div>` : ''}
    </td>
    <td style="white-space:nowrap;color:var(--muted);font-size:13px">${f.groesse != null ? fmtSize(f.groesse) : '–'}</td>
    <td style="white-space:nowrap;color:var(--muted);font-size:13px">${f.geaendertAm ? fmtDate(f.geaendertAm) : '–'}</td>
    <td style="white-space:nowrap">${spOeffnenAktion(f.url)}</td>
  </tr>`).join('');

  const thStyle = 'cursor:pointer;user-select:none';
  wrap.innerHTML = kopf
    + `<div class="treffer-zeile">${liste.length.toLocaleString('de-DE')} ${liste.length === 1 ? 'Treffer' : 'Treffer'}</div>`
    + `<table>
    <thead><tr>
      <th style="${thStyle}" onclick="spToggleSort('name', renderSPSearchHits)">Datei und Ordner${spSortIndicator('name')}</th>
      <th>Größe</th>
      <th style="${thStyle}" onclick="spToggleSort('geaendertAm', renderSPSearchHits)">Geändert${spSortIndicator('geaendertAm')}</th>
      <th>Aktion</th>

  </table>`;
}

function spUploadModal() {
  if (!_spCurrentSiteId || !_spCurrentDriveId) return meldung('Bitte zuerst eine Site und eine Bibliothek auswählen.', 'error');
  openModal(`
    <h3>📂 SharePoint Upload</h3>
    <label>Datei (max 4 MB)</label>
    <div class="drop-zone" id="sp-upl-drop" onclick="document.getElementById('sp-upl-file').click()">
      Datei hierher ziehen oder klicken
    </div>
    <input type="file" id="sp-upl-file" style="display:none" onchange="spShowFileName()">
    <div id="sp-upl-fname" style="color:var(--muted);font-size:13px;margin-top:4px"></div>
    <label>Pfad (optional, Standard: Dateiname)</label>
    <input type="text" id="sp-upl-path" placeholder="z.B. subfolder/datei.pdf">
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-primary" id="sp-upl-btn" onclick="spUploadFile()">⬆ Hochladen</button>
    </div>
  `);
  const dz = document.getElementById('sp-upl-drop');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => {
    e.preventDefault(); dz.classList.remove('drag-over');
    if (e.dataTransfer.files.length) {
      document.getElementById('sp-upl-file').files = e.dataTransfer.files;
      spShowFileName();
    }
  });
}

function spShowFileName() {
  const f = document.getElementById('sp-upl-file').files[0];
  document.getElementById('sp-upl-fname').textContent = f ? `${f.name} (${fmtSize(f.size)})` : '';
  document.getElementById('sp-upl-drop').textContent = f ? f.name : 'Datei hierher ziehen oder klicken';
}

async function spUploadFile() {
  const fileInput = document.getElementById('sp-upl-file');
  feldFehlerLeeren(['sp-upl-file', 'sp-upl-path']);
  if (!fileInput.files.length) return feldFehler('sp-upl-file', 'Bitte eine Datei auswählen.');
  const file = fileInput.files[0];
  if (file.size > 4 * 1024 * 1024) return feldFehler('sp-upl-file', 'Die Datei ist größer als 4 MB. Bitte eine kleinere Datei wählen.');
  const filePath = document.getElementById('sp-upl-path').value.trim() || file.name;

  const form = new FormData();
  form.append('file', file);
  form.append('siteId', _spCurrentSiteId);
  form.append('driveId', _spCurrentDriveId);
  form.append('path', filePath);

  const btn = document.getElementById('sp-upl-btn');
  btn.disabled = true; btn.textContent = 'Uploading…';
  try {
    const res = await fetch('/dashboard/api/sharepoint/upload?token=' + encodeURIComponent(TOKEN), {
      method: 'POST', body: form,
    });
    if (res.status === 401) { logout(); throw new Error('401'); }
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || `HTTP ${res.status}`); }
    closeModal();
    // Aktuelle Bibliothek neu laden; Name und Umfang bleiben erhalten.
    spOpenDrive();
  } catch (e) { dialogMeldung('Hochladen fehlgeschlagen: ' + netzFehlerText(e)); btn.disabled = false; btn.textContent = '⬆ Hochladen'; }
}

    const name = l.docType === 'sharepoint' ? esc(l.spName || '') : esc(l.localName || '');

}

async function unlinkDoc(linkId, entityType, entityId, refreshFn) {
  if (!confirm('Verknüpfung entfernen?')) return;
  try {
    await apiFetch(`/api/links/${encodeURIComponent(linkId)}`, { method: 'DELETE' });
    if (refreshFn && typeof window[refreshFn] === 'function') window[refreshFn](entityId);
  } catch (e) { meldung('Verknüpfung konnte nicht gelöst werden: ' + netzFehlerText(e), 'error'); }
}

async function searchSpForLink() {
  const q = document.getElementById('ld-search').value.trim();
  const container = document.getElementById('ld-results');
  if (!q) { container.innerHTML = '<span style="color:var(--muted)">Suchbegriff eingeben</span>'; return; }
  container.innerHTML = '<span style="color:var(--muted)">Suche läuft…</span>';
  try {
    const results = await apiFetch(`/api/links/search/sp?q=${encodeURIComponent(q)}`);
    if (!results.length) { container.innerHTML = '<span style="color:var(--muted)">Keine Treffer</span>'; return; }
    window._spLinkResults = results;
    container.innerHTML = results.map((r, i) => `
      <div style="padding:8px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:8px"
           onclick="selectSpForLink(${i})"
           onmouseover="this.style.background='var(--hover)'" onmouseout="this.style.background=''">
        <span>☁️</span>
        <div style="flex:1">
          <div style="font-weight:500">${esc(r.name)}</div>
          <div style="color:var(--muted);font-size:13px">${esc(r.siteName)} › ${esc(r.path)}</div>
        </div>
        <span style="color:var(--muted);font-size:13px">${fmtSize(r.size)}</span>
      </div>
    `).join('');
  } catch (e) { container.innerHTML = `<span style="color:red">Fehler: ${esc(netzFehlerText(e))}</span>`; }
}

async function unlinkAndReload(linkId) {
  if (!confirm('Verknüpfung entfernen?')) return;
  try {
    await apiFetch(`/api/links/${encodeURIComponent(linkId)}`, { method: 'DELETE' });
    // Reload current tab
    const activeTab = document.querySelector('.tab.active')?.dataset?.tab;
    if (activeTab) showTab(activeTab);
  } catch (e) { meldung('Aktion fehlgeschlagen: ' + netzFehlerText(e), 'error'); }
}

async function selectSpForLink(idx) {
  const r = window._spLinkResults?.[idx];

  const label = document.getElementById('ld-label').value.trim() || r.name;
  const entityType = document.getElementById('ld-entityType').value;
  const entityId = document.getElementById('ld-entityId').value;

  } catch (e) { dialogMeldung('Verknüpfung konnte nicht gespeichert werden: ' + netzFehlerText(e)); }
}

function _instaTypeIcon(t) { return { reel: '🎬', carousel: '📸', image: '🖼️', story: '📱' }[t] || '📄'; }

function _instaStatusBadge(s) {
  const m = {
    idea: ['badge-muted','Idee'], draft: ['badge-blue','Entwurf'], review: ['badge-yellow','Review'],
    ready: ['badge-green','Bereit'], published: ['badge-green','Live'],
    active: ['badge-blue','Aktiv'], closed: ['badge-muted','Geschlossen'],
    scanning: ['badge-yellow','Wird gescannt'], scanned: ['badge-green','Gescannt'],
    crafting: ['badge-yellow','In Craft'], cutting: ['badge-yellow','Wird geschnitten'],
    cut_done: ['badge-green','Geschnitten'],
    entwurf: ['badge-blue','Entwurf'], freigegeben: ['badge-yellow','Freigegeben'],
    'veröffentlicht': ['badge-green','Live']
  };
  const [cls, lbl] = m[s] || m.idea;
  return `<span class="badge ${cls}">${lbl}</span>`;
}

function _instaMiniSvg(data, color, h) {
  const vals = data.map(d => d.v);
  const min = Math.min(...vals) * 0.995, max = Math.max(...vals) * 1.005, w = 200;
  /* P2-3: links und rechts drei Einheiten Rand lassen — der Punkt auf dem
     juengsten Wert sass genau auf der Kante und wurde zur Haelfte
     abgeschnitten. */
  const rand = 3;
  const pts = vals.map((v, i) => ({
    x: rand + (i / (vals.length - 1)) * (w - 2 * rand),
    y: rand + (h - 2 * rand) - ((v - min) / (max - min)) * (h - 2 * rand),
  }));
  const line = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">
    <!-- Flaeche unter der Linie: Deckkraft als Attribut, nicht als
         Hex-Alpha am Farbwert — mit var(--…) waere "${color}15" ungueltig. -->
    <path d="${line} L${w - rand},${h} L${rand},${h} Z" fill="${color}" fill-opacity="0.12"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="3" fill="${color}"/>
  </svg>`;
}

let _instaSubTab = 'overview';
let _instaMediaCache = null;
let _instaDraftsCache = null;
let _instaInsightsCache = null;
let _instaForensicsCache = null;

async function loadInstagram() {
  const c = document.getElementById('content');

  if (!_instaMediaCache) {
    try { _instaMediaCache = await apiFetch('/api/instagram/media'); } catch { _instaMediaCache = null; }
  }
  if (!_instaDraftsCache) {
    try { _instaDraftsCache = await apiFetch('/api/instagram/drafts'); } catch { _instaDraftsCache = []; }
  }
  if (!_instaInsightsCache) {
    try { _instaInsightsCache = await apiFetch('/api/instagram/insights'); } catch { _instaInsightsCache = null; }
  }
  if (!_instaForensicsCache) {
    try { _instaForensicsCache = await apiFetch('/api/instagram/forensics'); } catch { _instaForensicsCache = null; }
  }
  /* Token-Restlaufzeit kommt aus derselben Quelle wie der Status-Bereich
     (Core /api/system-status -> Tabelle insta_tokens). Der frueher hier
     hartcodierte Wert 55 Tage war ein Mock-Wert und wich vom echten ab. */
  let metaToken = null;
  let tokenZustand = 'unbekannt';
  try {
    const sys = await apiFetch('/api/dashboard/status');
    metaToken = (sys.tokens || []).find(t => t.name === 'Meta') || null;
    tokenZustand = sys._stale ? 'degradiert' : 'erreichbar';
  } catch { tokenZustand = 'getrennt'; }

  /* Datenstaende der drei Instagram-Quellen — jede hat ihr eigenes Alter. */
  const medienStand    = _instaMediaCache ? (_instaMediaCache.datenstand || _instaMediaCache.fetched_at || null) : null;
  const insightsStand  = _instaInsightsCache ? (_instaInsightsCache.datenstand || _instaInsightsCache.fetched_at || null) : null;
  const forensicStand  = _instaForensicsCache?.forensic
    ? (_instaForensicsCache.datenstand || _instaForensicsCache.forensic.analysis_timestamp || null) : null;
  const kontoName = _instaForensicsCache?.forensic?.account?.username || '';

  const tabBtn = (id, label) => `<button onclick="_instaSubTab='${id}';loadInstagram()" style="
    background:none;border:none;border-bottom:2px solid ${_instaSubTab === id ? 'var(--accent)' : 'transparent'};
    color:${_instaSubTab === id ? 'var(--text)' : 'var(--muted)'};padding:8px 16px;font-size:13px;font-weight:600;
    cursor:pointer;font-family:var(--font);margin-bottom:-1px">${label}</button>`;

  const tokenTage = metaToken ? metaToken.days_remaining : null;
  const tokenColor = tokenTage == null ? 'var(--muted)' : tokenTage > 30 ? 'var(--green)' : tokenTage > 7 ? 'var(--yellow)' : 'var(--red)';
  const tokenBg = tokenTage == null ? 'var(--surface-2)' : tokenTage > 30 ? 'var(--green-weak)' : tokenTage > 7 ? 'var(--yellow-weak)' : 'var(--red-weak)';
  const tokenText = tokenTage == null ? 'Token: unbekannt' : 'Token: ' + tokenTage + ' Tage';

  let header = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:36px;height:36px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px">📷</div>
      <div>
        <div style="font-size:16px;font-weight:700">Instagram</div>
        <div style="font-size:13px;color:var(--muted)">${kontoName ? '@' + esc(kontoName) : 'Konto nicht ermittelbar'}</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span style="background:${tokenBg};color:${tokenColor};padding:4px 10px;border-radius:6px;font-size:13px;font-weight:600"
            title="Restlaufzeit des Meta-Zugangs. Quelle: Systemstatus.">🔑 ${esc(tokenText)}</span>
      <button class="btn" style="font-size:13px;padding:5px 12px;background:var(--surface);border:1px solid var(--border);color:var(--muted);cursor:not-allowed"
              disabled title="Abgleich wird nicht aus dem Dashboard ausgelöst. Befehl /instasync im Telegram-Bot.">↻ Abgleich nur per /instasync</button>
    </div>
  </div>`;

  let tabs = `<div class="insta-subtabs" style="gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border)">
    ${tabBtn('overview','Übersicht')}${tabBtn('content','Content-Plan')}${tabBtn('drafts','Entwürfe')}${tabBtn('raw','📁 Rohmaterial')}${tabBtn('analytics','Analyse')}${tabBtn('forensic','🔍 Prüfdaten')}
  </div>`;

  let body = '';

  if (_instaSubTab === 'overview') {
    const feedItems = (_instaMediaCache?.items || []).slice(0, 12);
    const liveFeed = feedItems.length ? `
      <div class="card card-pad" style="margin-bottom:20px">
        <div style="font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:14px">Aktuelle Beiträge</div>
        <div class="insta-grid">
          ${feedItems.map(p => {
            const rawThumb = p.thumbnail_url || p.media_url || '';
            const thumb = rawThumb ? '/dashboard/api/instagram/media-proxy?url=' + encodeURIComponent(rawThumb) + '&token=' + encodeURIComponent(TOKEN) : '';
            const icon = _instaTypeIcon(p.media_type === 'VIDEO' ? 'reel' : p.media_type === 'CAROUSEL_ALBUM' ? 'carousel' : 'image');
            const likes = (p.like_count || 0).toLocaleString('de-DE');
            const placeholder = `<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--surface-2);color:var(--muted)">
              <span style="font-size:32px">${icon}</span>
              <span style="font-size:13px;font-weight:600">❤️ ${likes}</span>
            </div>`;
            const imgTag = thumb
              ? `<img src="${esc(thumb)}" alt="" loading="lazy" onerror="var p=this.parentNode;p.querySelector('.ig-placeholder').style.display='flex';p.querySelector('.ig-likes').style.display='none';this.style.display='none'">`
              : '';
            const showPlaceholder = !thumb;
            return `<a href="${esc(p.permalink)}" target="_blank" rel="noopener" class="insta-grid-item" title="${esc((p.caption || '').slice(0, 80))}">
              ${imgTag}
              <div class="ig-placeholder" style="display:${showPlaceholder ? 'flex' : 'none'};position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--surface-2);color:var(--muted)">
                <span style="font-size:32px">${icon}</span>
                <span style="font-size:13px;font-weight:600">❤️ ${likes}</span>
              </div>
              <span class="ig-type">${icon}</span>
              <span class="ig-likes">❤️ ${likes}</span>
            </a>`;
          }).join('')}
        </div>
        ${(() => {
          const fetchedAt = _instaMediaCache?.fetched_at;
          if (!fetchedAt) return '';
          /* C5 (Phase 3): eigene Tagesrechnung entfernt. altersText() zaehlt
             Kalendertage der Ortszeit und unterscheidet heute/gestern. */
          const ageStr = altersText(fetchedAt);
          return `<div style="font-size:13px;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:6px">
            <span>🔄 Zuletzt synchronisiert: ${ageStr}</span>
            <span style="opacity:.5">·</span>
            <span>Aktualisieren mit <code style="background:var(--surface-2);padding:2px 6px;border-radius:4px;font-size:13px">/instasync</code> im Telegram-Bot</span>
          </div>`;
        })()}
      </div>` : '';

    /* P2-2: `min-width: 0` liess die vier Kacheln schmal auf 45 px schrumpfen,
       statt umzubrechen — Beschriftung und Untertitel wurden abgeschnitten.
       Mit 150 px Mindestbreite brechen sie bei 390 px auf zwei Reihen um und
       stehen auf dem Desktop weiterhin nebeneinander. */
    const kpi = (label, value, trend, sub, chart) => `<div class="s-card" style="flex:1 1 150px;min-width:150px">
      <div class="lbl">${label}</div>
      <div style="display:flex;align-items:baseline;gap:8px">
        <span class="val" style="font-size:26px">${value}</span>
        ${trend ? `<span style="color:${trend.startsWith('+') ? 'var(--green)' : 'var(--red)'};font-size:13px;font-weight:600">${trend}</span>` : ''}
      </div>
      ${sub ? `<div class="sub">${sub}</div>` : ''}
      ${chart ? `<div style="margin-top:10px">${chart}</div>` : ''}
    </div>`;

    const ins = _instaInsightsCache || {};
    const hasInsights = ins.followers_count != null;
    /* Untertitel nennt den tatsaechlichen Datenstand. Vorher stand hier
       "Ø letzte 30 Tage" — die Werte sind aber so alt wie der Insights-Cache. */
    const insightsSub = hasInsights
      ? 'Insights, Stand ' + datenstandZeitpunktText(insightsStand) + ' (' + altersText(insightsStand) + ')'
      : 'Keine Daten';

    body = `
      <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap">
        ${kpi('Follower', hasInsights ? Number(ins.followers_count).toLocaleString('de-DE') : '–', null, insightsSub, '')}
        ${kpi('Engagement', hasInsights && ins.engagement_rate != null ? Number(ins.engagement_rate) + '%' : '–', null, insightsSub, '')}
        ${kpi('Ø Likes', hasInsights && ins.recent_avg_likes != null ? Math.round(Number(ins.recent_avg_likes)).toLocaleString('de-DE') : '–', null, 'pro Beitrag · ' + insightsSub, '')}
        ${kpi('Beiträge', hasInsights && ins.media_count != null ? Number(ins.media_count).toLocaleString('de-DE') : '–', null, 'gesamt · ' + insightsSub, '')}
      </div>` + liveFeed + `

      <div class="card card-pad" style="margin-bottom:16px">
        <div style="font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:14px">Top-Beiträge</div>
        ${keineAktuellenDaten(medienStand, 'Eine Auswertung der Beitragsleistung gibt es erst nach einem neuen Abgleich.')}
      </div>

      <div class="card card-pad">
        <div style="font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:14px">Quick Insights</div>
        ${keineAktuellenDaten(medienStand, 'Beste Zeit zum Veröffentlichen, bestes Format und Wachstum werden erst nach einem neuen Abgleich berechnet.')}
      </div>`;
  }

  if (_instaSubTab === 'content') {
    /* Der frueher hier gezeigte Content-Kalender stammte vollstaendig aus
       _INSTA_MOCK: Kalenderwochen ohne Jahr und Verweise auf Entwuerfe
       (insta-001, insta-002), die im echten Bestand nicht existieren.
       P1-1 hat ihn nach Owner-Entscheidung Nr. 2 ausgeblendet; P2-7 baut ihn
       aus dem echten Entwurfsbestand auf (public/js/instagram-material.js). */
    body = `<div class="card card-pad">
      <div style="font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:16px">Content-Plan</div>
      ${instaContentPlanHtml(_instaDraftsCache)}
    </div>`;
  }

  if (_instaSubTab === 'drafts') {
    const drafts = _instaDraftsCache || [];
    if (!drafts.length) {
      body = '<div class="card card-pad" style="text-align:center;color:var(--muted)">Keine Drafts vorhanden.</div>';
    } else {
      body = drafts.map(dr => {
        const captionPreview = (dr.caption || '').length > 200 ? dr.caption.slice(0, 200) + '…' : (dr.caption || '');
        const hashtags = Array.isArray(dr.hashtags) ? dr.hashtags : [];
        const hashtagDisplay = hashtags.length ? hashtags.map(h => h.startsWith('#') ? h : '#' + h).join(' ') : '';
        /* P2-7: vorher ein rohes ISO-Datum (`createdAt.slice(0,10)`).
           Jetzt deutsches Format mit Jahr und benannter Bedeutung — und wenn
           kein Veröffentlichungszeitpunkt hinterlegt ist, steht das da,
           statt das Erstellungsdatum als Termin auszugeben. */
        const dateStr = dr.scheduledFor
          ? 'geplant ' + fmtDate(dr.scheduledFor)
          : (dr.createdAt ? 'erstellt ' + fmtDate(dr.createdAt) + ' · kein Termin hinterlegt' : 'ohne Datum');
        const instaLink = dr.instagram_url ? `<a href="${esc(dr.instagram_url)}" target="_blank" style="color:var(--accent);text-decoration:none;font-size:13px">📸 Instagram</a>` : '';
        const safeId = esc(dr.id).replace(/'/g, "\\'");
        return `<div class="card card-pad" style="margin-bottom:12px" id="draft-card-${esc(dr.id)}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:20px">${dr.status === 'veröffentlicht' ? '📸' : dr.status === 'freigegeben' ? '✅' : '📝'}</span>
            <div>
              <div style="font-size:14px;font-weight:600;font-family:monospace">${esc(dr.id)}</div>
              <div style="font-size:13px;color:var(--muted);margin-top:2px">${esc(dateStr)}${dr.mediaPath ? ' · 📎 Media' : ''}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            ${instaLink}
            ${_instaStatusBadge(dr.status)}
          </div>
        </div>
        <div style="background:var(--surface-2);border-radius:6px;padding:14px;font-size:13px;color:var(--text-soft);line-height:1.6;margin-bottom:${hashtagDisplay ? '10' : '0'}px;border-left:3px solid var(--border)">${esc(captionPreview)}</div>
        ${hashtagDisplay ? `<div style="font-size:13px;color:var(--accent);word-break:break-all;margin-bottom:10px">${esc(hashtagDisplay)}</div>` : ''}

        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
          <button class="btn" style="font-size:13px;padding:4px 10px;background:var(--surface);border:1px solid var(--border);color:var(--text)" onclick="_instaDraftEdit('${safeId}')">✏️ Bearbeiten</button>
          <button class="btn" style="font-size:13px;padding:4px 10px;background:var(--surface);border:1px solid var(--border);color:var(--text)" onclick="_instaDraftPost('${safeId}')">📤 Freigeben</button>
          <button class="btn" style="font-size:13px;padding:4px 10px;background:var(--surface);border:1px solid var(--border);color:var(--text)" onclick="_instaDraftManualToggle('${safeId}')">📋 Manuell posten</button>
          <button aria-label="Entwurf löschen" title="Entwurf löschen" class="btn" style="font-size:13px;padding:4px 10px;background:var(--surface);border:1px solid var(--red);color:var(--red)" onclick="_instaDraftDelete('${safeId}')">🗑️</button>
        </div>

        <div id="manual-post-${esc(dr.id)}" style="display:none;margin-top:12px;background:var(--surface-2);border-radius:8px;padding:16px;border:1px solid var(--border)"></div>
      </div>`;
      }).join('');
    }
  }

  if (_instaSubTab === 'analytics') {
    /* Der komplette Analyse-Unterbereich war Demodaten: Follower-Entwicklung
       und Engagement-Rate aus _INSTA_MOCK, "Performance nach Content-Typ" aus
       einem Inline-Literal, und der Absatz unter der Ueberschrift
       "KI-Empfehlung" war ein fester Text ohne jede KI-Beteiligung.
       Owner-Entscheidung Nr. 2: ausblenden. Echte Auswertung: P2-7.
       Belastbare Zahlen stehen bis dahin im Unterbereich "Forensic" — mit
       eigenem Datenstand. */
    body = `<div class="card card-pad">
      <div style="font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:16px">Analyse</div>

  if (_instaSubTab === 'forensic') {
    body = '<div id="forensicContent"><div class="spinner">Laden…</div></div>';
    setTimeout(() => _instaLoadForensic(), 0);
  }

  if (_instaSubTab === 'raw') {
    body = '<div id="rawContent"><div class="spinner">Laden…</div></div>';
    setTimeout(() => _instaLoadRaw(), 0);
  }

  c.innerHTML = header + tabs + body;
  /* P2-7: Sprung aus dem Content-Plan — den gemeinten Entwurf hervorheben. */
  if (_instaSubTab === 'drafts') setTimeout(instaEntwurfHervorhebung, 0);
  stamp();
  /* Drei Quellen, drei Datenstaende — der Nutzer soll nicht raten muessen,
     welcher Block wie alt ist. */
  setDatenstand([
    { quelle: 'Instagram-Medien (Live-Feed)', stand: medienStand, abgleich: medienStand,
      hinweis: 'Abgleich nur manuell per /instasync im Telegram-Bot.' },
    { quelle: 'Instagram-Insights (Kennzahlen)', stand: insightsStand, abgleich: insightsStand },
    { quelle: 'Instagram-Forensic', stand: forensicStand, abgleich: forensicStand },
    { quelle: 'Meta-Token', live: true,
      zustand: tokenZustand === 'getrennt' ? 'getrennt' : (tokenZustand === 'degradiert' ? 'degradiert' : 'aktuell'),
      stand: new Date().toISOString(),
      hinweis: metaToken
        ? 'Restlaufzeit ' + metaToken.days_remaining + ' Tage. Quelle: Systemstatus.'
        : 'Restlaufzeit nicht ermittelbar — Status-Quelle nicht erreichbar.' },
  ]);
}

async function _instaLoadForensic() {
  const wrap = document.getElementById('forensicContent');
  if (!wrap) return;
  try {
    if (!_instaForensicsCache) {
      _instaForensicsCache = await apiFetch('/api/instagram/forensics');
    }
    const { forensic, demographics } = _instaForensicsCache || {};
    if (!forensic && !demographics) {
      wrap.innerHTML = '<div class="card card-pad" style="text-align:center;color:var(--muted)">Keine Forensic-Daten vorhanden.</div>';
      return;
    }

    let html = '';

    // 1. Follower growth bar chart
    if (forensic?.window?.follower_daily?.length) {
      const fd = forensic.window.follower_daily;
      const maxVal = Math.max(...fd.map(x => Number(x.value) || 0), 1);
      const median = Number(forensic.window.follower_median) || 1;
      const threshStr = String(forensic.window.spike_threshold || '');
      const threshMatch = threshStr.match(/>\s*(\d+)/);
      const threshold = threshMatch ? Number(threshMatch[1]) : (median * 3);
      const schmal = window.innerWidth < 640;
      const bars = fd.map((item, idx) => {
        const val = Number(item.value) || 0;
        const h = Math.max(Math.round((val / maxVal) * 140), 2);
        const isSpike = val > threshold;
        const color = isSpike ? 'var(--red)' : 'var(--accent)';
        /* P2-3: schmal nur jede zweite Datumsbeschriftung — sonst ueberlappen
           die gedrehten Texte. Der jüngste Balken ist immer beschriftet. */
        const zeigeDatum = !schmal || idx % 2 === 1 || idx === fd.length - 1;
        const dateLabel = item.date && zeigeDatum ? item.date.slice(5) : '';
        return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0">
          <span style="font-size:13px;color:${isSpike ? 'var(--red)' : 'var(--muted)'};font-weight:${isSpike ? '700' : '400'}">${val > 0 ? '+' + val : val}</span>
          <div style="width:80%;height:${h}px;background:${color};border-radius:3px 3px 0 0;opacity:${isSpike ? 1 : 0.7}"></div>
          <span style="font-size:13px;color:var(--muted);transform:rotate(-45deg);white-space:nowrap">${dateLabel}</span>
        </div>`;
      }).join('');

      html += `<div class="card card-pad" style="margin-bottom:16px">
        <div style="font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:14px">Follower-Wachstum (${forensic.window.days || 14} Tage)</div>
        <div style="display:flex;align-items:flex-end;height:180px;gap:2px;padding-bottom:24px">${bars}</div>
        <div style="font-size:13px;color:var(--muted);margin-top:8px">Median: +${forensic.window.follower_median}/Tag · Spike-Schwelle: ${esc(String(forensic.window.spike_threshold || ''))}</div>
      </div>`;
    }

    // 2. Reach curve
    if (forensic?.window?.reach_daily?.length) {
      const rd = forensic.window.reach_daily.map(r => ({ d: r.date ? r.date.slice(5) : '', v: Number(r.reach) || 0 }));
      html += `<div class="card card-pad" style="margin-bottom:16px">
        <div style="font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:14px">Reichweite (täglich)</div>
        ${_instaMiniSvg(rd, 'var(--orange)', 100)}
        <div style="display:flex;justify-content:space-between;margin-top:6px">${rd.filter((_, i) => i % 3 === 0 || i === rd.length - 1).map(p => `<span style="font-size:13px;color:var(--muted)">${p.d}</span>`).join('')}</div>
      </div>`;
    }

    // 3. Spike table
    if (forensic?.spikes?.length) {
      const spikeCards = forensic.spikes.map(sp => {
        const isVerd = (sp.classification || '').toUpperCase().includes('VERDAECHTIG');
        const badgeCls = isVerd ? 'badge-red' : 'badge-green';
        const badgeLbl = isVerd ? 'Verdächtig' : 'Organisch';
        let reasoning = sp.reasoning;
        if (typeof reasoning === 'string') { try { reasoning = JSON.parse(reasoning); } catch { reasoning = [reasoning]; } }
        if (!Array.isArray(reasoning)) reasoning = [];
        const contentPosts = Array.isArray(sp.content_window) ? sp.content_window : [];
        return `<div class="card card-pad" style="margin-bottom:12px;border-left:3px solid ${isVerd ? 'var(--red)' : 'var(--green)'}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div>
              <span style="font-weight:700;font-size:14px">${esc(sp.date || '')}</span>
              <span style="margin-left:10px;font-size:13px;color:var(--muted)">+${Number(sp.delta_followers || sp.delta || sp.follower_delta || 0).toLocaleString('de-DE')} Follower</span>
              <span style="margin-left:10px;font-size:13px;color:var(--muted)">${sp.multiple_of_median != null ? Number(sp.multiple_of_median).toFixed(1) + '× Median' : ''}</span>
            </div>
            <span class="badge ${badgeCls}">${badgeLbl}</span>
          </div>
          ${reasoning.length ? `<ul style="margin:0 0 10px 16px;padding:0;font-size:13px;color:var(--muted);line-height:1.7">${reasoning.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
          ${contentPosts.length ? `<div style="font-size:13px;color:var(--muted);margin-top:6px">
            <span style="font-weight:600">Content im Zeitfenster:</span>
            ${contentPosts.slice(0, 3).map(cp => `<div style="margin-top:4px;padding-left:8px;border-left:2px solid var(--border)">
              ${cp.permalink ? `<a href="${esc(cp.permalink)}" target="_blank" style="color:var(--accent);text-decoration:none">${esc((cp.caption || '').slice(0, 60))}${(cp.caption || '').length > 60 ? '…' : ''}</a>` : esc((cp.caption || '').slice(0, 60))}
            </div>`).join('')}
          </div>` : ''}
        </div>`;
      }).join('');

      html += `<div style="margin-bottom:16px">
        <div style="font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:14px">Erkannte Spikes (${forensic.spikes.length})</div>
        ${spikeCards}
      </div>`;
    }

    // 4. Demographics
    if (demographics) {
      let demoHtml = '';

      // Top 10 countries
      if (demographics.countries?.length) {
        const top10 = demographics.countries.slice(0, 10);
        const maxC = Number(top10[0]?.count) || 1;
        const countryBars = top10.map(c => {
          const cnt = Number(c.count) || 0;
          const pct = Math.round((cnt / maxC) * 100);
          const flag = _countryFlags[c.name] || '🏳️';
          return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span style="width:32px;font-size:14px;text-align:center">${flag}</span>
            <span style="width:28px;font-size:13px;font-weight:600">${esc(c.name)}</span>
            <div style="flex:1;height:18px;background:var(--surface-2);border-radius:4px;overflow:hidden">
              <div style="height:100%;width:${pct}%;background:var(--accent);border-radius:4px"></div>
            </div>
            <span style="width:50px;text-align:right;font-size:13px;color:var(--muted)">${cnt.toLocaleString('de-DE')}</span>
          </div>`;
        }).join('');
        demoHtml += `<div style="flex:1;min-width:280px">
          <div style="font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:12px">Top-Länder</div>
          ${countryBars}
        </div>`;
      }

      // Top 10 cities
      if (demographics.cities?.length) {
        const cityList = demographics.cities.slice(0, 10).map((c, i) => {
          const cityName = c.name.split(',')[0].trim();
          return `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-size:13px">
            <span><span style="color:var(--muted);margin-right:6px">${i + 1}.</span>${esc(cityName)}</span>
            <span style="color:var(--muted)">${Number(c.count || 0).toLocaleString('de-DE')}</span>
          </div>`;
        }).join('');
        demoHtml += `<div style="flex:1;min-width:240px">
          <div style="font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:12px">Top-Städte</div>
          ${cityList}
        </div>`;
      }

      // Age groups
      if (demographics.age_gender?.length) {
        const ages = demographics.age_gender;
        const maxA = Math.max(...ages.map(a => Number(a.count) || 0), 1);
        const ageBars = ages.map(a => {
          const cnt = Number(a.count) || 0;
          const pct = Math.round((cnt / maxA) * 100);
          return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span style="width:52px;font-size:13px;font-weight:600;text-align:right">${esc(a.name)}</span>
            <div style="flex:1;height:18px;background:var(--surface-2);border-radius:4px;overflow:hidden">
              <div style="height:100%;width:${pct}%;background:var(--violet);border-radius:4px"></div>
            </div>
            <span style="width:50px;text-align:right;font-size:13px;color:var(--muted)">${cnt.toLocaleString('de-DE')}</span>
          </div>`;
        }).join('');
        demoHtml += `<div style="flex:1;min-width:280px">
          <div style="font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:12px">Altersgruppen</div>
          ${ageBars}
        </div>`;
      }

      if (demoHtml) {
        html += `<div class="card card-pad" style="margin-bottom:16px">
          <div style="font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:14px">Demografie</div>
          <div style="display:flex;gap:24px;flex-wrap:wrap">${demoHtml}</div>
          ${demographics.timestamp ? `<div style="font-size:13px;color:var(--muted);margin-top:12px">Stand: ${new Date(demographics.timestamp).toLocaleDateString('de-DE')}</div>` : ''}
        </div>`;
      }
    }

    if (!html) html = '<div class="card card-pad" style="text-align:center;color:var(--muted)">Keine Forensic-Daten vorhanden.</div>';
    wrap.innerHTML = html;
  } catch (e) {
    wrap.innerHTML = `<div class="card card-pad" style="color:var(--red)">Fehler: ${esc(netzFehlerText(e))}</div>`;
  }
}
