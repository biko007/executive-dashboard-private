async function _instaLoadForensic() {
  const wrap = document.getElementById('forensicContent');
  if (!wrap) return;
  try {
    if (!_instaForensicsCache) {
      _instaForensicsCache = await apiFetch('/api/instagram/forensics');
    }
    const { forensic, demographics } = _instaForensicsCache || {};
    if (!forensic && !demographics) {
      wrap.innerHTML = '<div class="card card-pad" style="text-align:center;color:var(--muted)">Keine Forensic-Daten vorhanden.</div>';
      return;
    }

    let html = '';

    // 1. Follower growth bar chart
    if (forensic?.window?.follower_daily?.length) {
      const fd = forensic.window.follower_daily;
      const maxVal = Math.max(...fd.map(x => Number(x.value) || 0), 1);
      const median = Number(forensic.window.follower_median) || 1;
      const threshStr = String(forensic.window.spike_threshold || '');
      const threshMatch = threshStr.match(/>\s*(\d+)/);
      const threshold = threshMatch ? Number(threshMatch[1]) : (median * 3);
      const bars = fd.map(item => {
        const val = Number(item.value) || 0;
        const h = Math.max(Math.round((val / maxVal) * 140), 2);
        const isSpike = val > threshold;
        const color = isSpike ? 'var(--red)' : 'var(--accent)';
        const dateLabel = item.date ? item.date.slice(5) : '';
        return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0">
          <span style="font-size:10px;color:${isSpike ? 'var(--red)' : 'var(--muted)'};font-weight:${isSpike ? '700' : '400'}">${val > 0 ? '+' + val : val}</span>
          <div style="width:80%;height:${h}px;background:${color};border-radius:3px 3px 0 0;opacity:${isSpike ? 1 : 0.7}"></div>
          <span style="font-size:9px;color:var(--muted);transform:rotate(-45deg);white-space:nowrap">${dateLabel}</span>
        </div>`;
      }).join('');

      html += `<div class="card card-pad" style="margin-bottom:16px">
        <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:14px">Follower-Wachstum (${forensic.window.days || 14} Tage)</div>
        <div style="display:flex;align-items:flex-end;height:180px;gap:2px;padding-bottom:24px">${bars}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:8px">Median: +${forensic.window.follower_median}/Tag · Spike-Schwelle: ${esc(String(forensic.window.spike_threshold || ''))}</div>
      </div>`;
    }

    // 2. Reach curve
    if (forensic?.window?.reach_daily?.length) {
      const rd = forensic.window.reach_daily.map(r => ({ d: r.date ? r.date.slice(5) : '', v: Number(r.reach) || 0 }));
      html += `<div class="card card-pad" style="margin-bottom:16px">
        <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:14px">Reichweite (täglich)</div>
        ${_instaMiniSvg(rd, '#f59e0b', 100)}
        <div style="display:flex;justify-content:space-between;margin-top:6px">${rd.filter((_, i) => i % 3 === 0 || i === rd.length - 1).map(p => `<span style="font-size:10px;color:var(--muted)">${p.d}</span>`).join('')}</div>
      </div>`;
    }

    // 3. Spike table
    if (forensic?.spikes?.length) {
      const spikeCards = forensic.spikes.map(sp => {
        const isVerd = (sp.classification || '').toUpperCase().includes('VERDAECHTIG');
        const badgeCls = isVerd ? 'badge-red' : 'badge-green';
        const badgeLbl = isVerd ? 'Verdächtig' : 'Organisch';
        let reasoning = sp.reasoning;
        if (typeof reasoning === 'string') { try { reasoning = JSON.parse(reasoning); } catch { reasoning = [reasoning]; } }
        if (!Array.isArray(reasoning)) reasoning = [];
        const contentPosts = Array.isArray(sp.content_window) ? sp.content_window : [];
        return `<div class="card card-pad" style="margin-bottom:12px;border-left:3px solid ${isVerd ? 'var(--red)' : 'var(--green)'}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div>
              <span style="font-weight:700;font-size:14px">${esc(sp.date || '')}</span>
              <span style="margin-left:10px;font-size:13px;color:var(--muted)">+${Number(sp.delta_followers || sp.delta || sp.follower_delta || 0).toLocaleString('de-DE')} Follower</span>
              <span style="margin-left:10px;font-size:12px;color:var(--muted)">${sp.multiple_of_median != null ? Number(sp.multiple_of_median).toFixed(1) + '× Median' : ''}</span>
            </div>
            <span class="badge ${badgeCls}">${badgeLbl}</span>
          </div>
          ${reasoning.length ? `<ul style="margin:0 0 10px 16px;padding:0;font-size:12px;color:var(--muted);line-height:1.7">${reasoning.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
          ${contentPosts.length ? `<div style="font-size:11px;color:var(--muted);margin-top:6px">
            <span style="font-weight:600">Content im Zeitfenster:</span>
            ${contentPosts.slice(0, 3).map(cp => `<div style="margin-top:4px;padding-left:8px;border-left:2px solid var(--border)">
              ${cp.permalink ? `<a href="${esc(cp.permalink)}" target="_blank" style="color:var(--accent);text-decoration:none">${esc((cp.caption || '').slice(0, 60))}${(cp.caption || '').length > 60 ? '…' : ''}</a>` : esc((cp.caption || '').slice(0, 60))}
            </div>`).join('')}
          </div>` : ''}
        </div>`;
      }).join('');

      html += `<div style="margin-bottom:16px">
        <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:14px">Erkannte Spikes (${forensic.spikes.length})</div>
        ${spikeCards}
      </div>`;
    }

    // 4. Demographics
    if (demographics) {
      let demoHtml = '';

      // Top 10 countries
      if (demographics.countries?.length) {
        const top10 = demographics.countries.slice(0, 10);
        const maxC = Number(top10[0]?.count) || 1;
        const countryBars = top10.map(c => {
          const cnt = Number(c.count) || 0;
          const pct = Math.round((cnt / maxC) * 100);
          const flag = _countryFlags[c.name] || '🏳️';
          return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span style="width:32px;font-size:14px;text-align:center">${flag}</span>
            <span style="width:28px;font-size:12px;font-weight:600">${esc(c.name)}</span>
            <div style="flex:1;height:18px;background:var(--bg);border-radius:4px;overflow:hidden">
              <div style="height:100%;width:${pct}%;background:var(--accent);border-radius:4px;opacity:.7"></div>
            </div>
            <span style="width:50px;text-align:right;font-size:12px;color:var(--muted)">${cnt.toLocaleString('de-DE')}</span>
          </div>`;
        }).join('');
        demoHtml += `<div style="flex:1;min-width:280px">
          <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:12px">Top-Länder</div>
          ${countryBars}
        </div>`;
      }

      // Top 10 cities
      if (demographics.cities?.length) {
        const cityList = demographics.cities.slice(0, 10).map((c, i) => {
          const cityName = c.name.split(',')[0].trim();
          return `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-size:12px">
            <span><span style="color:var(--muted);margin-right:6px">${i + 1}.</span>${esc(cityName)}</span>
            <span style="color:var(--muted)">${Number(c.count || 0).toLocaleString('de-DE')}</span>
          </div>`;
        }).join('');
        demoHtml += `<div style="flex:1;min-width:240px">
          <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:12px">Top-Städte</div>
          ${cityList}
        </div>`;
      }

      // Age groups
      if (demographics.age_gender?.length) {
        const ages = demographics.age_gender;
        const maxA = Math.max(...ages.map(a => Number(a.count) || 0), 1);
        const ageBars = ages.map(a => {
          const cnt = Number(a.count) || 0;
          const pct = Math.round((cnt / maxA) * 100);
          return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span style="width:52px;font-size:12px;font-weight:600;text-align:right">${esc(a.name)}</span>
            <div style="flex:1;height:18px;background:var(--bg);border-radius:4px;overflow:hidden">
              <div style="height:100%;width:${pct}%;background:#a78bfa;border-radius:4px;opacity:.7"></div>
            </div>
            <span style="width:50px;text-align:right;font-size:12px;color:var(--muted)">${cnt.toLocaleString('de-DE')}</span>
          </div>`;
        }).join('');
        demoHtml += `<div style="flex:1;min-width:280px">
          <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:12px">Altersgruppen</div>
          ${ageBars}
        </div>`;
      }

      if (demoHtml) {
        html += `<div class="card card-pad" style="margin-bottom:16px">
          <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:14px">Demografie</div>
          <div style="display:flex;gap:24px;flex-wrap:wrap">${demoHtml}</div>
          ${demographics.timestamp ? `<div style="font-size:10px;color:var(--muted);margin-top:12px">Stand: ${new Date(demographics.timestamp).toLocaleDateString('de-DE')}</div>` : ''}
        </div>`;
      }
    }

    if (!html) html = '<div class="card card-pad" style="text-align:center;color:var(--muted)">Keine Forensic-Daten vorhanden.</div>';
    wrap.innerHTML = html;
  } catch (e) {
    wrap.innerHTML = `<div class="card card-pad" style="color:var(--red)">Fehler: ${esc(e.message)}</div>`;
  }
}

        <label style="font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px">Caption</label>
        <textarea id="edit-caption" style="width:100%;height:160px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:10px;font-size:13px;font-family:var(--font);resize:vertical">${esc(caption)}</textarea>
      </div>
      <div style="margin-bottom:16px">

      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end">

  `);
}

async function _instaDraftSaveEdit(id) {
  const caption = document.getElementById('edit-caption')?.value || '';
  const hashtagsRaw = document.getElementById('edit-hashtags')?.value || '';
  const hashtags = hashtagsRaw.split(',').map(h => h.trim()).filter(Boolean).map(h => h.startsWith('#') ? h : '#' + h);
  try {
    await apiFetch('/api/instagram/drafts/' + encodeURIComponent(id), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ caption, hashtags })
    });
    closeModal();
    _instaDraftsCache = null;
    loadInstagram();
    _toast('Draft gespeichert');
  } catch (e) {
    _toast('Fehler: ' + e.message);
  }
}

async function _instaDraftPost(id) {
  if (!confirm(`Draft "${id}" als freigegeben markieren?\n\nDanach kannst du im Telegram-Bot /instapost ${id} ausführen.`)) return;
  try {
    await apiFetch('/api/instagram/drafts/' + encodeURIComponent(id), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: 'freigegeben' })
    });
    _instaDraftsCache = null;
    loadInstagram();
    _toast('Draft freigegeben — poste mit /instapost ' + id);
  } catch (e) {
    _toast('Fehler: ' + e.message);
  }
}

async function _instaDraftDelete(id) {
  if (!confirm(`Draft "${id}" wirklich löschen?`)) return;
  try {

  }
}

async function _instaDraftManualToggle(id) {
  const wrap = document.getElementById('manual-post-' + id);
  if (!wrap) return;
  if (wrap.style.display !== 'none') { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  wrap.innerHTML = '<div class="spinner" style="padding:10px">Laden…</div>';

  const draft = (_instaDraftsCache || []).find(d => d.id === id);
  if (!draft) { wrap.innerHTML = '<div style="color:var(--red)">Draft nicht gefunden</div>'; return; }

  // Fetch media files
  let mediaFiles = [];
  try { mediaFiles = await apiFetch('/api/instagram/drafts/' + encodeURIComponent(id) + '/media'); } catch {}

  const caption = draft.caption || '';
  const hashtags = Array.isArray(draft.hashtags) ? draft.hashtags.map(h => h.startsWith('#') ? h : '#' + h).join(' ') : '';
  const fullCaption = caption + (hashtags ? '\n\n' + hashtags : '');

  let html = '<div style="font-size:12px;font-weight:700;margin-bottom:12px;color:var(--text)">📋 Manuell posten</div>';

  // Download section
  if (mediaFiles.length) {
    html += `<div style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px">1. Dateien herunterladen</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${mediaFiles.map(f => `<a href="/dashboard/api/instagram/drafts/${encodeURIComponent(id)}/download/${encodeURIComponent(f.name)}?token=${encodeURIComponent(TOKEN)}" download="${esc(f.name)}" class="btn" style="font-size:11px;padding:4px 10px;background:var(--surface);border:1px solid var(--border);color:var(--accent);text-decoration:none">⬇️ ${esc(f.name)}</a>`).join('')}
      </div>
    </div>`;
  } else {
    html += `<div style="margin-bottom:14px;font-size:12px;color:var(--muted)">Keine Media-Dateien verknüpft — lade die Dateien aus dem Raw-Material.</div>`;
  }

  // Caption copy
  html += `<div style="margin-bottom:14px">
    <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px">2. Caption kopieren</div>
    <div style="position:relative">
      <textarea readonly style="width:100%;height:100px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:10px;font-size:12px;font-family:var(--font);resize:vertical">${esc(fullCaption)}</textarea>
      <button class="btn btn-primary" onclick="navigator.clipboard.writeText(this.parentNode.querySelector('textarea').value);_toast('Caption kopiert')" style="position:absolute;top:6px;right:6px;font-size:10px;padding:3px 8px">📋 Kopieren</button>
    </div>
  </div>`;

  // Hashtags copy (separate)
  if (hashtags) {
    html += `<div style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px">3. Hashtags separat kopieren</div>
      <div style="display:flex;align-items:center;gap:8px">
        <code style="flex:1;background:var(--surface);padding:8px 10px;border-radius:6px;font-size:11px;border:1px solid var(--border);word-break:break-all;color:var(--accent)">${esc(hashtags)}</code>
        <button class="btn btn-primary" onclick="navigator.clipboard.writeText('${esc(hashtags).replace(/'/g, "\\'")}');_toast('Hashtags kopiert')" style="font-size:10px;padding:3px 8px;white-space:nowrap">📋</button>
      </div>
    </div>`;
  }

  // Instructions
  html += `<div style="margin-bottom:4px">
    <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px">${hashtags ? '4' : '3'}. Anleitung</div>
    <ol style="margin:0;padding-left:18px;font-size:12px;color:var(--muted);line-height:1.8">
      <li>Dateien auf Handy herunterladen</li>
      <li>Instagram App öffnen → <strong>+</strong> → Beitrag/Reel erstellen</li>
      <li>Heruntergeladene Dateien auswählen</li>
      <li>Bei Reels: Musik hinzufügen (optional)</li>
      <li>Caption einfügen → <strong>Teilen</strong></li>
    </ol>
  </div>`;

  wrap.innerHTML = html;
}

function _fmtFileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

let _rawDetailSession = null;

async function _instaLoadRaw() {
  const wrap = document.getElementById('rawContent');
  if (!wrap) return;
  if (_rawDetailSession) { _instaRawDetail(_rawDetailSession); return; }
  try {
    const sessions = await apiFetch('/api/instagram/raw');
    if (!sessions.length) {
      wrap.innerHTML = `<div class="card card-pad" style="text-align:center;padding:40px 20px">
        <div style="font-size:36px;margin-bottom:12px">📁</div>
        <div style="color:var(--muted);margin-bottom:16px">Keine Sessions — erstelle eine neue oder sende Dateien via Telegram</div>
        <button class="btn btn-primary" onclick="_instaNewSessionModal()">+ Neue Session</button>
      </div>`;
      return;
    }
    const cards = sessions.map(s => {
      const imgs = s.files ? s.files.filter(f => f.type === 'image').length : 0;
      const vids = s.files ? s.files.filter(f => f.type === 'video').length : 0;
      const parts = [];
      if (vids) parts.push(vids + ' Video' + (vids > 1 ? 's' : ''));
      if (imgs) parts.push(imgs + ' Foto' + (imgs > 1 ? 's' : ''));
      const fileLine = s.fileCount ? s.fileCount + ' Datei' + (s.fileCount > 1 ? 'en' : '') + (parts.length ? ' (' + parts.join(', ') + ')' : '') : 'Keine Dateien';
      return `<div class="card card-pad" style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
          <div style="cursor:pointer" onclick="_rawDetailSession='${esc(s.id)}';_instaLoadRaw()">
            <div style="font-size:14px;font-weight:700">${esc(s.id)}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px">${fmtDT(s.created_at)}</div>
          </div>
          ${_instaStatusBadge(s.status)}
        </div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:12px">📎 ${fileLine}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn" style="font-size:11px;padding:4px 10px;background:var(--surface);border:1px solid var(--border);color:var(--text)" onclick="_instaRawUpload('${esc(s.id)}')">📤 Upload</button>
          <button class="btn" style="font-size:11px;padding:4px 10px;background:var(--surface);border:1px solid var(--border);color:var(--text)" onclick="_rawDetailSession='${esc(s.id)}';_instaLoadRaw()">📄 Details</button>
          <button class="btn" style="font-size:11px;padding:4px 10px;background:var(--surface);border:1px solid var(--border);color:var(--text)" onclick="navigator.clipboard.writeText('/instascan ${esc(s.id)}');_toast('Kopiert: /instascan ${esc(s.id)}')">🔍 Scannen</button>
          <button class="btn" style="font-size:11px;padding:4px 10px;background:var(--surface);border:1px solid rgba(248,113,113,.3);color:var(--red)" onclick="if(confirm('Session ${esc(s.id)} wirklich löschen?'))_instaRawDelete('${esc(s.id)}')">🗑️</button>
        </div>
      </div>`;
    }).join('');
    wrap.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">Raw Material Sessions</div>
      <button class="btn btn-primary" style="font-size:12px;padding:5px 12px" onclick="_instaNewSessionModal()">+ Neue Session</button>
    </div>${cards}`;
  } catch (e) {
    wrap.innerHTML = `<div class="card card-pad" style="color:var(--red)">Fehler: ${esc(e.message)}</div>`;
  }
}

async function _instaRawDetail(sessionId) {
  const wrap = document.getElementById('rawContent');
  if (!wrap) return;
  try {
    const data = await apiFetch('/api/instagram/raw/' + encodeURIComponent(sessionId));
    const s = data.session;
    const files = data.files || [];
    const fileRows = files.length ? files.map(f => {
      const isImg = f.type === 'image';
      return `<tr>
        <td style="font-size:13px">${esc(f.name)}</td>
        <td style="font-size:12px;color:var(--muted)">${f.type === 'image' ? '🖼️' : f.type === 'video' ? '🎬' : '📄'} ${f.type}</td>
        <td style="font-size:12px;color:var(--muted)">${_fmtFileSize(f.size)}</td>
        <td style="font-size:12px;color:var(--muted)">${fmtDT(f.mtime)}</td>
      </tr>`;
    }).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:20px">Keine Dateien</td></tr>';
    wrap.innerHTML = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <button class="btn" style="font-size:12px;padding:4px 10px;background:var(--surface);border:1px solid var(--border);color:var(--muted)" onclick="_rawDetailSession=null;_instaLoadRaw()">← Zurück</button>
      <div>
        <div style="font-size:15px;font-weight:700">${esc(s.id)}</div>
        <div style="font-size:12px;color:var(--muted)">${fmtDT(s.created_at)}</div>
      </div>
      ${_instaStatusBadge(s.status)}
    </div>
    <div style="display:flex;gap:6px;margin-bottom:16px">
      <button class="btn btn-primary" style="font-size:12px;padding:5px 12px" onclick="_instaRawUpload('${esc(s.id)}')">📤 Upload</button>
      <button class="btn" style="font-size:12px;padding:5px 12px;background:var(--surface);border:1px solid var(--border);color:var(--text)" onclick="navigator.clipboard.writeText('/instascan ${esc(s.id)}');_toast('Kopiert: /instascan ${esc(s.id)}')">🔍 Scan triggern</button>
    </div>
    <div class="card card-pad">
      <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:12px">Dateien (${files.length})</div>
      <table><thead><tr><th>Name</th><th>Typ</th><th>Größe</th><th>Geändert</th></tr></thead><tbody>${fileRows}</tbody></table>
    </div>`;
  } catch (e) {
    wrap.innerHTML = `<div class="card card-pad" style="color:var(--red)">Fehler: ${esc(e.message)}</div>`;
  }
}

function _instaNewSessionModal() {
  openModal(`
    <h3 style="margin-bottom:16px">Neue Raw Session</h3>
    <div style="margin-bottom:12px">
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">Kontext/Name (optional)</label>
      <input id="rawCtx" class="inp" placeholder="z.B. drohne-barcelona" style="width:100%;box-sizing:border-box">
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn-ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-primary" onclick="_instaCreateRawSession()">Erstellen</button>
    </div>
  `);
}

async function _instaCreateRawSession() {
  const ctx = document.getElementById('rawCtx')?.value?.trim() || '';
  try {
    await apiFetch('/api/instagram/raw', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ context: ctx || undefined }) });
    closeModal();
    _rawDetailSession = null;
    loadInstagram();
  } catch (e) {
    alert('Fehler: ' + e.message);
  }
}

function _instaRawUpload(sessionId) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.multiple = true;
  inp.accept = 'image/*,video/*';
  inp.onchange = async () => {
    const files = Array.from(inp.files || []);
    if (!files.length) return;
    const wrap = document.getElementById('rawContent');
    for (let i = 0; i < files.length; i++) {
      if (wrap) {
        const prog = wrap.querySelector('#rawUploadProg');
        if (prog) prog.textContent = `Uploading ${i + 1}/${files.length}…`;
        else wrap.insertAdjacentHTML('afterbegin', `<div id="rawUploadProg" class="badge badge-yellow" style="margin-bottom:10px">Uploading ${i + 1}/${files.length}…</div>`);
      }
      const fd = new FormData();
      fd.append('file', files[i]);
      await apiFetch('/api/instagram/raw/' + encodeURIComponent(sessionId) + '/upload', { method: 'POST', body: fd });
    }
    _rawDetailSession = sessionId;
    loadInstagram();
  };
  inp.click();
}

async function _instaRawDelete(sessionId) {
  try {
    await apiFetch('/api/instagram/raw/' + encodeURIComponent(sessionId), { method: 'DELETE' });
    _rawDetailSession = null;

let _tradingRefresh = null;
function fmtUsd(n) { return n != null ? Number(n).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' $' : '–'; }
function pnlColor(n) { return n > 0 ? 'var(--green)' : n < 0 ? 'var(--red)' : 'var(--muted)'; }
function pnlPrefix(n) { return n > 0 ? '+' : ''; }

async function loadTrading() {
  const c = document.getElementById('content');
  if (_tradingRefresh) { clearInterval(_tradingRefresh); _tradingRefresh = null; }

  async function render() {
    let status, watchlist, strategies, universe, universeConfig, universeTop;
    try {
      [status, watchlist, strategies, universe, universeConfig, universeTop] = await Promise.all([
        apiFetch('/api/trading/status'),
        apiFetch('/api/trading/watchlist'),
        apiFetch('/api/trading/strategies'),
        apiFetch('/api/trading/universe').catch(() => null),
        apiFetch('/api/trading/universe/config').catch(() => null),
        apiFetch('/api/trading/universe/top').catch(() => null),
      ]);
    } catch { status = null; watchlist = []; strategies = {}; universe = null; universeConfig = null; universeTop = null; }

    if (!status || status.error) {
      c.innerHTML = `<div class="empty" style="text-align:center;padding:60px 20px">
        <div style="font-size:48px;margin-bottom:16px">📈</div>
        <h2 style="margin-bottom:8px;color:var(--fg)">Trading</h2>
        <p style="color:var(--muted);font-size:14px">Service nicht verbunden.</p>
        <p style="color:var(--muted);font-size:12px;margin-top:8px">${esc(status?.error || 'Trading-Agent ist nicht erreichbar.')}</p>
      </div>`;
      stamp();
      return;
    }

    const modeLabel = status.mode === 1 ? 'Monitoring' : status.mode === 2 ? 'Semi-Auto' : 'Full-Auto';
    const modeBadge = status.mode === 1 ? 'badge-blue' : status.mode === 2 ? 'badge-yellow' : 'badge-red';
    const connBadge = status.connected ? 'badge-green' : 'badge-red';
    const connLabel = status.connected ? 'Verbunden' : 'Nicht verbunden';

    // KPI cards
    const kpiHtml = `<div class="summary-grid">
      <div class="s-card"><div class="lbl">Modus</div><div class="val" style="font-size:18px"><span class="badge ${modeBadge}">${modeLabel}</span></div></div>
      <div class="s-card"><div class="lbl">Verbindung</div><div class="val" style="font-size:18px"><span class="badge ${connBadge}">${connLabel}</span></div><div class="sub">${status.paperMode ? 'Paper Trading' : 'Live'}</div></div>
      <div class="s-card"><div class="lbl">Tages-P&amp;L</div><div class="val" style="font-size:22px;color:${pnlColor(status.dailyPnl)}">${pnlPrefix(status.dailyPnl)}${fmtUsd(status.dailyPnl)}</div></div>
      <div class="s-card"><div class="lbl">Unrealisiert P&amp;L</div><div class="val" style="font-size:22px;color:${pnlColor(status.unrealizedPnl)}">${pnlPrefix(status.unrealizedPnl)}${fmtUsd(status.unrealizedPnl)}</div></div>
      <div class="s-card"><div class="lbl">Net Liquidation</div><div class="val" style="font-size:22px">${fmtUsd(status.netLiquidation)}</div></div>
      <div class="s-card"><div class="lbl">Cash</div><div class="val" style="font-size:22px">${fmtUsd(status.cashBalance)}</div></div>
    </div>`;

    // Positions table
    let posHtml = '';
    if (status.positions && status.positions.length > 0) {
      const rows = status.positions.map(p => `<tr>
        <td><strong>${esc(p.symbol)}</strong></td>
        <td>${esc(p.exchange)}</td>
        <td style="text-align:right">${p.quantity}</td>
        <td style="text-align:right">${fmtUsd(p.avgCost)}</td>
        <td style="text-align:right">${fmtUsd(p.marketPrice)}</td>
        <td style="text-align:right">${fmtUsd(p.marketValue)}</td>

        <tbody>${rows}</tbody>
      </table></div>`;
    } else {

    }

    // Watchlist
    const wlRows = (watchlist || []).map(w => `<tr>
      <td><strong>${esc(w.symbol)}</strong></td>
      <td>${esc(w.exchange)}</td>
      <td>${esc(w.currency)}</td>

      <input id="wl-symbol" placeholder="Symbol" style="width:90px;padding:6px 8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);color:var(--fg);font-size:13px">

    }

    c.innerHTML = kpiHtml + posHtml + uniHtml + wlHtml + stratHtml;
    stamp();
  }

  await render();
  _tradingRefresh = setInterval(() => { if (currentTab === 'trading') render(); }, 30000);
}

async function tradingAddWatch() {
  const symbol = document.getElementById('wl-symbol').value.trim().toUpperCase();
  const exchange = document.getElementById('wl-exchange').value.trim() || 'SMART';
  const currency = document.getElementById('wl-currency').value.trim() || 'USD';
  if (!symbol) return;
  try {
    await apiFetch('/api/trading/watchlist', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ symbol, exchange, currency }) });
    loadTrading();
  } catch (e) { alert('Fehler: ' + e.message); }

async function tradingRemoveWatch(symbol) {
  try {
    await apiFetch('/api/trading/watchlist/' + encodeURIComponent(symbol), { method: 'DELETE' });

}

async function toggleUniverseIndex(name, enabled) {
  try {
    await apiFetch('/api/trading/universe/config', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ indices: { [name]: { enabled } } }),

  } catch (e) { alert('Fehler: ' + e.message); }
}

async function triggerUniverseScan() {
  const btn = document.getElementById('uni-scan-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Scannt...'; }
  try {
    const result = await apiFetch('/api/trading/universe/scan', { method: 'POST' });
    if (result) alert(`Scan fertig: ${result.universe} Symbole, ${result.momentum} Momentum, ${result.meanReversion} Mean-Rev`);
    loadTrading();
  } catch (e) {
    alert('Scan-Fehler: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Scan starten'; }
  }
}

  const c = document.getElementById('content');

    }

    const totalInvested = investments.reduce((s, i) => s + (i.investedAmount || 0), 0);
    const totalValuation = investments.reduce((s, i) => s + (i.currentValuation || 0), 0);
    const active = investments.filter(i => i.status === 'active').length;
    const totalIRR = totalInvested > 0 ? ((totalValuation / totalInvested - 1) * 100) : 0;

    const summaryHtml = `<div class="summary-grid">
      <div class="s-card"><div class="lbl">Total investiert</div><div class="val" style="font-size:20px">${fmtEur(totalInvested)}</div></div>

      <div class="s-card"><div class="lbl">Gesamt-IRR</div><div class="val" style="font-size:20px;color:${totalIRR >= 0 ? 'var(--green)' : 'var(--red)'}">${totalIRR.toFixed(1)}%</div></div>
      <div class="s-card"><div class="lbl">Beteiligungen</div><div class="val">${investments.length}</div><div class="sub">${active} aktiv</div></div>
    </div>`;

    const cards = investments.map(inv => {
      const irr = peCalcIRR(inv);
      const statusBadge = inv.status === 'active' ? '<span class="badge badge-green">Aktiv</span>'
        : inv.status === 'exited' ? '<span class="badge badge-blue">Exited</span>'
        : '<span class="badge badge-red">Written-off</span>';
      return `<div class="card card-pad" style="cursor:pointer" onclick="peShowDetail('${esc(inv.id)}')">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">

        </div>

      </div>`;
    }).join('');

      `<div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 12px">

    stamp();
  } catch (e) {
    c.innerHTML = `<div class="empty">Fehler beim Laden: ${esc(e.message)}</div>`;
  }

function peCalcIRR(inv) {
  if (!inv.investmentDate || !inv.valuationDate || !inv.investedAmount || inv.investedAmount <= 0) return 0;
  const start = new Date(inv.investmentDate), end = new Date(inv.valuationDate);
  const years = (end - start) / (365.25 * 86400000);
  if (years <= 0) return 0;
  const ratio = inv.currentValuation / inv.investedAmount;
  if (ratio <= 0) return -100;
  return (Math.pow(ratio, 1 / years) - 1) * 100;
}

/* ── Status Widget ── */
let _statusRefresh = null;

function fmtUptime(sec) {
  if (!sec || sec <= 0) return '–';
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  if (d > 0) return d + 'd ' + h + 'h';
  const m = Math.floor((sec % 3600) / 60);
  return h > 0 ? h + 'h ' + m + 'm' : m + 'm';
}

async function loadStatus() {
  if (_statusRefresh) { clearInterval(_statusRefresh); _statusRefresh = null; }
  const c = document.getElementById('content');
  try {
    const d = await apiFetch('/api/dashboard/status');

    // Services
    const svcOrder = ['Core','Dashboard','Trading','n8n','Postgres','IB Gateway'];
    const svcMap = {};
    (d.services || []).forEach(s => { svcMap[s.name] = s; });
    const svcHtml = svcOrder.map(name => {
      const s = svcMap[name] || { status: 'unknown', uptime_seconds: 0 };
      const dot = s.status === 'up' ? '🟢' : s.status === 'down' ? '🔴' : '🟡';
      const badge = s.status === 'up' ? 'badge-green' : s.status === 'down' ? 'badge-red' : 'badge-muted';
      return `<tr>
        <td style="padding:6px 12px;white-space:nowrap">${dot} ${esc(name)}</td>
        <td style="padding:6px 12px"><span class="badge ${badge}">${esc(s.status)}</span></td>
        <td style="padding:6px 12px;color:var(--muted);font-size:12px">${s.status === 'up' ? 'uptime ' + fmtUptime(s.uptime_seconds) : ''}</td>
      </tr>`;
    }).join('');

    // Backup
    const backupTime = d.backup?.last ? fmtDT(d.backup.last) : '–';
    const backupIsToday = d.backup?.last && new Date(d.backup.last).toDateString() === new Date().toDateString();
    const backupDot = d.backup?.last ? (backupIsToday ? '🟢' : '🟡') : '🔴';

    // Tokens
    const tokenHtml = (d.tokens || []).map(t => {
      const dot = t.days_remaining > 14 ? '🟢' : t.days_remaining > 7 ? '🟡' : '🔴';
      return `${dot} ${esc(t.name)} ${t.days_remaining}d`;
    }).join(', ') || '–';

    // Workflows
    const wfCount = d.workflows?.pending || 0;
    const wfTypes = (d.workflows?.types || []).join(', ');
    const wfDot = wfCount === 0 ? '🟢' : '🟡';

    c.innerHTML = `
      <div class="card card-pad" style="margin-bottom:16px">
        <div style="font-weight:600;margin-bottom:12px;font-size:14px">Services</div>
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          ${svcHtml}
        </table>
      </div>
      <div class="summary-grid">
        <div class="s-card">
          <div class="lbl">Letzter Backup</div>
          <div class="val" style="font-size:16px">${backupDot} ${backupTime}</div>
          <div class="sub">${backupIsToday ? 'heute' : d.backup?.last ? 'nicht heute' : 'kein Backup'}</div>
        </div>
        <div class="s-card">
          <div class="lbl">Token-Health</div>
          <div class="val" style="font-size:16px">${tokenHtml}</div>
        </div>
        <div class="s-card">
          <div class="lbl">Workflows pending</div>
          <div class="val" style="font-size:16px">${wfDot} ${wfCount}</div>
          <div class="sub">${wfTypes || 'keine'}</div>
        </div>
      </div>
      ${d._stale ? '<div style="color:var(--muted);font-size:11px;margin-top:12px">Cache veraltet — Core nicht erreichbar</div>' : ''}
    `;
    stamp();

    _statusRefresh = setInterval(() => {
      if (currentTab === 'status') loadStatus();
    }, 60_000);
  } catch (e) {
    c.innerHTML = '<div class="empty">Fehler: ' + esc(e.message) + '</div>';
  }
}
